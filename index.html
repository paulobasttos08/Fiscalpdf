<style>

<body>

<div class="wrap">

<div class="app">

<header class="head">

  <div class="brand">

    <div class="logo">
      NF-e
    </div>

    <div>
      <h1>FiscalPDF</h1>
      <p>
        Organize NF-e e NFC-e pelo <b>destinatário</b>
      </p>
    </div>

  </div>

</header>

<main class="body">

<div class="mode-title">
  Como deseja analisar o PDF?
</div>

<div class="mode-grid">

  <!-- PDF ORIGINAL -->

  <label class="mode-option selected" id="modeOriginal">

    <input
      type="radio"
      name="mode"
      value="original"
      checked
    >

    <div class="mode-top">
      <span class="mode-icon">📄</span>
      <span>PDF ORIGINAL</span>
    </div>

    <p>
      Use quando o PDF possuir texto selecionável.
      É mais rápido e não precisa de OCR.
    </p>

    <span class="mode-tag">
      LEITURA DIRETA
    </span>

  </label>


  <!-- PDF DIGITALIZADO -->

  <label class="mode-option" id="modeScanned">

    <input
      type="radio"
      name="mode"
      value="scanned"
    >

    <div class="mode-top">
      <span class="mode-icon">🖨️</span>
      <span>PDF DIGITALIZADO</span>
    </div>

    <p>
      Use quando o documento foi escaneado ou
      composto por imagens. O sistema utilizará OCR.
    </p>

    <span class="mode-tag">
      OCR
    </span>

  </label>

</div>


<label class="drop" for="files">

  <div class="drop-icon">
    📄
  </div>

  <b>
    Selecionar arquivos PDF
  </b>

  <span>
    ou arraste e solte seus PDFs fiscais aqui
  </span>

</label>

<input
  id="files"
  type="file"
  accept=".pdf,application/pdf"
  multiple
>


<div class="actions">

  <button
    id="clear"
    class="btn clear"
    disabled
  >
    Limpar
  </button>

  <button
    id="analyze"
    class="btn main"
    disabled
  >
    🔎 Analisar PDFs
  </button>

</div>


<div id="status" class="status"></div>

<div id="progress" class="progress"></div>

<div id="fileList"></div>

<div id="results" class="results"></div>

</main>

</div>

</div>


<script>

/* =========================================================
   PDF.JS
========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================================
   VARIÁVEIS
========================================================= */

const $ = x => document.getElementById(x);

let files = [];

let groups = new Map();


/* =========================================================
   LIMPEZA
========================================================= */

function clean(s){

  return String(s || "")
    .replace(/[\\/:*?"<>|]/g," ")
    .replace(/\s+/g," ")
    .trim();

}


function normalize(s){

  return String(s || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toUpperCase()
    .replace(/\s+/g," ")
    .trim();

}


function dig(s){

  return String(s || "")
    .replace(/\D/g,"");

}


/* =========================================================
   VALIDAÇÃO CNPJ
========================================================= */

function valid(c){

  c = dig(c);

  if(
    c.length !== 14 ||
    /^(\d)\1+$/.test(c)
  ){
    return false;
  }


  let sum = 0;
  let w = 5;

  for(let i=0;i<12;i++){

    sum += +c[i] * w;

    w = w === 2 ? 9 : w - 1;

  }


  let d =
    sum % 11 < 2
      ? 0
      : 11 - sum % 11;


  if(d !== +c[12]){
    return false;
  }


  sum = 0;
  w = 6;

  for(let i=0;i<13;i++){

    sum += +c[i] * w;

    w = w === 2 ? 9 : w - 1;

  }


  d =
    sum % 11 < 2
      ? 0
      : 11 - sum % 11;


  return d === +c[13];

}


/* =========================================================
   FORMATA CNPJ
========================================================= */

function fmt(c){

  return c.replace(
    /(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,
    "$1.$2.$3/$4-$5"
  );

}


/* =========================================================
   STATUS
========================================================= */

function status(t,c){

  $("status").textContent = t;

  $("status").className =
    "status show " + c;

}


/* =========================================================
   ARQUIVOS
========================================================= */

function renderFiles(){

  $("fileList").innerHTML =
    files.map((f,i)=>{

      const size =
        f.size
          ? ` ${Math.round(f.size/1024)} KB`
          : "";

      return `
        <div class="file">
          📄 ${i+1}. ${clean(f.name)}
          <span style="float:right;color:#667085">
            ${size}
          </span>
        </div>
      `;

    }).join("");


  $("analyze").disabled =
    !files.length;

  $("clear").disabled =
    !files.length;

}


function add(a){

  let p = a.filter(f =>
    f.type === "application/pdf" ||
    /\.pdf$/i.test(f.name)
  );


  if(!p.length){

    status(
      "Selecione um PDF válido.",
      "err"
    );

    return;
  }


  files.push(...p);

  renderFiles();


  status(
    `${files.length} PDF(s) selecionado(s). Clique em Analisar PDFs.`,
    "ok"
  );

}


/* =========================================================
   INPUT
========================================================= */

$("files").onchange = () => {

  add([...$("files").files]);

};


/* =========================================================
   DRAG AND DROP
========================================================= */

let drop =
  document.querySelector(".drop");


drop.ondragover = e => {

  e.preventDefault();

  drop.style.borderColor =
    "#0877d1";

};


drop.ondragleave = () => {

  drop.style.borderColor =
    "#63a9e9";

};


drop.ondrop = e => {

  e.preventDefault();

  drop.style.borderColor =
    "#63a9e9";

  add([...e.dataTransfer.files]);

};


/* =========================================================
   LIMPAR
========================================================= */

$("clear").onclick = () => {

  files = [];

  groups.clear();

  $("files").value = "";

  $("fileList").innerHTML = "";

  $("results").innerHTML = "";

  $("results").className =
    "results";

  $("status").className =
    "status";

  $("progress").textContent =
    "";

};


/* =========================================================
   MODO
========================================================= */

document
.querySelectorAll('input[name="mode"]')
.forEach(input => {

  input.addEventListener("change",()=>{

    $("modeOriginal")
      .classList.toggle(
        "selected",
        input.value === "original" &&
        input.checked
      );


    $("modeScanned")
      .classList.toggle(
        "selected",
        input.value === "scanned" &&
        input.checked
      );

  });

});


function getMode(){

  return document
    .querySelector(
      'input[name="mode"]:checked'
    )
    .value;

}


/* =========================================================
   CNPJ
========================================================= */

function findCnpj(s){

  let a = String(s || "").match(
    /\d{2}[.\s]?\d{3}[.\s]?\d{3}[\/\s]?\d{4}[-\s]?\d{2}/g
  ) || [];


  for(let x of a){

    if(valid(x)){
      return dig(x);
    }

  }


  return null;

}


/* =========================================================
   IDENTIFICA SE É UMA LINHA DE CAMPO
========================================================= */

function isFieldLine(s){

  const n = normalize(s);

  if(!n){
    return true;
  }


  const fields = [
    "DESTINATARIO",
    "DESTINATARIO/REMETENTE",
    "REMETENTE",
    "EMITENTE",
    "NOME",
    "RAZAO SOCIAL",
    "NOME / RAZAO SOCIAL",
    "CNPJ",
    "CNPJ/CPF",
    "CPF",
    "IE",
    "INSCRICAO",
    "INSCRICAO ESTADUAL",
    "ENDERECO",
    "ENDEREÇO",
    "CEP",
    "MUNICIPIO",
    "MUNICÍPIO",
    "UF",
    "FONE",
    "TELEFONE",
    "DATA",
    "DATA DA EMISSAO",
    "DATA DA EMISSÃO",
    "EMISSAO",
    "EMISSÃO",
    "DANFE",
    "DOCUMENTO AUXILIAR",
    "NOTA FISCAL ELETRONICA",
    "NOTA FISCAL ELETRÔNICA"
  ];


  if(fields.includes(n)){
    return true;
  }


  /* Linha que contém somente números,
     pontuação ou dados de documento */

  if(/^[\d\s./()\-:+]+$/.test(n)){
    return true;
  }


  /* Linhas claramente relacionadas
     a outros campos da NF-e */

  if(
    /\bCPF\b|\bCNPJ\b|\bIE\b|INSCRICAO|ENDERECO|CEP|MUNICIPIO|UF|FONE|TELEFONE/.test(n)
    &&
    !/[A-Z]{4,}/.test(
      n.replace(
        /\b(CPF|CNPJ|IE|INSCRICAO|ENDERECO|CEP|MUNICIPIO|UF|FONE|TELEFONE)\b/g,
        ""
      )
    )
  ){
    return true;
  }


  return false;

}


/* =========================================================
   REMOVE CABEÇALHOS DO OCR
========================================================= */

function removeFieldLabels(s){

  let x = cleanName(s);


  x = x.replace(
    /NOME\s*\/?\s*RAZ[ÃA]O\s*SOCIAL/gi,
    ""
  );

  x = x.replace(
    /RAZ[ÃA]O\s*SOCIAL/gi,
    ""
  );

  x = x.replace(
    /DESTINAT[ÁA]RIO\s*\/?\s*REMETENTE/gi,
    ""
  );

  x = x.replace(
    /DESTINAT[ÁA]RIO/gi,
    ""
  );

  x = x.replace(
    /CNPJ\s*\/?\s*CPF/gi,
    ""
  );

  x = x.replace(
    /\bCNPJ\b/gi,
    ""
  );

  x = x.replace(
    /\bCPF\b/gi,
    ""
  );

  x = x.replace(
    /\bIE\b/gi,
    ""
  );

  x = x.replace(
    /INSCRI[ÇC][ÃA]O\s+ESTADUAL/gi,
    ""
  );

  x = x.replace(
    /DATA\s+DA\s+EMISS[ÃA]O/gi,
    ""
  );

  x = x.replace(
    /DATA\s+EMISS[ÃA]O/gi,
    ""
  );

  x = x.replace(
    /EMISS[ÃA]O/gi,
    ""
  );

  x = x.replace(
    /\bCEP\b/gi,
    ""
  );

  x = x.replace(
    /ENDERE[ÇC]O/gi,
    ""
  );

  x = x.replace(
    /MUNIC[ÍI]PIO/gi,
    ""
  );

  x = x.replace(
    /\bUF\b/gi,
    ""
  );

  x = x.replace(
    /FONE|TELEFONE/gi,
    ""
  );


  /* Remove números de CNPJ */

  x = x.replace(
    /\d{2}[.\s]?\d{3}[.\s]?\d{3}[\/\s]?\d{4}[-\s]?\d{2}/g,
    ""
  );


  x = clean(x)
    .replace(/^[:;,.|\-–—]+/,"")
    .replace(/[:;,.|\-–—]+$/,"")
    .trim();


  return x;

}


/* =========================================================
   NOME VÁLIDO
========================================================= */

function isBadName(s){

  let n = normalize(s);


  if(!n){
    return true;
  }


  if(n.length < 3){
    return true;
  }


  if(
    isFieldLine(n)
  ){
    return true;
  }


  if(
    /^(NOME|RAZAO|SOCIAL|CNPJ|CPF|IE|INSCRICAO)$/.test(n)
  ){
    return true;
  }


  if(
    /DESTINATARIO|REMETENTE|EMITENTE/.test(n)
  ){
    return true;
  }


  if(
    /DANFE|DOCUMENTO AUXILIAR|NOTA FISCAL/.test(n)
  ){
    return true;
  }


  /* Não aceita linha que seja somente
     número/documento */

  if(
    /^\d[\d\s./():-]*$/.test(n)
  ){
    return true;
  }


  /* Precisa possuir letras */

  if(
    !/[A-ZÀ-Ÿ]{3}/.test(n)
  ){
    return true;
  }


  return false;

}


/* =========================================================
   LIMPA NOME
========================================================= */

function cleanName(s){

  return removeFieldLabels(s)
    .replace(
      /^[:;,.|\-–—]+/,
      ""
    )
    .replace(
      /[:;,.|\-–—]+$/,
      ""
    )
    .trim();

}


/* =========================================================
   EXTRAI NOME DE UM BLOCO OCR
========================================================= */

function nameFromBlock(block){

  if(!block || !block.length){
    return null;
  }


  const lines =
    block
      .map(x => clean(x))
      .filter(Boolean);


  /*
    PRIMEIRA TENTATIVA:

    Procurar uma linha contendo
    "NOME / RAZÃO SOCIAL".

    Exemplo OCR:

    NOME / RAZÃO SOCIAL
    EMPRESA TESTE LTDA
    CNPJ/CPF
    12.345.678/0001-90
  */

  for(let i=0;i<lines.length;i++){

    const line = lines[i];


    if(
      /NOME\s*\/?\s*RAZ[ÃA]O\s*SOCIAL/i.test(line) ||
      /RAZ[ÃA]O\s*SOCIAL/i.test(line)
    ){

      let value =
        line
          .replace(
            /.*?NOME\s*\/?\s*RAZ[ÃA]O\s*SOCIAL\s*[:\-]?/i,
            ""
          )
          .replace(
            /.*?RAZ[ÃA]O\s*SOCIAL\s*[:\-]?/i,
            ""
          )
          .trim();


      value = cleanName(value);


      if(
        value &&
        !isBadName(value)
      ){
        return value;
      }


      /*
        Nome está provavelmente na linha seguinte.
      */

      for(
        let j=i+1;
        j<Math.min(i+6,lines.length);
        j++
      ){

        let candidate =
          cleanName(lines[j]);


        if(
          !candidate ||
          isBadName(candidate)
        ){
          continue;
        }


        /*
          Não pegar endereço ou documentos.
        */

        if(
          /ENDERECO|MUNICIPIO|CEP|FONE|TELEFONE|CNPJ|CPF|IE|INSCRICAO/.test(
            normalize(candidate)
          )
        ){
          continue;
        }


        return candidate;

      }

    }

  }


  /*
    SEGUNDA TENTATIVA:

    Quando OCR junta tudo:

    NOME RAZÃO SOCIAL EMPRESA ABC LTDA CNPJ CPF
  */

  const joined =
    lines.join(" ");


  let patterns = [

    /NOME\s*\/?\s*RAZ[ÃA]O\s*SOCIAL\s*[:\-]?\s*(.*?)(?=\s+CNPJ|\s+CPF|\s+IE|\s+INSCRICAO|\s+DATA|\s+ENDERECO|$)/i,

    /RAZ[ÃA]O\s*SOCIAL\s*[:\-]?\s*(.*?)(?=\s+CNPJ|\s+CPF|\s+IE|\s+INSCRICAO|\s+DATA|\s+ENDERECO|$)/i,

    /NOME\s*[:\-]?\s*(.*?)(?=\s+CNPJ|\s+CPF|\s+IE|\s+INSCRICAO|\s+DATA|\s+ENDERECO|$)/i

  ];


  for(const re of patterns){

    const m =
      joined.match(re);


    if(m){

      const candidate =
        cleanName(m[1]);


      if(
        candidate &&
        !isBadName(candidate)
      ){
        return candidate;
      }

    }

  }


  return null;

}


/* =========================================================
   DESTINATÁRIO — PDF ORIGINAL
========================================================= */

function recipientOriginal(raw){

  if(!raw){

    return {
      c:null,
      n:"Destinatário não identificado"
    };

  }


  /*
    Para PDF ORIGINAL, preservamos a leitura
    por texto selecionável.
  */

  const text =
    String(raw)
      .replace(/\r/g,"\n");


  const lines =
    text
      .split(/\n/)
      .map(x=>clean(x))
      .filter(Boolean);


  /*
    Procura especificamente a área
    DESTINATÁRIO.
  */

  for(let i=0;i<lines.length;i++){

    if(
      /DESTINAT[ÁA]RIO|DESTINATARIO/i.test(lines[i])
    ){

      const block =
        lines.slice(i,i+30);


      const c =
        findCnpj(
          block.join("\n")
        );


      if(c){

        const n =
          nameFromBlock(block);


        return {
          c,
          n:n || "Destinatário não identificado"
        };

      }

    }

  }


  /*
    Segunda tentativa por NOME/RAZÃO SOCIAL.
  */

  for(let i=0;i<lines.length;i++){

    if(
      /NOME\s*\/?\s*RAZ[ÃA]O\s*SOCIAL|RAZAO\s*SOCIAL/i.test(
        lines[i]
      )
    ){

      const block =
        lines.slice(
          Math.max(0,i-2),
          i+15
        );


      const c =
        findCnpj(
          block.join("\n")
        );


      if(c){

        const n =
          nameFromBlock(block);


        return {
          c,
          n:n || "Destinatário não identificado"
        };

      }

    }

  }


  return {
    c:null,
    n:"Destinatário não identificado"
  };

}


/* =========================================================
   DESTINATÁRIO — OCR
========================================================= */

function recipientOCR(ocrData){

  if(!ocrData){

    return {
      c:null,
      n:"Destinatário não identificado"
    };

  }


  /*
    Tesseract normalmente fornece
    data.lines.

    Isso é muito melhor do que pegar
    todo o OCR em uma única string.
  */

  let lines = [];


  if(
    ocrData.lines &&
    Array.isArray(ocrData.lines)
  ){

    lines =
      ocrData.lines
        .map(x =>
          typeof x === "string"
            ? x
            : x.text
        )
        .map(x=>clean(x))
        .filter(Boolean);

  }


  /*
    Fallback caso lines não exista.
  */

  if(!lines.length){

    lines =
      String(
        ocrData.text || ""
      )
      .split(/\n/)
      .map(x=>clean(x))
      .filter(Boolean);

  }


  /*
    Normaliza OCR comum.
  */

  const normalizedLines =
    lines.map(x=>normalize(x));


  /*
    Cabeçalhos possíveis.
  */

  const headerRegex =
    /DESTINAT[ÁAÃ]RIO|DESTINATARIO|DESTINAT[ÁAÃ]RIO\/REMETENTE|NOME\s*\/?\s*RAZ[ÃA]O\s*SOCIAL/;


  /*
    Procura o bloco do destinatário.
  */

  for(let i=0;i<normalizedLines.length;i++){

    if(
      headerRegex.test(
        normalizedLines[i]
      )
    ){

      /*
        Área do destinatário.
        Normalmente CNPJ e nome ficam
        próximos do cabeçalho.
      */

      const block =
        lines.slice(
          i,
          Math.min(
            i+35,
            lines.length
          )
        );


      const c =
        findCnpj(
          block.join("\n")
        );


      if(!c){
        continue;
      }


      /*
        Procura o nome no bloco.
      */

      let n =
        nameFromBlock(block);


      /*
        Se o OCR não reconheceu
        "NOME / RAZÃO SOCIAL" corretamente,
        procura uma linha textual válida
        antes do CNPJ.
      */

      if(!n){

        const cnpjIndex =
          block.findIndex(
            x => !!findCnpj(x)
          );


        const limit =
          cnpjIndex >= 0
            ? cnpjIndex
            : block.length;


        for(let j=1;j<limit;j++){

          const candidate =
            cleanName(block[j]);


          if(
            !candidate ||
            isBadName(candidate)
          ){
            continue;
          }


          const norm =
            normalize(candidate);


          /*
            Evita pegar dados do documento.
          */

          if(
            /DESTINATARIO|REMETENTE|EMITENTE|CNPJ|CPF|IE|INSCRICAO|ENDERECO|CEP|MUNICIPIO|UF|FONE|DATA|EMISSAO|DANFE/.test(norm)
          ){
            continue;
          }


          n =
            candidate;

          break;

        }

      }


      /*
        Caso a linha do cabeçalho esteja
        grudada com o nome, tenta extrair
        o trecho antes de CNPJ/CPF.
      */

      if(!n){

        const joined =
          block.join(" ");


        const posCnpj =
          joined.search(
            /\bCNPJ\b|\bCPF\b|\d{2}[.\s]?\d{3}[.\s]?\d{3}[\/\s]?\d{4}[-\s]?\d{2}/i
          );


        if(posCnpj > 0){

          let before =
            joined.substring(
              0,
              posCnpj
            );


          before =
            before.replace(
              /.*?NOME\s*\/?\s*RAZ[ÃA]O\s*SOCIAL/i,
              ""
            );


          before =
            before.replace(
              /.*?RAZ[ÃA]O\s*SOCIAL/i,
              ""
            );


          before =
            before.replace(
              /DESTINAT[ÁAÃ]RIO.*?/i,
              ""
            );


          before =
            cleanName(before);


          if(
            before &&
            !isBadName(before)
          ){
            n=before;
          }

        }

      }


      return {
        c,
        n:n || "Destinatário não identificado"
      };

    }

  }


  /*
    Fallback OCR:

    Procura qualquer NOME/RAZÃO SOCIAL
    e procura CNPJ próximo.

    IMPORTANTE:
    não usamos simplesmente o primeiro
    CNPJ da página.
  */

  for(let i=0;i<normalizedLines.length;i++){

    if(
      /NOME\s*\/?\s*RAZ[ÃA]O\s*SOCIAL|RAZAO\s*SOCIAL/.test(
        normalizedLines[i]
      )
    ){

      const block =
        lines.slice(
          Math.max(0,i-3),
          Math.min(i+20,lines.length)
        );


      const c =
        findCnpj(
          block.join("\n")
        );


      if(c){

        const n =
          nameFromBlock(block);


        return {
          c,
          n:n || "Destinatário não identificado"
        };

      }

    }

  }


  /*
    Última tentativa:
    localizar DESTINATÁRIO mesmo
    quando o OCR separou as letras.
  */

  const fullText =
    lines.join(" ");


  const destMatch =
    fullText.match(
      /DESTINAT[ÁAÃ]RIO[\s\S]{0,1500}/i
    );


  if(destMatch){

    const section =
      destMatch[0];


    const c =
      findCnpj(section);


    if(c){

      const n =
        nameFromBlock(
          section
            .split(
              /(?=NOME|RAZAO|CNPJ|CPF|IE|ENDERECO|CEP|MUNICIPIO)/i
            )
            .map(x=>clean(x))
            .filter(Boolean)
        );


      return {
        c,
        n:n || "Destinatário não identificado"
      };

    }

  }


  return {
    c:null,
    n:"Destinatário não identificado"
  };

}


/* =========================================================
   OCR
========================================================= */

async function ocr(page){

  let viewport =
    page.getViewport({
      scale:3.2
    });


  let canvas =
    document.createElement("canvas");


  let ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently:true
      }
    );


  canvas.width =
    Math.ceil(viewport.width);

  canvas.height =
    Math.ceil(viewport.height);


  await page.render({
    canvasContext:ctx,
    viewport:viewport
  }).promise;


  $("progress").textContent =
    "Preparando OCR...";


  const result =
    await Tesseract.recognize(
      canvas,
      "por",
      {
        logger:m=>{

          if(
            m.status ===
            "recognizing text"
          ){

            $("progress").textContent =
              `OCR: ${Math.round(
                (m.progress || 0)*100
              )}%`;

          }

        }
      }
    );


  return result;

}


/* =========================================================
   ANALISAR
========================================================= */

$("analyze").onclick =
  analyze;


async function analyze(){

  $("analyze").disabled =
    true;


  groups.clear();


  $("results").innerHTML =
    "";

  $("results").className =
    "results";


  const mode =
    getMode();


  status(
    mode === "original"
      ? "Analisando PDF ORIGINAL pelo DESTINATÁRIO..."
      : "Analisando PDF DIGITALIZADO pelo OCR e DESTINATÁRIO...",
    "warn"
  );


  let total = 0;

  let ocrPages = 0;

  let unknown = 0;


  try{

    for(const f of files){

      const pdf =
        await pdfjsLib.getDocument({
          data:new Uint8Array(
            await f.arrayBuffer()
          )
        }).promise;


      total +=
        pdf.numPages;


      for(
        let p=1;
        p<=pdf.numPages;
        p++
      ){

        $("progress").textContent =
          `Analisando ${f.name}: página ${p} de ${pdf.numPages}`;


        const page =
          await pdf.getPage(p);


        let r = null;


        /* =================================================
           PDF DIGITALIZADO
        ================================================= */

        if(mode === "scanned"){

          const o =
            await ocr(page);


          ocrPages++;


          r =
            recipientOCR(o.data);

        }


        /* =================================================
           PDF ORIGINAL
        ================================================= */

        else{

          const tc =
            await page.getTextContent();


          /*
            Mantém as quebras de linha
            do PDF quando possível.
          */

          let text =
            tc.items
              .map(x => x.str || "")
              .join(" ");


          r =
            recipientOriginal(text);


          /*
            OCR de reforço somente se
            leitura direta não encontrou.
          */

          if(!r.c){

            try{

              const o =
                await ocr(page);


              if(
                o &&
                o.data &&
                o.data.text
              ){

                ocrPages++;


                const rr =
                  recipientOCR(
                    o.data
                  );


                if(rr.c){
                  r=rr;
                }

              }

            }catch(e){

              console.warn(
                "OCR de reforço indisponível:",
                e
              );

            }

          }

        }


        /*
          Não encontrou CNPJ do destinatário.
        */

        if(!r || !r.c){

          unknown++;

          continue;

        }


        /*
          Cria grupo pelo CNPJ.
        */

        if(!groups.has(r.c)){

          groups.set(
            r.c,
            {
              name:
                r.n ||
                "Destinatário não identificado",

              pages:[]
            }
          );

        }


        const g =
          groups.get(r.c);


        /*
          Se já havia grupo sem nome,
          atualiza quando encontrar nome.
        */

        if(
          (!g.name ||
           g.name === "Destinatário não identificado") &&
          r.n &&
          r.n !== "Destinatário não identificado"
        ){

          g.name =
            r.n;

        }


        g.pages.push({
          f,
          p
        });

      }

    }


    render();


    if(!groups.size){

      status(
        "Não foi possível identificar o CNPJ do DESTINATÁRIO. Confira se o documento contém a área DESTINATÁRIO / NOME / RAZÃO SOCIAL.",
        "err"
      );

    }else{

      status(
        `${groups.size} destinatário(s)/CNPJ(s) encontrado(s). Cada destinatário terá seu próprio PDF.`,
        "ok"
      );

    }


    $("progress").textContent =
      `Análise concluída: ${total} página(s).` +
      (
        ocrPages
          ? ` OCR usado em ${ocrPages} página(s).`
          : ""
      ) +
      (
        unknown
          ? ` ${unknown} página(s) sem CNPJ de destinatário.`
          : ""
      );


  }catch(e){

    console.error(e);


    status(
      "Erro ao analisar o PDF. Verifique se o arquivo é um PDF fiscal válido.",
      "err"
    );


  }finally{

    $("analyze").disabled =
      !files.length;

  }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(s){

  return String(s || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   RESULTADOS
========================================================= */

function render(){

  let h =
    `<div class="section">
      ${groups.size} destinatário(s)/CNPJ(s) encontrado(s)
    </div>`;


  for(
    const [c,g]
    of groups
  ){

    h += `

      <div class="item">

        <div>

          <div class="name">
            ${escapeHtml(g.name)}
          </div>

          <div class="cnpj">
            CNPJ ${fmt(c)}
          </div>

          <div class="meta">
            ${g.pages.length} página(s) encontrada(s)
          </div>

        </div>


        <div>

          <button
            class="btn view"
            data-c="${c}"
          >
            👁 Visualizar PDF
          </button>


          <button
            class="btn download"
            data-c="${c}"
          >
            ⬇ Baixar PDF
          </button>

        </div>

      </div>

    `;

  }


  $("results").innerHTML =
    h +
    (
      groups.size
        ? ""
        : `<div class="meta">
             Nenhum destinatário identificado.
           </div>`
    );


  $("results").className =
    "results show";


  document
    .querySelectorAll(".view")
    .forEach(b=>{

      b.onclick =
        ()=>make(
          b.dataset.c,
          true
        );

    });


  document
    .querySelectorAll(".download")
    .forEach(b=>{

      b.onclick =
        ()=>make(
          b.dataset.c,
          false
        );

    });

}


/* =========================================================
   CRIAR PDF SEPARADO
========================================================= */

async function build(c){

  const g =
    groups.get(c);


  const out =
    await PDFLib.PDFDocument.create();


  const cache =
    new Map();


  for(const x of g.pages){

    let src =
      cache.get(x.f);


    if(!src){

      src =
        await PDFLib.PDFDocument.load(
          new Uint8Array(
            await x.f.arrayBuffer()
          )
        );


      cache.set(
        x.f,
        src
      );

    }


    const [page] =
      await out.copyPages(
        src,
        [x.p - 1]
      );


    out.addPage(page);

  }


  return out.save();

}


/* =========================================================
   VISUALIZAR / BAIXAR
========================================================= */

async function make(c,view){

  const g =
    groups.get(c);


  try{

    const bytes =
      await build(c);


    const url =
      URL.createObjectURL(
        new Blob(
          [bytes],
          {
            type:"application/pdf"
          }
        )
      );


    if(view){

      window.open(
        url,
        "_blank"
      );

    }else{

      const a =
        document.createElement("a");


      a.href =
        url;


      /*
        Nome do arquivo:

        EMPRESA - CNPJ.pdf
      */

      a.download =
        `${clean(
          g.name ||
          "DESTINATARIO"
        )} - ${fmt(c)}.pdf`;


      document
        .body
        .appendChild(a);


      a.click();

      a.remove();

    }


    setTimeout(
      ()=>URL.revokeObjectURL(url),
      60000
    );


  }catch(e){

    console.error(e);


    status(
      "Não foi possível gerar este PDF.",
      "err"
    );

  }

}
