<!doctype html>
<html lang="pt-BR">
<head>

<title>FiscalPDF — NF-e / NFC-e</title>

<style>
*{box-sizing:border-box}

body{

.brand{

  align-items:center;

  width:54px;
  height:54px;
  border-radius:14px;
  background:#1261a8;
  color:white;
  display:grid;
  place-items:center;
  font-weight:900
}

.head h1{
  margin:0;
  font-size:30px
}

}

<body>

<div class="wrap">
<div class="app">

<header class="head">

  <div class="brand">

    <div class="logo">NF-e</div>

    <div>
      <h1>FiscalPDF</h1>
      <p>Organize NF-e e NFC-e pelo <b>destinatário</b></p>
    </div>

  </div>

</header>

<main class="body">

<div class="mode-title">
  Como deseja analisar o PDF?
</div>

<div class="mode-grid">

  <label class="mode-option selected" id="modeOriginal">

    <input
      type="radio"
      name="mode"
      value="original"
      checked
    >

    <div class="mode-top">
      <span class="mode-icon">📄</span>
      <span>PDF ORIGINAL</span>
    </div>

    <p>
      Use quando o PDF possuir texto selecionável.
      É mais rápido e não precisa de OCR.
    </p>

    <span class="mode-tag">
      LEITURA DIRETA
    </span>

  </label>


  <label class="mode-option" id="modeScanned">

    <input
      type="radio"
      name="mode"
      value="scanned"
    >

    <div class="mode-top">
      <span class="mode-icon">🖨️</span>
      <span>PDF DIGITALIZADO</span>
    </div>

    <p>
      Use quando o documento foi escaneado ou composto
      por imagens. O sistema utilizará OCR.
    </p>

    <span class="mode-tag">
      OCR
    </span>

  </label>

</div>


<label class="drop" for="files">

  <span class="drop-icon">📄</span>

  <b>Selecionar arquivos PDF</b>

  <span>
    ou arraste e solte seus PDFs fiscais aqui
  </span>

</label>

<input
  id="files"
  type="file"
  accept=".pdf,application/pdf"
  multiple
>


<div class="actions">

  <button
    id="clear"
    class="btn clear"
    disabled
  >
    Limpar
  </button>

  <button
    id="analyze"
    class="btn main"
    disabled
  >
    🔎 Analisar PDFs
  </button>

</div>


<div id="status" class="status"></div>

<div id="progress" class="progress"></div>

<div id="fileList"></div>

<div id="results" class="results"></div>

</main>

</div>
</div>


<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


const $ = x => document.getElementById(x);

let files = [];

let groups = new Map();


/* =========================================================
   FUNÇÕES BÁSICAS
========================================================= */

function clean(s){

  return String(s || "")
    .replace(/[\\/:*?"<>|]/g," ")
    .replace(/\s+/g," ")
    .trim();

}


function normalize(s){

  return String(s || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toUpperCase()
    .replace(/\s+/g," ")
    .trim();

}


function dig(s){

  return String(s || "")
    .replace(/\D/g,"");

}


function valid(c){

  c = dig(c);

  if(
    c.length !== 14 ||
    /^(\d)\1+$/.test(c)
  ){
    return false;
  }


  let sum = 0;
  let w = 5;

  for(let i=0;i<12;i++){

    sum += Number(c[i]) * w;

    w = w === 2 ? 9 : w - 1;

  }


  let d =
    sum % 11 < 2
      ? 0
      : 11 - (sum % 11);


  if(d !== Number(c[12])){
    return false;
  }


  sum = 0;
  w = 6;

  for(let i=0;i<13;i++){

    sum += Number(c[i]) * w;

    w = w === 2 ? 9 : w - 1;

  }


  d =
    sum % 11 < 2
      ? 0
      : 11 - (sum % 11);


  return d === Number(c[13]);

}


function fmt(c){

  c = dig(c);

  return c.replace(
    /(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,
    "$1.$2.$3/$4-$5"
  );

}


function status(t,c){

  $("status").textContent = t;

  $("status").className =
    "status show " + c;

}


/* =========================================================
   ARQUIVOS
========================================================= */

function renderFiles(){

  $("fileList").innerHTML =
    files.map((f,i)=>`

      <div class="file">
        📄 ${i+1}. ${clean(f.name)}
        <span style="float:right;color:#667085">
          ${formatBytes(f.size)}
        </span>
      </div>

    `).join("");


  $("analyze").disabled = !files.length;

  $("clear").disabled = !files.length;

}


function formatBytes(bytes){

  if(!bytes){
    return "0 KB";
  }

  return (bytes / 1024)
    .toFixed(1) + " KB";

}


function add(a){

  let p = a.filter(f =>
    f.type === "application/pdf" ||
    /\.pdf$/i.test(f.name)
  );


  if(!p.length){

    status(
      "Selecione um PDF válido.",
      "err"
    );

    return;
  }


  files.push(...p);

  renderFiles();


  status(
    `${files.length} PDF(s) selecionado(s). Clique em Analisar PDFs.`,
    "ok"
  );

}


$("files").onchange = () => {

  add([...$("files").files]);

};


let drop =
  document.querySelector(".drop");


drop.ondragover = e => {

  e.preventDefault();

  drop.style.borderColor =
    "#0877d1";

};


drop.ondragleave = () => {

  drop.style.borderColor =
    "#63a9e9";

};


drop.ondrop = e => {

  e.preventDefault();

  drop.style.borderColor =
    "#63a9e9";

  add([...e.dataTransfer.files]);

};


$("clear").onclick = () => {

  files = [];

  groups.clear();

  $("files").value = "";

  $("fileList").innerHTML = "";

  $("results").innerHTML = "";

  $("results").className = "results";

  $("status").className = "status";

  $("progress").textContent = "";

};


/* =========================================================
   MODO
========================================================= */

document
  .querySelectorAll('input[name="mode"]')
  .forEach(input => {

    input.addEventListener("change", () => {

      $("modeOriginal")
        .classList.toggle(
          "selected",
          input.value === "original" &&
          input.checked
        );


      $("modeScanned")
        .classList.toggle(
          "selected",
          input.value === "scanned" &&
          input.checked
        );

    });

  });


function getMode(){

  return document
    .querySelector(
      'input[name="mode"]:checked'
    )
    .value;

}


/* =========================================================
   CNPJ
========================================================= */

function findCnpjs(s){

  let matches = String(s || "")
    .match(
      /\d{2}[.\s]?\d{3}[.\s]?\d{3}[\/\s]?\d{4}[-\s]?\d{2}/g
    ) || [];


  let result = [];

  for(const x of matches){

    const c = dig(x);

    if(valid(c) && !result.includes(c)){
      result.push(c);
    }

  }


  return result;

}


function findCnpj(s){

  return findCnpjs(s)[0] || null;

}


/* =========================================================
   CORREÇÃO OCR
========================================================= */

/*
   O OCR pode transformar:

   NOME / RAZÃO SOCIAL
   em:

   INOME RAZÃO SOCIAL
   NOME RAZÃO SOCIAL
   NOME RAZAO SOCIAL
   INOME RAZAO SOCIAL
   RAZAO SOCIAL

   Portanto fazemos uma normalização específica.
*/

function normalizeOCRLine(s){

  let x = normalize(s);

  x = x
    .replace(/^I(?=NOME\b)/,"")
    .replace(/^1(?=NOME\b)/,"")
    .replace(/^L(?=NOME\b)/,"")
    .replace(/^I(?=RAZAO\b)/,"")
    .replace(/^1(?=RAZAO\b)/,"");

  x = x
    .replace(/\bICNPJ\b/g,"CNPJ")
    .replace(/\bICPF\b/g,"CPF")
    .replace(/\bIENDERECO\b/g,"ENDERECO")
    .replace(/\bIDATA\b/g,"DATA")
    .replace(/\bIEMISSAO\b/g,"EMISSAO");

  return x.trim();

}


function isLabelOnly(s){

  const n = normalizeOCRLine(s);

  if(!n){
    return true;
  }


  const labels = [
    "CNPJ",
    "CPF",
    "IE",
    "INSCRICAO",
    "INSCRICAO ESTADUAL",
    "ENDERECO",
    "ENDERECO",
    "CEP",
    "MUNICIPIO",
    "UF",
    "FONE",
    "TELEFONE",
    "DATA",
    "DATA DA EMISSAO",
    "EMISSAO",
    "DESTINATARIO",
    "DESTINATARIO/REMETENTE",
    "REMETENTE",
    "EMITENTE",
    "NOME",
    "RAZAO SOCIAL",
    "NOME RAZAO SOCIAL",
    "NOME/RAZAO SOCIAL"
  ];


  if(labels.includes(n)){
    return true;
  }


  if(
    /^(CNPJ|CPF|IE|INSCRICAO|ENDERECO|CEP|MUNICIPIO|UF|FONE|TELEFONE|DATA|EMISSAO)\b/.test(n)
  ){
    return true;
  }


  return false;

}


/* =========================================================
   LIMPEZA DO NOME
========================================================= */

function cleanName(s){

  let x = normalizeOCRLine(s);

  x = x
    .replace(/^[:;,.|\-–—]+/,"")
    .replace(/[:;,.|\-–—]+$/,"")
    .trim();


  /*
     Remove cabeçalhos OCR grudados no nome.
  */

  x = x.replace(
    /^(?:I|1|L)?NOME\s*\/?\s*RAZAO\s*SOCIAL\s*/i,
    ""
  );


  x = x.replace(
    /^(?:I|1|L)?RAZAO\s*SOCIAL\s*/i,
    ""
  );


  x = x.replace(
    /^NOME\s*/i,
    ""
  );


  /*
     Remove CNPJ/CPF/IE e tudo que vier depois.
  */

  x = x.replace(
    /\b(?:CNPJ|CPF|IE|INSCRICAO|INSCRICAO ESTADUAL|DATA|EMISSAO)\b.*$/i,
    ""
  );


  /*
     Remove números de documento grudados.
  */

  x = x.replace(
    /\d{2}[.\s]?\d{3}[.\s]?\d{3}[\/\s]?\d{4}[-\s]?\d{2}/g,
    ""
  );


  x = x
    .replace(/\s+/g," ")
    .trim();


  return clean(x);

}


/* =========================================================
   VALIDAÇÃO DO NOME
========================================================= */

function isBadName(s){

  const n = normalizeOCRLine(s);

  if(!n){
    return true;
  }


  if(n.length < 3){
    return true;
  }


  if(isLabelOnly(n)){
    return true;
  }


  if(/^\d[\d\s./-]*$/.test(n)){
    return true;
  }


  if(
    /^(DESTINATARIO|DESTINATARIO\/REMETENTE|REMETENTE|EMITENTE)$/.test(n)
  ){
    return true;
  }


  if(
    /^(DANFE|DOCUMENTO AUXILIAR|NOTA FISCAL ELETRONICA)$/.test(n)
  ){
    return true;
  }


  /*
     Não aceitar uma linha que seja claramente
     endereço/documento/campo fiscal.
  */

  if(
    /\b(CNPJ|CPF|CEP|IE|INSCRICAO|ENDERECO|MUNICIPIO|UF|FONE|TELEFONE|DATA|EMISSAO)\b/.test(n)
  ){
    return true;
  }


  /*
     Nome normalmente possui letras.
  */

  if(!/[A-Z]{3}/.test(n)){
    return true;
  }


  return false;

}


/* =========================================================
   EXTRAIR NOME
========================================================= */

function extractNameFromLines(lines, cnpj){

  const cleanLines = lines
    .map(x => normalizeOCRLine(x))
    .filter(Boolean);


  /*
     PRIMEIRA TENTATIVA:
     procurar explicitamente NOME / RAZÃO SOCIAL.
  */

  for(let i=0;i<cleanLines.length;i++){

    const line = cleanLines[i];


    if(
      /(?:^|[^A-Z])(NOME\s*\/?\s*RAZAO\s*SOCIAL|RAZAO\s*SOCIAL)(?:\s|:|-|$)/i.test(line)
    ){

      let value = line
        .replace(
          /.*?(?:NOME\s*\/?\s*RAZAO\s*SOCIAL|RAZAO\s*SOCIAL)\s*[:\-]?\s*/i,
          ""
        )
        .trim();


      value = cleanName(value);


      if(
        value &&
        !isBadName(value)
      ){
        return value;
      }


      /*
         Se o valor estava na linha seguinte,
         procurar até 3 linhas abaixo.
      */

      for(let j=i+1;j<=Math.min(i+3,cleanLines.length-1);j++){

        let candidate =
          cleanName(cleanLines[j]);


        if(
          candidate &&
          !isBadName(candidate)
        ){
          return candidate;
        }

      }

    }

  }


  /*
     SEGUNDA TENTATIVA:
     procurar NOME sozinho.
  */

  for(let i=0;i<cleanLines.length;i++){

    const line = cleanLines[i];


    if(/^NOME\b/i.test(line)){

      let value =
        line
          .replace(/^NOME\s*[:\-]?\s*/i,"")
          .trim();


      value = cleanName(value);


      if(
        value &&
        !isBadName(value)
      ){
        return value;
      }


      for(let j=i+1;j<=Math.min(i+3,cleanLines.length-1);j++){

        let candidate =
          cleanName(cleanLines[j]);


        if(
          candidate &&
          !isBadName(candidate)
        ){
          return candidate;
        }

      }

    }

  }


  /*
     TERCEIRA TENTATIVA:
     procurar a linha imediatamente antes
     ou depois do CNPJ.

     Isso é especialmente útil no OCR.
  */

  if(cnpj){

    const target = dig(cnpj);

    let index = -1;


    for(let i=0;i<cleanLines.length;i++){

      if(
        cleanLines[i]
          .replace(/\D/g,"")
          .includes(target)
      ){

        index = i;
        break;

      }

    }


    if(index >= 0){

      /*
         Primeiro procura ANTES do CNPJ.
      */

      for(
        let i=index-1;
        i>=Math.max(0,index-6);
        i--
      ){

        let candidate =
          cleanName(cleanLines[i]);


        if(
          candidate &&
          !isBadName(candidate) &&
          !/DESTINATARIO|RAZAO SOCIAL|NOME|CNPJ|CPF/i.test(candidate)
        ){
          return candidate;
        }

      }


      /*
         Depois procura DEPOIS do CNPJ.
      */

      for(
        let i=index+1;
        i<=Math.min(cleanLines.length-1,index+6);
        i++
      ){

        let candidate =
          cleanName(cleanLines[i]);


        if(
          candidate &&
          !isBadName(candidate) &&
          !/DESTINATARIO|RAZAO SOCIAL|NOME|CNPJ|CPF/i.test(candidate)
        ){
          return candidate;
        }

      }

    }

  }


  return null;

}


/* =========================================================
   DESTINATÁRIO
========================================================= */

function recipient(raw){

  if(!raw){

    return {
      c:null,
      n:"Destinatário não identificado"
    };

  }


  let normalizedRaw =
    String(raw)
      .replace(/\r/g,"\n");


  let lines =
    normalizedRaw
      .split(/\n/)
      .map(x => clean(x))
      .filter(Boolean);


  /*
     Corrige linhas produzidas pelo OCR.
  */

  lines =
    lines.map(normalizeOCRLine);


  /*
     ========================================================
     1. PROCURAR CABEÇALHO DO DESTINATÁRIO
     ========================================================
  */

  const headerRegex =
    /DESTINAT[ÁAÃÂ][A-Z]*RIO|DESTINATARIO|DESTINATÁRIO|NOME\s*\/?\s*RAZAO\s*SOCIAL|RAZAO\s*SOCIAL/i;


  let starts = [];


  lines.forEach((line,i)=>{

    if(headerRegex.test(line)){
      starts.push(i);
    }

  });


  /*
     Para cada possível bloco de destinatário,
     procuramos o CNPJ.
  */

  for(const start of starts){

    const block =
      lines.slice(
        start,
        Math.min(lines.length,start+30)
      );


    const blockText =
      block.join("\n");


    const cnpjs =
      findCnpjs(blockText);


    if(!cnpjs.length){
      continue;
    }


    /*
       O primeiro CNPJ dentro do bloco do
       DESTINATÁRIO é o candidato principal.
    */

    const c =
      cnpjs[0];


    const n =
      extractNameFromLines(
        block,
        c
      );


    return {

      c:c,

      n:
        n ||
        "Destinatário não identificado"

    };

  }


  /*
     ========================================================
     2. BLOCO NOME / RAZÃO SOCIAL
     ========================================================
  */

  for(let i=0;i<lines.length;i++){

    if(
      /NOME\s*\/?\s*RAZAO\s*SOCIAL|RAZAO\s*SOCIAL/i
        .test(lines[i])
    ){

      const block =
        lines.slice(
          Math.max(0,i-3),
          Math.min(lines.length,i+15)
        );


      const cnpj =
        findCnpj(
          block.join("\n")
        );


      if(cnpj){

        const name =
          extractNameFromLines(
            block,
            cnpj
          );


        return {

          c:cnpj,

          n:
            name ||
            "Destinatário não identificado"

        };

      }

    }

  }


  /*
     ========================================================
     3. FALLBACK:
     DESTINATÁRIO + CNPJ
     ========================================================
  */

  const fullText =
    lines.join("\n");


  const m =
    fullText.match(
      /DESTINAT[ÁAÃÂ][A-Z]*RIO[\s\S]{0,1800}/i
    );


  if(m){

    const blockText =
      m[0];


    const cnpj =
      findCnpj(blockText);


    if(cnpj){

      const blockLines =
        blockText
          .split(/\n/)
          .map(x => clean(x))
          .filter(Boolean);


      const name =
        extractNameFromLines(
          blockLines,
          cnpj
        );


      return {

        c:cnpj,

        n:
          name ||
          "Destinatário não identificado"

      };

    }

  }


  /*
     ========================================================
     IMPORTANTE:
     NÃO PEGAR O PRIMEIRO CNPJ DO DOCUMENTO.
     
     O primeiro CNPJ normalmente pode ser o EMITENTE.
     ========================================================
  */

  return {

    c:null,

    n:"Destinatário não identificado"

  };

}


/* =========================================================
   OCR
========================================================= */

async function ocr(page){

  let viewport =
    page.getViewport({
      scale:3
    });


  let canvas =
    document.createElement("canvas");


  let ctx =
    canvas.getContext(
      "2d",
      {willReadFrequently:true}
    );


  canvas.width =
    Math.ceil(viewport.width);


  canvas.height =
    Math.ceil(viewport.height);


  await page.render({

    canvasContext:ctx,

    viewport:viewport

  }).promise;


  /*
     Pré-processamento simples da imagem
     para melhorar o OCR.
  */

  try{

    const imageData =
      ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );


    const data =
      imageData.data;


    for(let i=0;i<data.length;i+=4){

      const r=data[i];

      const g=data[i+1];

      const b=data[i+2];


      let gray =
        0.299*r +
        0.587*g +
        0.114*b;


      /*
         Aumenta contraste.
      */

      gray =
        gray < 180
          ? 0
          : 255;


      data[i]=gray;

      data[i+1]=gray;

      data[i+2]=gray;

    }


    ctx.putImageData(
      imageData,
      0,
      0
    );

  }catch(e){

    console.warn(
      "Pré-processamento OCR não aplicado:",
      e
    );

  }


  $("progress").textContent =
    "OCR: iniciando...";


  /*
     Tesseract v5.
  */

  const result =
    await Tesseract.recognize(
      canvas,
      "por",
      {

        logger:m=>{

          if(
            m.status ===
            "recognizing text"
          ){

            $("progress").textContent =
              `OCR: ${Math.round(
                (m.progress || 0) * 100
              )}%`;

          }

        }

      }
    );


  return result.data.text || "";

}


/* =========================================================
   ANALISAR
========================================================= */

$("analyze").onclick =
  analyze;


async function analyze(){

  if(!files.length){
    return;
  }


  $("analyze").disabled =
    true;


  groups.clear();


  $("results").innerHTML =
    "";


  $("results").className =
    "results";


  const mode =
    getMode();


  status(
    mode === "original"
      ? "Analisando PDF ORIGINAL pelo DESTINATÁRIO..."
      : "Analisando PDF DIGITALIZADO pelo OCR e DESTINATÁRIO...",
    "warn"
  );


  let total = 0;

  let ocrPages = 0;

  let unknown = 0;


  try{

    for(const f of files){

      $("progress").textContent =
        `Abrindo ${f.name}...`;


      const buffer =
        await f.arrayBuffer();


      const pdf =
        await pdfjsLib.getDocument({
          data:new Uint8Array(buffer)
        }).promise;


      total += pdf.numPages;


      for(
        let p=1;
        p<=pdf.numPages;
        p++
      ){

        $("progress").textContent =
          `Analisando ${f.name}: página ${p} de ${pdf.numPages}`;


        const page =
          await pdf.getPage(p);


        let r = {
          c:null,
          n:"Destinatário não identificado"
        };


        /*
           ===================================================
           PDF ORIGINAL
           ===================================================
        */

        if(mode === "original"){

          const tc =
            await page.getTextContent();


          const text =
            tc.items
              .map(x => x.str || "")
              .join("\n");


          r =
            recipient(text);


          /*
             OCR de reforço SOMENTE se
             a leitura direta não encontrou CNPJ.
          */

          if(!r.c){

            try{

              const o =
                await ocr(page);


              if(o.trim()){

                ocrPages++;


                r =
                  recipient(o);

              }

            }catch(e){

              console.warn(
                "OCR de reforço indisponível:",
                e
              );

            }

          }

        }


        /*
           ===================================================
           PDF DIGITALIZADO
           ===================================================
        */

        else{

          try{

            const o =
              await ocr(page);


            ocrPages++;


            r =
              recipient(o);


            console.log(
              "OCR página",
              p,
              o
            );


          }catch(e){

            console.error(
              "Erro no OCR:",
              e
            );

            /*
               NÃO derruba a análise inteira.
            */

            r = {
              c:null,
              n:"Destinatário não identificado"
            };

          }

        }


        /*
           Se não achou CNPJ do destinatário,
           não cria grupo.
        */

        if(!r.c){

          unknown++;

          continue;

        }


        /*
           Cria grupo por CNPJ.
        */

        if(!groups.has(r.c)){

          groups.set(
            r.c,
            {
              name:r.n,
              pages:[]
            }
          );

        }


        const group =
          groups.get(r.c);


        /*
           Se antes não tinha nome e agora encontrou,
           atualiza.
        */

        if(
          (
            !group.name ||
            group.name ===
              "Destinatário não identificado"
          ) &&
          r.n &&
          r.n !==
            "Destinatário não identificado"
        ){

          group.name =
            r.n;

        }


        group.pages.push({

          f:f,

          p:p

        });

      }

    }


    render();


    if(!groups.size){

      status(
        "Não foi possível identificar o CNPJ do DESTINATÁRIO. Confira se o documento contém a área DESTINATÁRIO / NOME / RAZÃO SOCIAL.",
        "err"
      );

    }else{

      status(
        `${groups.size} destinatário(s)/CNPJ(s) encontrado(s). Cada destinatário terá seu próprio PDF.`,
        "ok"
      );

    }


    $("progress").textContent =
      `Análise concluída: ${total} página(s).` +
      (
        ocrPages
          ? ` OCR usado em ${ocrPages} página(s).`
          : ""
      ) +
      (
        unknown
          ? ` ${unknown} página(s) sem CNPJ de destinatário.`
          : ""
      );


  }catch(e){

    console.error(
      "ERRO GERAL:",
      e
    );


    status(
      "Erro ao analisar o PDF. Verifique se o arquivo é um PDF fiscal válido.",
      "err"
    );


    $("progress").textContent =
      "Detalhes do erro disponíveis no console do navegador.";

  }finally{

    $("analyze").disabled =
      !files.length;

  }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(s){

  return String(s || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   RESULTADOS
========================================================= */

function render(){

  let h = `

    <div class="section">
      ${groups.size}
      destinatário(s)/CNPJ(s) encontrado(s)
    </div>

  `;


  for(const [c,g] of groups){

    h += `

      <div class="item">

        <div>

          <div class="name">
            ${escapeHtml(
              g.name ||
              "Destinatário não identificado"
            )}
          </div>

          <div class="cnpj">
            CNPJ ${fmt(c)}
          </div>

          <div class="meta">
            ${g.pages.length}
            página(s) encontrada(s)
          </div>

        </div>


        <div class="item-actions">

          <button
            class="btn view"
            data-c="${c}"
          >
            👁 Visualizar PDF
          </button>


          <button
            class="btn download"
            data-c="${c}"
          >
            ⬇ Baixar PDF
          </button>

        </div>

      </div>

    `;

  }


  if(!groups.size){

    h += `

      <div class="meta">
        Nenhum destinatário identificado.
      </div>

    `;

  }


  $("results").innerHTML =
    h;


  $("results").className =
    "results show";


  document
    .querySelectorAll(".view")
    .forEach(button => {

      button.onclick = () => {

        make(
          button.dataset.c,
          true
        );

      };

    });


  document
    .querySelectorAll(".download")
    .forEach(button => {

      button.onclick = () => {

        make(
          button.dataset.c,
          false
        );

      };

    });

}


/* =========================================================
   CRIAR PDF SEPARADO
========================================================= */

async function build(c){

  const g =
    groups.get(c);


  if(!g){
    throw new Error(
      "Destinatário não encontrado."
    );
  }


  const out =
    await PDFLib.PDFDocument.create();


  const cache =
    new Map();


  for(const x of g.pages){

    let src =
      cache.get(x.f);


    if(!src){

      src =
        await PDFLib.PDFDocument.load(
          new Uint8Array(
            await x.f.arrayBuffer()
          )
        );


      cache.set(
        x.f,
        src
      );

    }


    const [page] =
      await out.copyPages(
        src,
        [x.p - 1]
      );


    out.addPage(page);

  }


  return out.save();

}


/* =========================================================
   VISUALIZAR / BAIXAR
========================================================= */

async function make(c,view){

  const g =
    groups.get(c);


  if(!g){
    return;
  }


  try{

    status(
      "Gerando PDF do destinatário...",
      "warn"
    );


    const bytes =
      await build(c);


    const blob =
      new Blob(
        [bytes],
        {
          type:"application/pdf"
        }
      );


    const url =
      URL.createObjectURL(blob);


    if(view){

      window.open(
        url,
        "_blank"
      );

    }else{

      const a =
        document.createElement("a");


      a.href =
        url;


      a.download =
        `${clean(
          g.name ||
          "DESTINATARIO"
        )} - ${fmt(c)}.pdf`;


      document.body.appendChild(a);

      a.click();

      a.remove();

    }


    setTimeout(
      () => URL.revokeObjectURL(url),
      60000
    );


    status(
      "PDF gerado com sucesso.",
      "ok"
    );


  }catch(e){

    console.error(e);


    status(
      "Não foi possível gerar este PDF.",
      "err"
    );

  }

}
