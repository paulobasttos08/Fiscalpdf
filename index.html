<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FiscalPDF — Organizar NF-e e NFC-e</title>

  <!-- PDF.js: leitura de PDF original e renderização de PDF digitalizado -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
  <!-- pdf-lib: criação dos PDFs separados -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <!-- Tesseract: OCR para PDF digitalizado -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    :root {
      --blue: #0878d1;
      --blue-dark: #075a9f;
      --blue-light: #eef7ff;
      --green: #087f4f;
      --red: #c62828;
      --text: #10233f;
      --muted: #60738d;
      --line: #d8e3ef;
      --bg: #f3f7fb;
      --white: #fff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .topbar {
      height: 8px;
      background: var(--blue);
    }

    .page {
      max-width: 1080px;
      margin: 28px auto 60px;
      padding: 0 18px;
    }

    .card {
      background: var(--white);
      border: 1px solid #dfe8f1;
      border-radius: 18px;
      box-shadow: 0 12px 35px rgba(16, 35, 63, .08);
      overflow: hidden;
    }

    header {
      padding: 26px 30px 20px;
      border-bottom: 1px solid var(--line);
      position: relative;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .nf-badge {
      width: 58px;
      height: 58px;
      border-radius: 13px;
      background: var(--blue);
      color: white;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 17px;
      box-shadow: 0 5px 14px rgba(8,120,209,.22);
    }

    h1 {
      margin: 0;
      font-size: 31px;
      letter-spacing: -.6px;
    }

    .subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 16px;
    }

    .content { padding: 24px 30px 32px; }

    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 18px;
    }

    .mode {
      border: 2px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      cursor: pointer;
      transition: .18s;
      background: white;
    }

    .mode:hover {
      border-color: #8ec8f6;
      transform: translateY(-1px);
    }

    .mode.selected {
      border-color: var(--blue);
      background: var(--blue-light);
      box-shadow: 0 5px 16px rgba(8,120,209,.10);
    }

    .mode input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .mode-title {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 800;
      font-size: 17px;
      margin-bottom: 8px;
    }

    .mode p {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .tag {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 7px;
      background: #e7eef5;
      color: #38536f;
      font-size: 11px;
      font-weight: 800;
    }

    .dropzone {
      min-height: 205px;
      border: 2px dashed #70b6ef;
      border-radius: 16px;
      background: #f8fbff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      padding: 25px;
      transition: .18s;
    }

    .dropzone.drag {
      background: #edf7ff;
      border-color: var(--blue);
    }

    .pdf-icon {
      font-size: 44px;
      margin-bottom: 8px;
    }

    .drop-title {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .drop-help {
      color: var(--muted);
      font-size: 14px;
    }

    #fileInput { display: none; }

    .actions {
      display: flex;
      gap: 10px;
      margin: 16px 0;
    }

    button {
      border: 0;
      border-radius: 11px;
      padding: 13px 19px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      transition: .18s;
    }

    .btn-primary {
      background: var(--blue);
      color: white;
      box-shadow: 0 5px 14px rgba(8,120,209,.2);
    }

    .btn-primary:hover { background: var(--blue-dark); }
    .btn-primary:disabled { opacity: .55; cursor: not-allowed; }

    .btn-clear {
      background: #eaf0f6;
      color: #1e344e;
    }

    .btn-preview {
      background: #eef7ff;
      color: #0871c6;
      border: 1px solid #a8d2f3;
    }

    .btn-download {
      background: var(--green);
      color: white;
    }

    .btn-download:hover { filter: brightness(.92); }

    .status {
      border-radius: 10px;
      padding: 13px 15px;
      margin: 12px 0;
      display: none;
      font-size: 14px;
      line-height: 1.4;
    }

    .status.success {
      display: block;
      background: #edfff6;
      color: #087f4f;
      border: 1px solid #aee7cc;
    }

    .status.error {
      display: block;
      background: #fff1f1;
      color: #c62828;
      border: 1px solid #efb5b5;
    }

    .status.info {
      display: block;
      background: #f0f7ff;
      color: #075a9f;
      border: 1px solid #b8d9f3;
    }

    .file-list {
      margin: 10px 0 22px;
    }

    .file-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 12px 0;
      border-bottom: 1px solid #e5ebf2;
      font-size: 14px;
    }

    .file-size { color: var(--muted); white-space: nowrap; }

    .section-title {
      font-size: 18px;
      margin: 18px 0 12px;
    }

    .result {
      border: 1px solid var(--line);
      border-radius: 15px;
      padding: 17px;
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      background: #fff;
    }

    .result-info { min-width: 0; }

    .company {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 6px;
      word-break: break-word;
    }

    .cnpj {
      color: #086db7;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .pages {
      color: var(--muted);
      font-size: 13px;
    }

    .result-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .empty {
      color: var(--muted);
      padding: 20px 0;
      text-align: center;
    }

    .progress {
      height: 8px;
      background: #e6edf5;
      border-radius: 99px;
      overflow: hidden;
      margin-top: 12px;
      display: none;
    }

    .progress > div {
      width: 0%;
      height: 100%;
      background: var(--blue);
      transition: width .2s;
    }

    .small-note {
      color: var(--muted);
      font-size: 12px;
      margin-top: 10px;
    }

    @media (max-width: 760px) {
      .mode-grid { grid-template-columns: 1fr; }
      .content, header { padding-left: 18px; padding-right: 18px; }
      .result { align-items: flex-start; flex-direction: column; }
      .result-actions { width: 100%; }
      .result-actions button { flex: 1; }
    }
  </style>
</head>

<body>
  <div class="topbar"></div>

  <main class="page">
    <section class="card">
      <header>
        <div class="brand">
          <div class="nf-badge">NF-e</div>
          <div>
            <h1>FiscalPDF</h1>
            <div class="subtitle">Organize NF-e e NFC-e pelo <strong>destinatário</strong></div>
          </div>
        </div>
      </header>

      <div class="content">

        <div class="mode-grid">
          <label class="mode selected" id="modeOriginal">
            <input type="radio" name="pdfMode" value="original" checked>
            <div class="mode-title">📄 PDF ORIGINAL</div>
            <p>Use quando o PDF possui texto selecionável. É mais rápido e não precisa de OCR.</p>
            <span class="tag">LEITURA DIRETA</span>
          </label>

          <label class="mode" id="modeScanned">
            <input type="radio" name="pdfMode" value="scanned">
            <div class="mode-title">🖨️ PDF DIGITALIZADO</div>
            <p>Use quando o documento foi escaneado ou é composto por imagens. O sistema utilizará OCR.</p>
            <span class="tag">OCR</span>
          </label>
        </div>

        <div class="dropzone" id="dropzone">
          <div class="pdf-icon">📄</div>
          <div class="drop-title">Selecionar arquivos PDF</div>
          <div class="drop-help">ou arraste e solte seus PDFs fiscais aqui</div>
          <input id="fileInput" type="file" accept="application/pdf,.pdf" multiple>
        </div>

        <div class="actions">
          <button class="btn-clear" id="clearBtn">Limpar</button>
          <button class="btn-primary" id="analyzeBtn" disabled>🔎 Analisar PDFs</button>
        </div>

        <div class="status" id="status"></div>
        <div class="progress" id="progress"><div id="progressBar"></div></div>

        <div class="file-list" id="fileList"></div>

        <div id="results"></div>
      </div>
    </section>
  </main>

<script type="module">
  const pdfjsLib = await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs");
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";

  const { PDFDocument } = PDFLib;

  const fileInput = document.getElementById("fileInput");
  const dropzone = document.getElementById("dropzone");
  const analyzeBtn = document.getElementById("analyzeBtn");
  const clearBtn = document.getElementById("clearBtn");
  const fileList = document.getElementById("fileList");
  const results = document.getElementById("results");
  const status = document.getElementById("status");
  const progress = document.getElementById("progress");
  const progressBar = document.getElementById("progressBar");
  const modeOriginal = document.getElementById("modeOriginal");
  const modeScanned = document.getElementById("modeScanned");

  let files = [];
  let grouped = new Map();

  document.querySelectorAll('input[name="pdfMode"]').forEach(input => {
    input.addEventListener("change", () => {
      modeOriginal.classList.toggle("selected", input.value === "original" && input.checked);
      modeScanned.classList.toggle("selected", input.value === "scanned" && input.checked);
    });
  });

  dropzone.addEventListener("click", () => fileInput.click());

  fileInput.addEventListener("change", e => {
    addFiles([...e.target.files]);
    fileInput.value = "";
  });

  ["dragenter", "dragover"].forEach(ev => {
    dropzone.addEventListener(ev, e => {
      e.preventDefault();
      dropzone.classList.add("drag");
    });
  });

  ["dragleave", "drop"].forEach(ev => {
    dropzone.addEventListener(ev, e => {
      e.preventDefault();
      dropzone.classList.remove("drag");
    });
  });

  dropzone.addEventListener("drop", e => {
    addFiles([...e.dataTransfer.files]);
  });

  clearBtn.addEventListener("click", () => {
    files = [];
    grouped = new Map();
    fileList.innerHTML = "";
    results.innerHTML = "";
    hideStatus();
    analyzeBtn.disabled = true;
    setProgress(0, false);
  });

  function addFiles(selected) {
    const pdfs = selected.filter(f =>
      f.type === "application/pdf" || f.name.toLowerCase().endsWith(".pdf")
    );

    files.push(...pdfs);
    renderFileList();
    analyzeBtn.disabled = files.length === 0;

    if (pdfs.length !== selected.length) {
      showStatus("Apenas arquivos PDF são aceitos.", "error");
    }
  }

  function renderFileList() {
    if (!files.length) {
      fileList.innerHTML = "";
      return;
    }

    fileList.innerHTML = files.map((f, i) => `
      <div class="file-row">
        <span>📄 <strong>${escapeHtml(f.name)}</strong></span>
        <span class="file-size">${formatBytes(f.size)}</span>
      </div>
    `).join("");
  }

  analyzeBtn.addEventListener("click", analyze);

  async function analyze() {
    if (!files.length) return;

    analyzeBtn.disabled = true;
    results.innerHTML = "";
    grouped = new Map();
    setProgress(0, true);
    showStatus("Analisando os PDFs...", "info");

    try {
      const mode = document.querySelector('input[name="pdfMode"]:checked').value;
      let totalPages = 0;
      let processedPages = 0;

      for (const file of files) {
        const bytes = new Uint8Array(await file.arrayBuffer());
        const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
        totalPages += pdf.numPages;
      }

      for (const file of files) {
        const bytes = new Uint8Array(await file.arrayBuffer());
        const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;

        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
          const page = await pdf.getPage(pageNumber);

          let text = "";
          if (mode === "original") {
            const content = await page.getTextContent();
            text = content.items.map(item => item.str || "").join(" ");
          } else {
            text = await runOCR(page);
          }

          const data = extractDestinatario(text);

          if (data.cnpj) {
            if (!grouped.has(data.cnpj)) {
              grouped.set(data.cnpj, {
                cnpj: data.cnpj,
                name: data.name || "Destinatário não identificado",
                pages: []
              });
            }

            const group = grouped.get(data.cnpj);

            if (
              data.name &&
              (!group.name || group.name === "Destinatário não identificado")
            ) {
              group.name = data.name;
            }

            group.pages.push({
              fileBytes: bytes,
              pageNumber,
              fileName: file.name
            });
          }

          processedPages++;
          setProgress((processedPages / totalPages) * 100, true);
        }
      }

      if (!grouped.size) {
        showStatus(
          "Não foi possível identificar o CNPJ do destinatário. Verifique se o PDF é uma NF-e/NFC-e e tente a opção correta: PDF ORIGINAL ou PDF DIGITALIZADO.",
          "error"
        );
      } else {
        showStatus(
          `${grouped.size} destinatário(s)/CNPJ(s) encontrado(s). Cada destinatário terá seu próprio PDF.`,
          "success"
        );
        renderResults();
      }
    } catch (error) {
      console.error(error);
      showStatus(
        "Erro ao analisar o PDF. Tente novamente com um PDF fiscal válido.",
        "error"
      );
    } finally {
      analyzeBtn.disabled = false;
      setTimeout(() => setProgress(0, false), 500);
    }
  }

  async function runOCR(page) {
    const viewport = page.getViewport({ scale: 1.8 });
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });

    canvas.width = viewport.width;
    canvas.height = viewport.height;

    await page.render({ canvasContext: ctx, viewport }).promise;

    const result = await Tesseract.recognize(canvas, "por", {
      logger: msg => {
        if (msg.status === "recognizing text" && typeof msg.progress === "number") {
          // O progresso geral da página continua sendo mostrado pela barra.
        }
      }
    });

    return result.data.text || "";
  }

  /*
   * IMPORTANTE:
   * O sistema procura o DESTINATÁRIO, não o emitente.
   * Primeiro tenta localizar blocos próximos de:
   * - DESTINATÁRIO
   * - DESTINATÁRIO/REMETENTE
   * - RAZÃO SOCIAL
   * - NOME/RAZÃO SOCIAL
   *
   * Depois escolhe o CNPJ que estiver associado ao bloco.
   */
  function extractDestinatario(text) {
    const normalized = normalizeText(text);

    const cnpjMatches = [...normalized.matchAll(
      /(\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2})/g
    )];

    if (!cnpjMatches.length) return { cnpj: null, name: null };

    const lines = normalized
      .split(/\n+/)
      .map(s => s.trim())
      .filter(Boolean);

    // Procura explicitamente a área do destinatário.
    const destinationIndexes = [];
    for (let i = 0; i < lines.length; i++) {
      if (
        /DESTINAT[ÁA]RIO/i.test(lines[i]) ||
        /DESTINAT[ÁA]RIO\/REMETENTE/i.test(lines[i]) ||
        /IDENTIFICA[ÇC][ÃA]O DO DESTINAT[ÁA]RIO/i.test(lines[i])
      ) {
        destinationIndexes.push(i);
      }
    }

    // Para cada marcador, procura o primeiro CNPJ nas próximas linhas.
    for (const start of destinationIndexes) {
      const end = Math.min(lines.length, start + 15);
      const block = lines.slice(start, end).join(" ");

      const m = block.match(/(\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2})/);
      if (m) {
        const cnpj = formatCNPJ(m[1]);
        const name = extractNameFromDestinationBlock(lines.slice(start, end), cnpj);
        return { cnpj, name };
      }
    }

    // Fallback para layouts que não usam o título "Destinatário":
    // procura expressões fiscais próximas do CNPJ e evita usar o primeiro CNPJ
    // da página como regra automática.
    for (let i = 0; i < lines.length; i++) {
      if (/RAZ[ÃA]O SOCIAL|NOME\/RAZ[ÃA]O SOCIAL|NOME DO DESTINAT[ÁA]RIO/i.test(lines[i])) {
        const block = lines.slice(i, Math.min(lines.length, i + 12)).join(" ");
        const m = block.match(/(\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2})/);
        if (m) {
          const cnpj = formatCNPJ(m[1]);
          return {
            cnpj,
            name: extractNameFromDestinationBlock(lines.slice(i, i + 12), cnpj)
          };
        }
      }
    }

    return { cnpj: null, name: null };
  }

  function extractNameFromDestinationBlock(lines, cnpj) {
    for (const line of lines) {
      if (!line.includes(cnpj) && /RAZ[ÃA]O SOCIAL|NOME\/RAZ[ÃA]O SOCIAL/i.test(line)) {
        const parts = line.split(/RAZ[ÃA]O SOCIAL|NOME\/RAZ[ÃA]O SOCIAL/i);
        const candidate = parts[parts.length - 1]
          .replace(/[:\-–]/g, " ")
          .trim();
        if (candidate && !/CNPJ|CPF/i.test(candidate)) return cleanCompanyName(candidate);
      }
    }

    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (line.includes(cnpj)) {
        // Nome geralmente aparece na linha anterior ou seguinte.
        for (const candidate of [lines[i - 1], lines[i + 1], lines[i - 2]]) {
          if (candidate && isLikelyCompanyName(candidate)) {
            return cleanCompanyName(candidate);
          }
        }
      }
    }

    return "Destinatário não identificado";
  }

  function isLikelyCompanyName(s) {
    if (!s || s.length < 3 || s.length > 120) return false;
    if (/^(CNPJ|CPF|IE|INSCRI|CEP|ENDERE|FONE|TELEFONE|N[ÚU]MERO|BAIRRO|MUNIC[ÍI]PIO|UF)\b/i.test(s)) return false;
    if (/^\d[\d\s./-]*$/.test(s)) return false;
    return /[A-Za-zÀ-ÿ]{3}/.test(s);
  }

  function cleanCompanyName(name) {
    return name
      .replace(/\s{2,}/g, " ")
      .replace(/^[:\-–\s]+|[:\-–\s]+$/g, "")
      .trim();
  }

  function renderResults() {
    const entries = [...grouped.values()];

    results.innerHTML = `
      <h2 class="section-title">Destinos encontrados</h2>
      ${entries.map((group, index) => `
        <div class="result">
          <div class="result-info">
            <div class="company">${escapeHtml(group.name)}</div>
            <div class="cnpj">CNPJ ${escapeHtml(group.cnpj)}</div>
            <div class="pages">${group.pages.length} página(s) encontrada(s)</div>
          </div>
          <div class="result-actions">
            <button class="btn-preview" data-preview="${index}">◉ Visualizar PDF</button>
            <button class="btn-download" data-download="${index}">↓ Baixar PDF</button>
          </div>
        </div>
      `).join("")}
    `;

    results.querySelectorAll("[data-preview]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const group = entries[Number(btn.dataset.preview)];
        await openPDF(group);
      });
    });

    results.querySelectorAll("[data-download]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const group = entries[Number(btn.dataset.download)];
        await downloadPDF(group);
      });
    });
  }

  async function createPDF(group) {
    const out = await PDFDocument.create();

    // Mantém a ordem das páginas conforme apareceram nos arquivos enviados.
    for (const item of group.pages) {
      const src = await PDFDocument.load(item.fileBytes);
      const [page] = await out.copyPages(src, [item.pageNumber - 1]);
      out.addPage(page);
    }

    return await out.save();
  }

  function fileNameFor(group) {
    const company = sanitizeFilename(group.name || "DESTINATARIO");
    const cnpj = group.cnpj.replace(/[\/]/g, "-");
    return `${company} - ${cnpj}.pdf`;
  }

  async function downloadPDF(group) {
    try {
      const bytes = await createPDF(group);
      const blob = new Blob([bytes], { type: "application/pdf" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fileNameFor(group);
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (error) {
      console.error(error);
      showStatus("Não foi possível gerar este PDF.", "error");
    }
  }

  async function openPDF(group) {
    try {
      const bytes = await createPDF(group);
      const blob = new Blob([bytes], { type: "application/pdf" });
      const url = URL.createObjectURL(blob);
      window.open(url, "_blank", "noopener,noreferrer");
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } catch (error) {
      console.error(error);
      showStatus("Não foi possível gerar o PDF para visualização.", "error");
    }
  }

  function normalizeText(value) {
    return value
      .replace(/\r/g, "\n")
      .replace(/[ \t]+/g, " ")
      .replace(/\n{3,}/g, "\n")
      .normalize("NFC");
  }

  function formatCNPJ(cnpj) {
    const d = cnpj.replace(/\D/g, "");
    if (d.length !== 14) return cnpj;
    return `${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5,8)}/${d.slice(8,12)}-${d.slice(12)}`;
  }

  function sanitizeFilename(value) {
    return value
      .replace(/[<>:"/\\|?*\x00-\x1F]/g, "")
      .replace(/\s+/g, " ")
      .trim()
      .slice(0, 150) || "DESTINATARIO";
  }

  function formatBytes(bytes) {
    if (bytes < 1024) return `${bytes} B`;
    if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
    return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
  }

  function showStatus(message, type) {
    status.textContent = message;
    status.className = `status ${type}`;
  }

  function hideStatus() {
    status.textContent = "";
    status.className = "status";
  }

  function setProgress(value, show) {
    progress.style.display = show ? "block" : "none";
    progressBar.style.width = `${Math.max(0, Math.min(100, value))}%`;
  }

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }
</script>
</body>
</html>
