<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FiscalPDF</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#f1f4f8;color:#17202f;
  font-family:Inter,Arial,Helvetica,sans-serif
}
.container{max-width:1080px;margin:35px auto;padding:0 18px}
.card{
  background:#fff;border:1px solid #e1e6ec;border-radius:20px;
  box-shadow:0 12px 35px rgba(16,24,40,.08);overflow:hidden
}
.top{
  padding:26px 30px;border-bottom:1px solid #e8edf2;
  background:linear-gradient(180deg,#fff,#f9fbfd)
}
.brand{display:flex;align-items:center;gap:14px}
.logo{
  width:50px;height:50px;border-radius:12px;background:#1769aa;color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px
}
h1{margin:0;font-size:29px;letter-spacing:-.5px}
.subtitle{margin:5px 0 0;color:#667085;font-size:14px}
.content{padding:25px 30px 30px}
.drop{
  border:2px dashed #98a2b3;border-radius:16px;padding:40px 20px;
  text-align:center;background:#f8fafc;cursor:pointer;transition:.2s
}
.drop:hover{border-color:#1769aa;background:#f5f9fc}
.drop-icon{font-size:30px;margin-bottom:8px}
.drop-title{font-weight:800;font-size:18px}
.drop-text{margin-top:7px;color:#667085;font-size:14px}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
button{
  border:0;border-radius:10px;padding:12px 18px;font-weight:800;
  cursor:pointer;background:#17202f;color:#fff
}
button:hover:not(:disabled){filter:brightness(.96)}
button:disabled{opacity:.45;cursor:not-allowed}
.secondary{background:#e9edf2;color:#17202f}
.status{display:none;margin-top:18px;padding:13px 15px;border-radius:10px;font-size:14px;font-weight:700}
.status.show{display:block}
.success{background:#ecfdf3;color:#067647;border:1px solid #b7ebcf}
.warning{background:#fffaeb;color:#b54708;border:1px solid #f2d49a}
.error{background:#fef3f2;color:#b42318;border:1px solid #f3c5c1}
.progress{margin-top:10px;color:#667085;font-size:13px;min-height:18px}
.files{margin-top:18px}
.file{
  padding:9px 0;border-bottom:1px solid #edf0f3;color:#475467;font-size:14px
}
.results{display:none;margin-top:26px}
.results.show{display:block}
.results-title{
  font-size:16px;font-weight:800;margin-bottom:12px;color:#344054
}
.result{
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  padding:18px;border:1px solid #dfe5eb;border-radius:14px;
  background:#fff;margin-bottom:11px
}
.result:hover{box-shadow:0 5px 18px rgba(16,24,40,.06)}
.company{font-size:17px;font-weight:800;margin-bottom:6px}
.cnpj{font-size:14px;color:#1769aa;font-weight:800}
.meta{font-size:13px;color:#667085;margin-top:5px}
.download{background:#087f4e;white-space:nowrap}
.footer{
  padding:14px 30px;background:#f8fafc;border-top:1px solid #e8edf2;
  color:#667085;font-size:12px
}
@media(max-width:650px){
 .container{margin:12px auto}.top,.content{padding:20px}.result{align-items:flex-start;flex-direction:column}
 .download{width:100%}
}
</style>
</head>

<body>
<div class="container">
<div class="card">

<div class="top">
  <div class="brand">
    <div class="logo">NF-e</div>
    <div>
      <h1>FiscalPDF</h1>
      <p class="subtitle">Organize NF-e e NFC-e por CNPJ do emitente</p>
    </div>
  </div>
</div>

<div class="content">

<label class="drop" id="dropZone" for="pdfInput">
  <div class="drop-icon">🧾</div>
  <div class="drop-title">Selecione ou arraste seus PDFs fiscais</div>
  <div class="drop-text">Você pode adicionar vários arquivos de uma vez</div>
</label>

<input id="pdfInput" type="file" accept=".pdf,application/pdf" multiple>

<div class="actions">
  <button class="secondary" id="clearBtn" disabled>Limpar</button>
  <button id="analyzeBtn" disabled>🔎 Analisar PDFs</button>
</div>

<div id="status" class="status"></div>
<div id="progress" class="progress"></div>
<div id="filesList" class="files"></div>
<div id="results" class="results"></div>

</div>

<div class="footer">Processamento realizado no navegador. Os PDFs não são enviados para um servidor.</div>
</div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const input = document.getElementById("pdfInput");
const dropZone = document.getElementById("dropZone");
const clearBtn = document.getElementById("clearBtn");
const analyzeBtn = document.getElementById("analyzeBtn");
const statusBox = document.getElementById("status");
const progressBox = document.getElementById("progress");
const filesList = document.getElementById("filesList");
const resultsBox = document.getElementById("results");

let selectedFiles = [];
let groups = new Map();

input.addEventListener("change", function(){
  addFiles(Array.from(input.files || []));
});

dropZone.addEventListener("dragover", function(e){
  e.preventDefault();
  dropZone.style.borderColor = "#1769aa";
});

dropZone.addEventListener("dragleave", function(){
  dropZone.style.borderColor = "#98a2b3";
});

dropZone.addEventListener("drop", function(e){
  e.preventDefault();
  dropZone.style.borderColor = "#98a2b3";
  addFiles(Array.from(e.dataTransfer.files || []));
});

clearBtn.addEventListener("click", clearAll);
analyzeBtn.addEventListener("click", analyzePDFs);

function addFiles(list){
  const pdfs = list.filter(f =>
    f.type === "application/pdf" || f.name.toLowerCase().endsWith(".pdf")
  );

  if (!pdfs.length){
    showStatus("Selecione pelo menos um arquivo PDF.", "error");
    return;
  }

  selectedFiles = selectedFiles.concat(pdfs);
  renderFiles();
  hideResults();
  showStatus(pdfs.length + " PDF(s) selecionado(s). Clique em Analisar PDFs.", "success");
}

function renderFiles(){
  clearBtn.disabled = selectedFiles.length === 0;
  analyzeBtn.disabled = selectedFiles.length === 0;

  filesList.innerHTML = selectedFiles.map((f,i) =>
    '<div class="file">📄 ' + (i+1) + ". " + escapeHtml(f.name) + "</div>"
  ).join("");
}

function clearAll(){
  selectedFiles = [];
  groups.clear();
  input.value = "";
  filesList.innerHTML = "";
  resultsBox.innerHTML = "";
  hideResults();
  progressBox.textContent = "";
  statusBox.className = "status";
  renderFiles();
}

function hideResults(){
  resultsBox.className = "results";
  resultsBox.innerHTML = "";
}

function showStatus(text, type){
  statusBox.textContent = text;
  statusBox.className = "status show " + type;
}

function digits(value){
  return String(value || "").replace(/\D/g,"");
}

function validCNPJ(value){
  const c = digits(value);
  if (c.length !== 14 || /^(\d)\1{13}$/.test(c)) return false;

  let sum = 0;
  let weight = 5;
  for(let i=0;i<12;i++){
    sum += Number(c[i]) * weight;
    weight--;
    if(weight === 1) weight = 9;
  }
  let d1 = sum % 11 < 2 ? 0 : 11 - (sum % 11);
  if(d1 !== Number(c[12])) return false;

  sum = 0;
  weight = 6;
  for(let i=0;i<13;i++){
    sum += Number(c[i]) * weight;
    weight--;
    if(weight === 1) weight = 9;
  }
  let d2 = sum % 11 < 2 ? 0 : 11 - (sum % 11);
  return d2 === Number(c[13]);
}

function formatCNPJ(c){
  return c.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,
    "$1.$2.$3/$4-$5");
}

/* Chave de acesso: UF 2 + AAMM 4 + CNPJ 14 + ... */
function findCNPJByAccessKey(text){
  const raw = digits(text);
  const keys = raw.match(/\d{44}/g) || [];

  for(const key of keys){
    const cnpj = key.substring(6,20);
    if(validCNPJ(cnpj)) return cnpj;
  }
  return null;
}

function findCNPJByLabel(text){
  const matches = text.match(/\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}/g) || [];
  for(const m of matches){
    const cnpj = digits(m);
    if(validCNPJ(cnpj)) return cnpj;
  }
  return null;
}

function findCompanyName(text, cnpj){
  const normalized = String(text || "").replace(/\s+/g," ").trim();

  const labels = [
    "IDENTIFICAÇÃO DO EMITENTE",
    "IDENTIFICACAO DO EMITENTE",
    "DANFE"
  ];

  for(const label of labels){
    const pos = normalized.toUpperCase().indexOf(label);
    if(pos >= 0){
      const before = normalized.substring(Math.max(0,pos-500), pos);
      const pieces = before.split("|").map(x => x.trim()).filter(Boolean);

      for(let i=pieces.length-1;i>=0;i--){
        const value = pieces[i];
        if(
          value.length >= 3 &&
          value.length <= 100 &&
          !/CNPJ|CPF|ENDERE[CÇ]O|CEP|FONE|TELEFONE|INSCRI[CÇ][AÃ]O|CHAVE/i.test(value) &&
          !/^\d+$/.test(value)
        ){
          return value;
        }
      }
    }
  }

  return "Empresa não identificada";
}

async function analyzePDFs(){
  if(!selectedFiles.length) return;

  analyzeBtn.disabled = true;
  clearBtn.disabled = true;
  groups.clear();
  hideResults();

  showStatus("Analisando os PDFs página por página...", "warning");

  let totalPages = 0;
  let pagesWithoutCNPJ = 0;

  try{
    for(const file of selectedFiles){
      const bytes = new Uint8Array(await file.arrayBuffer());
      const pdf = await pdfjsLib.getDocument({data: bytes}).promise;
      totalPages += pdf.numPages;

      for(let pageNumber=1; pageNumber<=pdf.numPages; pageNumber++){
        progressBox.textContent =
          "Analisando " + file.name + ": página " +
          pageNumber + " de " + pdf.numPages;

        const page = await pdf.getPage(pageNumber);
        const textContent = await page.getTextContent();
        const text = textContent.items.map(item => item.str).join(" ");

        const cnpj = findCNPJByAccessKey(text) || findCNPJByLabel(text);

        if(!cnpj){
          pagesWithoutCNPJ++;
          continue;
        }

        const company = findCompanyName(text, cnpj);

        if(!groups.has(cnpj)){
          groups.set(cnpj, {
            company: company,
            pages: []
          });
        }

        const group = groups.get(cnpj);

        if(group.company === "Empresa não identificada" &&
           company !== "Empresa não identificada"){
          group.company = company;
        }

        group.pages.push({
          file: file,
          page: pageNumber
        });
      }
    }

    renderResults();

    if(groups.size === 0){
      showStatus(
        "Nenhum CNPJ de emitente foi identificado nas páginas analisadas.",
        "error"
      );
    }else if(pagesWithoutCNPJ){
      showStatus(
        groups.size + " empresa(s)/CNPJ(s) encontrada(s). " +
        pagesWithoutCNPJ + " página(s) não tiveram CNPJ identificado.",
        "warning"
      );
    }else{
      showStatus(
        groups.size + " empresa(s)/CNPJ(s) encontrada(s). " +
        "Escolha o PDF que deseja baixar.",
        "success"
      );
    }

    progressBox.textContent =
      "Análise concluída: " + totalPages + " página(s).";

  }catch(error){
    console.error(error);
    showStatus(
      "Erro ao analisar o PDF. Verifique se o arquivo é um PDF fiscal válido.",
      "error"
    );
    progressBox.textContent = "";
  }finally{
    analyzeBtn.disabled = selectedFiles.length === 0;
    clearBtn.disabled = selectedFiles.length === 0;
  }
}

function renderResults(){
  let html =
    '<div class="results-title">Empresas encontradas</div>';

  for(const [cnpj, group] of groups.entries()){
    html +=
      '<div class="result">' +
        '<div>' +
          '<div class="company">' + escapeHtml(group.company) + '</div>' +
          '<div class="cnpj">CNPJ ' + formatCNPJ(cnpj) + '</div>' +
          '<div class="meta">' + group.pages.length +
            ' página(s) encontrada(s)</div>' +
        '</div>' +
        '<button class="download" data-cnpj="' + cnpj + '">' +
          '⬇ Baixar PDF' +
        '</button>' +
      '</div>';
  }

  if(!groups.size){
    html +=
      '<div class="result"><div>' +
      '<div class="company">Nenhum resultado</div>' +
      '</div></div>';
  }

  resultsBox.innerHTML = html;
  resultsBox.className = "results show";

  document.querySelectorAll(".download").forEach(button => {
    button.addEventListener("click", function(){
      downloadGroup(this.dataset.cnpj, this);
    });
  });
}

async function downloadGroup(cnpj, button){
  const group = groups.get(cnpj);
  if(!group || !group.pages.length) return;

  button.disabled = true;
  button.textContent = "Gerando PDF...";

  showStatus(
    "Gerando PDF do CNPJ " + formatCNPJ(cnpj) + "...",
    "warning"
  );

  try{
    const output = await PDFLib.PDFDocument.create();

    /*
      Reabre cada arquivo original no momento do download.
      Isso evita problemas de ArrayBuffer usado pelo PDF.js.
    */
    const sourceCache = new Map();

    for(const item of group.pages){
      let source = sourceCache.get(item.file);

      if(!source){
        const bytes = new Uint8Array(await item.file.arrayBuffer());
        source = await PDFLib.PDFDocument.load(bytes);
        sourceCache.set(item.file, source);
      }

      const copied = await output.copyPages(source, [item.page - 1]);
      output.addPage(copied[0]);
    }

    const pdfBytes = await output.save();

    const blob = new Blob([pdfBytes], {type:"application/pdf"});
    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");
    link.href = url;
    link.download =
      "FiscalPDF_" + safeFilename(group.company) + "_" + cnpj + ".pdf";

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 3000);

    showStatus(
      "PDF do CNPJ " + formatCNPJ(cnpj) + " criado com sucesso.",
      "success"
    );

  }catch(error){
    console.error(error);
    showStatus(
      "Erro ao gerar este PDF. Tente novamente.",
      "error"
    );
  }finally{
    button.disabled = false;
    button.textContent = "⬇ Baixar PDF";
  }
}

function safeFilename(value){
  return String(value || "Empresa")
    .replace(/[\\/:*?"<>|]/g," ")
    .replace(/\s+/g," ")
    .trim()
    .substring(0,80) || "Empresa";
}

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g, function(ch){
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[ch];
  });
}

renderFiles();
</script>
</body>
</html>
