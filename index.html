<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FiscalPDF</title><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#101828;font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:40px auto;padding:0 18px}.card{background:#fff;border-radius:18px;padding:28px;box-shadow:0 10px 35px #0001}h1{margin:0;font-size:30px}.sub{color:#667085;margin:8px 0 24px}.drop{border:2px dashed #98a2b3;border-radius:15px;padding:42px;text-align:center;cursor:pointer;background:#fafbfc}.drop b{display:block;font-size:19px;margin-bottom:8px}.drop span{color:#667085}input{display:none}.actions{display:flex;gap:10px;margin-top:18px}button{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;background:#101828;color:#fff}button.secondary{background:#e4e7ec;color:#101828}button:disabled{opacity:.45}.status{display:none;margin-top:18px;padding:14px;border-radius:10px}.show{display:block}.ok{background:#ecfdf3;color:#067647}.warn{background:#fffaeb;color:#b54708}.err{background:#fef3f2;color:#b42318}.summary{margin-top:18px;color:#667085}.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:14px}.group{border:1px solid #e4e7ec;border-radius:13px;padding:16px}.group h3{font-size:16px;margin:0 0 6px}.small{font-size:13px;color:#667085}.file{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #f0f2f5;font-size:14px}.file:last-child{border:0}.badge{font-size:12px;background:#f2f4f7;border-radius:99px;padding:4px 8px;white-space:nowrap}</style></head><body><div class="wrap"><div class="card"><h1>FiscalPDF</h1><p class="sub">Organize NF-e e NFC-e por CNPJ do emitente.</p><label class="drop" for="pdfs"><b>📄 Selecione ou arraste seus PDFs fiscais</b><span>O sistema analisa cada página individualmente.</span></label><input id="pdfs" type="file" accept=".pdf,application/pdf" multiple><div class="actions"><button class="secondary" id="clear" disabled>Limpar</button><button id="process" disabled>🔎 Analisar PDFs</button></div><div id="status" class="status"></div><div id="summary" class="summary"></div><div id="groups" class="groups"></div></div></div><script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const input=document.getElementById('pdfs'),proc=document.getElementById('process'),clear=document.getElementById('clear'),status=document.getElementById('status'),summary=document.getElementById('summary'),groupsEl=document.getElementById('groups');let files=[];input.onchange=()=>add([...input.files]);document.querySelector('.drop').ondragover=e=>e.preventDefault();document.querySelector('.drop').ondrop=e=>{e.preventDefault();add([...e.dataTransfer.files])};clear.onclick=()=>{files=[];input.value='';render()};proc.onclick=process;function add(a){files.push(...a.filter(f=>f.name.toLowerCase().endsWith('.pdf')));render()}function render(){clear.disabled=!files.length;proc.disabled=!files.length;summary.textContent=files.length?files.length+' arquivo(s) selecionado(s).':'';groupsEl.innerHTML=files.map((f,i)=>'<div class="group"><h3>'+esc(i+1+'. '+f.name)+'</h3><div class="small">'+(f.size/1048576).toFixed(2)+' MB</div></div>').join('')}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function msg(t,c){status.className='status show '+c;status.textContent=t}function dig(s){return(s||'').replace(/\D/g,'')}function valid(c){c=dig(c);if(c.length!==14||/^(\d)\1{13}$/.test(c))return false;let f=(b,w)=>{let s=0;for(let i=0;i<w.length;i++)s+=+b[i]*w[i];let r=s%11;return r<2?0:11-r};return f(c.slice(0,12),[5,4,3,2,9,8,7,6,5,4,3,2])==+c[12]&&f(c.slice(0,12)+c[12],[6,5,4,3,2,9,8,7,6,5,4,3,2])==+c[13]}function fmt(c){return c.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5')}function keyCnpj(text){let keys=dig(text).match(/\d{44}/g)||[];for(const k of keys){let c=k.slice(6,20);if(valid(c))return c}return null}function emitterCnpj(text){let u=text.toUpperCase(),i=u.indexOf('IDENTIFICAÇÃO DO EMITENTE');if(i>=0){let b=text.slice(i,i+2200),m=b.match(/\b\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}\b/g)||[];for(const x of m){let c=dig(x);if(valid(c))return c}}let m=text.match(/(?:CNPJ|CNPJ\s*\/\s*CPF)[^0-9]{0,80}(\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2})/i);return m&&valid(dig(m[1]))?dig(m[1]):null}async function process(){proc.disabled=true;clear.disabled=true;groupsEl.innerHTML='';msg('Analisando página por página e identificando o CNPJ do emitente...','warn');const groups=new Map(),bad=[];try{for(const file of files){const buffer=await file.arrayBuffer(),pdf=await pdfjsLib.getDocument({data:buffer}).promise;for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p),c=await page.getTextContent(),text=c.items.map(x=>x.str).join(' '),cnpj=keyCnpj(text)||emitterCnpj(text);if(cnpj){if(!groups.has(cnpj))groups.set(cnpj,[]);groups.get(cnpj).push({file,p,buffer})}else bad.push({file,p})}}for(const[c,items]of groups){let box=document.createElement('div');box.className='group';box.innerHTML='<h3>CNPJ '+fmt(c)+'</h3><div class="small">'+items.length+' página(s) encontrada(s)</div>';items.forEach(x=>box.innerHTML+='<div class="file"><span>'+esc(x.file.name)+' — pág. '+x.p+'</span><span class="badge">Emitente</span></div>');let b=document.createElement('button');b.textContent='⬇ Baixar PDF';b.style.marginTop='12px';b.onclick=()=>downloadGroup(c,items);box.appendChild(b);groupsEl.appendChild(box)}if(bad.length){let box=document.createElement('div');box.className='group';box.innerHTML='<h3>⚠️ Sem CNPJ identificado</h3><div class="small">Estas páginas não foram incluídas nos grupos.</div>';bad.forEach(x=>box.innerHTML+='<div class="file"><span>'+esc(x.file.name)+' — pág. '+x.p+'</span><span class="badge">Revisar</span></div>');groupsEl.appendChild(box)}summary.textContent=groups.size+' CNPJ(s) encontrado(s).';msg(groups.size?groups.size+' CNPJ(s) encontrado(s). Clique em “Baixar PDF” para baixar cada grupo separadamente.':'Nenhum CNPJ de emitente identificado.','ok')}catch(e){console.error(e);msg('Erro ao analisar o PDF.','err')}finally{proc.disabled=false;clear.disabled=false}}
async function downloadGroup(c,items){try{const out=await PDFLib.PDFDocument.create();for(const x of items){const src=await PDFLib.PDFDocument.load(x.buffer),pages=await out.copyPages(src,[x.p-1]);pages.forEach(pg=>out.addPage(pg))}download(await out.save(),'FiscalPDF_'+c+'.pdf')}catch(e){console.error(e);msg('Não foi possível gerar este PDF.','err')}}
function download(bytes,name){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}render()</script></body></html>
