<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FiscalPDF</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#101828;font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:1050px;margin:35px auto;padding:0 18px}.card{background:#fff;border-radius:18px;padding:28px;box-shadow:0 10px 35px #10182814}
h1{margin:0 0 7px;font-size:30px}.sub{margin:0 0 24px;color:#667085}
.drop{border:2px dashed #98a2b3;border-radius:15px;padding:38px 20px;text-align:center;background:#fafbfc;cursor:pointer}
.drop b{display:block;font-size:18px;margin-bottom:8px}.drop span{color:#667085}
input{display:none}.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;background:#101828;color:white}
button.secondary{background:#e4e7ec;color:#101828}button:disabled{opacity:.45;cursor:not-allowed}
.status{display:none;margin-top:18px;padding:14px;border-radius:10px}.status.show{display:block}.success{background:#ecfdf3;color:#067647}.warning{background:#fffaeb;color:#b54708}.error{background:#fef3f2;color:#b42318}
.results{display:none;margin-top:24px}.results.show{display:block}.result{border:1px solid #e4e7ec;border-radius:14px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:15px}
.result h3{margin:0 0 5px;font-size:17px}.meta{color:#667085;font-size:13px}.download{background:#087443;white-space:nowrap}
.filelist{margin-top:20px;color:#475467;font-size:14px}.fileitem{padding:7px 0;border-bottom:1px solid #f0f2f5}
.progress{margin-top:10px;font-size:13px;color:#667085}
@media(max-width:650px){.wrap{margin:15px auto}.card{padding:20px}.result{align-items:flex-start;flex-direction:column}.download{width:100%}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>FiscalPDF</h1>
<p class="sub">Organize NF-e e NFC-e por CNPJ do emitente.</p>

<label class="drop" for="pdfs">
<b>📄 Selecione ou arraste seus PDFs fiscais</b>
<span>Depois clique em <b style="display:inline;font-size:inherit">Analisar PDFs</b>.</span>
</label>
<input id="pdfs" type="file" accept=".pdf,application/pdf" multiple>

<div class="actions">
<button class="secondary" id="clear" disabled>Limpar</button>
<button id="analyze" disabled>🔎 Analisar PDFs</button>
</div>

<div id="status" class="status"></div>
<div id="progress" class="progress"></div>
<div id="filelist" class="filelist"></div>
<div id="results" class="results"></div>
</div></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const input=document.getElementById('pdfs'), analyze=document.getElementById('analyze'), clear=document.getElementById('clear');
const status=document.getElementById('status'), progress=document.getElementById('progress'), filelist=document.getElementById('filelist'), results=document.getElementById('results');
let files=[], groups=new Map();

input.addEventListener('change',()=>addFiles([...input.files]));
document.querySelector('.drop').addEventListener('dragover',e=>e.preventDefault());
document.querySelector('.drop').addEventListener('drop',e=>{e.preventDefault();addFiles([...e.dataTransfer.files])});
clear.onclick=()=>{files=[];groups.clear();input.value='';renderFiles();results.className='results';status.className='status';progress.textContent=''};
analyze.onclick=analyzePDFs;

function addFiles(list){
 const pdfs=list.filter(f=>f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf'));
 files.push(...pdfs); renderFiles();
}
function renderFiles(){
 analyze.disabled=!files.length;clear.disabled=!files.length;
 filelist.innerHTML=files.map((f,i)=>`<div class="fileitem">📄 ${i+1}. ${esc(f.name)}</div>`).join('');
}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function digits(s){return (s||'').replace(/\D/g,'')}
function validCnpj(c){
 c=digits(c); if(c.length!==14||/^(\d)\1{13}$/.test(c))return false;
 const calc=(b,w)=>{let s=0;for(let i=0;i<w.length;i++)s+=Number(b[i])*w[i];let r=s%11;return r<2?0:11-r};
 return calc(c.slice(0,12),[5,4,3,2,9,8,7,6,5,4,3,2])===Number(c[12]) &&
 calc(c.slice(0,12)+c[12],[6,5,4,3,2,9,8,7,6,5,4,3,2])===Number(c[13]);
}
function fmt(c){return c.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5')}

/* Na chave de acesso de 44 dígitos:
   UF(2) + AAMM(4) + CNPJ(14) + modelo(2) + série(3) + número(9) + ... */
function cnpjFromKey(text){
 const raw=digits(text);
 const keys=raw.match(/\d{44}/g)||[];
 for(const key of keys){
   const c=key.slice(6,20);
   if(validCnpj(c)) return c;
 }
 return null;
}

/* Fallback para PDFs cujo texto não contém a chave completa. */
function cnpjFromEmitter(text){
 const upper=text.toUpperCase();
 const labels=['IDENTIFICAÇÃO DO EMITENTE','IDENTIFICACAO DO EMITENTE'];
 for(const label of labels){
   const pos=upper.indexOf(label);
   if(pos>=0){
     const block=text.slice(pos,pos+2500);
     const ms=block.match(/\b\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}\b/g)||[];
     for(const m of ms){const c=digits(m);if(validCnpj(c))return c}
   }
 }
 const patterns=[
  /CNPJ[^0-9]{0,80}(\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2})/i,
  /(\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2})[^A-Za-z]{0,30}(?:EMITENTE|EMITENTE:)/i
 ];
 for(const re of patterns){const m=text.match(re);if(m&&validCnpj(digits(m[1])))return digits(m[1])}
 return null;
}

async function analyzePDFs(){
 analyze.disabled=true; clear.disabled=true; results.className='results'; results.innerHTML=''; groups=new Map();
 let noCnpj=[];
 show('Analisando os PDFs página por página...','warning');
 try{
  let total=0;
  for(const f of files){
   /* IMPORTANTE: não reutilizamos o ArrayBuffer do PDF.js no download.
      PDF.js pode transferir/detachar o buffer; por isso guardamos apenas o File e a página. */
   const data=new Uint8Array(await f.arrayBuffer());
   const pdf=await pdfjsLib.getDocument({data}).promise;
   total+=pdf.numPages;
   for(let p=1;p<=pdf.numPages;p++){
    progress.textContent=`Analisando ${f.name}: página ${p} de ${pdf.numPages}`;
    const page=await pdf.getPage(p);
    const content=await page.getTextContent();
    const text=content.items.map(x=>x.str).join(' ');
    const cnpj=cnpjFromKey(text)||cnpjFromEmitter(text);
    if(!cnpj){noCnpj.push({file:f,page:p});continue}
    if(!groups.has(cnpj))groups.set(cnpj,[]);
    groups.get(cnpj).push({file:f,page:p});
   }
  }
  renderResults(noCnpj);
  if(groups.size===0) show('Nenhum CNPJ de emitente foi identificado.','error');
  else if(noCnpj.length) show(`${groups.size} CNPJ(s) encontrado(s). ${noCnpj.length} página(s) ficaram para revisão.`,'warning');
  else show(`${groups.size} CNPJ(s) encontrado(s). Agora baixe cada PDF separadamente.`,'success');
  progress.textContent=`Análise concluída: ${total} página(s).`;
 }catch(e){
  console.error(e);
  show('Erro ao analisar o PDF. Tente novamente com um PDF fiscal válido.','error');
  progress.textContent='';
 }finally{analyze.disabled=!files.length;clear.disabled=!files.length}
}

function renderResults(noCnpj){
 let html='';
 for(const [cnpj,items] of groups){
  html+=`<div class="result">
   <div><h3>🧾 CNPJ ${fmt(cnpj)}</h3><div class="meta">${items.length} página(s) encontrada(s)</div></div>
   <button class="download" data-cnpj="${cnpj}">⬇ Baixar PDF</button>
  </div>`;
 }
 if(noCnpj.length){
  html+=`<div class="result"><div><h3>⚠️ ${noCnpj.length} página(s) sem CNPJ identificado</h3>
  <div class="meta">Essas páginas não foram incluídas automaticamente.</div></div></div>`;
 }
 results.innerHTML=html||'<div class="result"><div><h3>Nenhum resultado encontrado</h3></div></div>';
 results.className='results show';
 document.querySelectorAll('.download').forEach(b=>b.onclick=()=>downloadGroup(b.dataset.cnpj,b));
}

async function downloadGroup(cnpj,button){
 const items=groups.get(cnpj); if(!items)return;
 button.disabled=true;button.textContent='Gerando PDF...';
 show(`Gerando PDF do CNPJ ${fmt(cnpj)}...`,'warning');
 try{
  const out=await PDFLib.PDFDocument.create();
  /* Reabre o arquivo original para cada grupo. Isso elimina o problema
     de ArrayBuffer detached que causava "Não foi possível gerar este PDF". */
  const cache=new Map();
  for(const item of items){
   let src=cache.get(item.file);
   if(!src){
    const bytes=new Uint8Array(await item.file.arrayBuffer());
    src=await PDFLib.PDFDocument.load(bytes);
    cache.set(item.file,src);
   }
   const [page]=await out.copyPages(src,[item.page-1]);
   out.addPage(page);
  }
  const bytes=await out.save();
  const blob=new Blob([bytes],{type:'application/pdf'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`FiscalPDF_${cnpj}.pdf`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  show(`PDF do CNPJ ${fmt(cnpj)} criado com sucesso.`,'success');
 }catch(e){
  console.error(e);
  show('Erro ao gerar este PDF. O arquivo original pode estar protegido ou ser incompatível.','error');
 }finally{button.disabled=false;button.textContent='⬇ Baixar PDF'}
}
function show(t,c){status.className='status show '+c;status.textContent=t}
renderFiles();
</script>
</body>
</html>
