<body>

<div class="wrap">

<div class="app">

<main class="body">

<div class="mode-title">

  <label class="mode-option selected" id="modeOriginal">

      type="radio"

    </span>

  </span>

  accept=".pdf,application/pdf"

>

  >

  </button>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


const $ = x => document.getElementById(x);

let files = [];

let groups = new Map();


/* =========================================================
   UTILIDADES
========================================================= */

function clean(s){

  return String(s || "")
    .replace(/[\\/:*?"<>|]/g," ")
    .replace(/\s+/g," ")
    .trim();
}


function normalize(s){

  return String(s || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toUpperCase()
    .replace(/\s+/g," ")
    .trim();
}


function dig(s){

  return String(s || "").replace(/\D/g,"");
}


function valid(c){

  c = dig(c);

  if(c.length !== 14) return false;

  if(/^(\d)\1+$/.test(c)) return false;

  let sum = 0;
  let w = 5;

  for(let i=0;i<12;i++){

    sum += +c[i] * w;

    w = w === 2 ? 9 : w - 1;
  }

  let d =
    sum % 11 < 2
      ? 0
      : 11 - (sum % 11);

  if(d !== +c[12]) return false;

  sum = 0;
  w = 6;

  for(let i=0;i<13;i++){

    sum += +c[i] * w;

    w = w === 2 ? 9 : w - 1;
  }

  d =
    sum % 11 < 2
      ? 0
      : 11 - (sum % 11);

  return d === +c[13];
}


function fmt(c){

  c = dig(c);

  return c.replace(
    /(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,
    "$1.$2.$3/$4-$5"
  );
}


/*
  Nome usado no arquivo.

  Exemplo:

  TADEU E TINA VIANA TRANSPORTES DE CARGAS LTDA - 61.226.048-0001-07.pdf
*/

function fmtFileCnpj(c){

  c = dig(c);

  return c.replace(
    /(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,
    "$1.$2.$3-$4-$5"
  );
}


function status(t,c){

  $("status").textContent = t;

  $("status").className =
    "status show " + c;
}


function escapeHtml(s){

  return String(s || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================================================
   ARQUIVOS
========================================================= */

function renderFiles(){

  $("fileList").innerHTML =
    files.map((f,i)=>{

      const kb =
        (f.size / 1024).toFixed(1);

      return `
        <div class="file">

          <div class="file-name">
            📄 ${i+1}. ${escapeHtml(f.name)}
          </div>

          <div class="file-size">
            ${kb} KB
          </div>

        </div>
      `;

    }).join("");


  $("analyze").disabled =
    !files.length;

  $("clear").disabled =
    !files.length;
}


function add(a){

  const p =
    a.filter(f =>
      f.type === "application/pdf" ||
      /\.pdf$/i.test(f.name)
    );


  if(!p.length){

    status(
      "Selecione um PDF válido.",
      "err"
    );

    return;
  }


  files.push(...p);

  renderFiles();


  status(
    `${files.length} PDF(s) selecionado(s). Clique em Analisar PDFs.`,
    "ok"
  );
}


$("files").onchange = () => {

  add([
    ...$("files").files
  ]);

};


const drop =
  document.querySelector(".drop");


drop.ondragover = e => {

  e.preventDefault();

  drop.style.borderColor =
    "#0877d1";
};


drop.ondragleave = () => {

  drop.style.borderColor =
    "#63a9e9";
};


drop.ondrop = e => {

  e.preventDefault();

  drop.style.borderColor =
    "#63a9e9";

  add([
    ...e.dataTransfer.files
  ]);
};


$("clear").onclick = () => {

  files = [];

  groups.clear();

  $("files").value = "";

  $("fileList").innerHTML = "";

  $("results").innerHTML = "";

  $("results").className =
    "results";

  $("status").className =
    "status";

  $("progress").textContent = "";
};


/* =========================================================
   MODO
========================================================= */

document
  .querySelectorAll('input[name="mode"]')
  .forEach(input => {

    input.addEventListener(
      "change",
      () => {

        $("modeOriginal")
          .classList.toggle(
            "selected",
            input.value === "original" &&
            input.checked
          );


        $("modeScanned")
          .classList.toggle(
            "selected",
            input.value === "scanned" &&
            input.checked
          );

      }
    );

  });


function getMode(){

  return document
    .querySelector(
      'input[name="mode"]:checked'
    )
    .value;
}


/* =========================================================
   CNPJ
========================================================= */

function findAllCnpj(s){

  const found = [];

  const matches =
    String(s || "").match(
      /\d{2}[.\s]?\d{3}[.\s]?\d{3}[\/\s]?\d{4}[-\s]?\d{2}/g
    ) || [];


  for(const x of matches){

    const c = dig(x);

    if(
      valid(c) &&
      !found.includes(c)
    ){

      found.push(c);
    }
  }


  return found;
}


function findCnpj(s){

  const list =
    findAllCnpj(s);

  return list.length
    ? list[0]
    : null;
}


/* =========================================================
   DESTINATÁRIO
========================================================= */

/*
  Palavras que NÃO podem virar nome da empresa.
*/

const BAD_NAMES = new Set([

  "SEM",

  "NAO",

  "NÃO",

  "NAO IDENTIFICADO",

  "DESTINATARIO",

  "DESTINATÁRIO",

  "DESTINATARIO REMETENTE",

  "DESTINATÁRIO REMETENTE",

  "REMETENTE",

  "EMITENTE",

  "CNPJ",

  "CPF",

  "IE",

  "INSCRICAO",

  "INSCRICAO ESTADUAL",

  "ENDERECO",

  "ENDEREÇO",

  "CEP",

  "MUNICIPIO",

  "MUNICÍPIO",

  "UF",

  "FONE",

  "TELEFONE",

  "DATA",

  "EMISSAO",

  "EMISSÃO",

  "DOCUMENTO AUXILIAR",

  "NOTA FISCAL ELETRONICA",

  "DANFE",

  "NF-E",

  "NFE"

]);


/*
  Determina se uma linha pode ser nome/razão social.
*/

function isBadName(s){

  let n = normalize(s);

  if(!n) return true;

  if(n.length < 5) return true;

  if(BAD_NAMES.has(n)) return true;

  if(/^\d[\d\s./-]*$/.test(n))
    return true;

  if(
    /^CNPJ\b|^CPF\b|^IE\b|^INSCRICAO\b|^ENDERECO\b|^CEP\b|^MUNICIPIO\b|^UF\b|^FONE\b|^TELEFONE\b/i.test(n)
  ){
    return true;
  }

  if(
    /DOCUMENTO AUXILIAR|NOTA FISCAL|DANFE|EMITENTE/i.test(n)
  ){
    return true;
  }

  /*
    Evita pegar linhas que são claramente
    valores numéricos/códigos.
  */

  const letters =
    (n.match(/[A-Z]/g) || []).length;

  if(letters < 4)
    return true;

  return false;
}


/*
  Remove rótulos que o OCR possa ter colocado
  junto do nome.
*/

function cleanName(s){

  let x = clean(s);

  x = x
    .replace(
      /^(NOME\s*\/?\s*RAZ[AÃ]O\s*SOCIAL)\s*[:\-]?\s*/i,
      ""
    )
    .replace(
      /^RAZ[AÃ]O\s*SOCIAL\s*[:\-]?\s*/i,
      ""
    )
    .replace(
      /^NOME\s*[:\-]?\s*/i,
      ""
    )
    .replace(
      /^DESTINAT[AÁ]RIO\s*[:\-]?\s*/i,
      ""
    );

  return clean(x);
}


/*
  Testa se uma linha parece ser campo fiscal.
*/

function isFieldLine(s){

  const n = normalize(s);

  return (
    /^CNPJ\b/.test(n) ||
    /^CPF\b/.test(n) ||
    /^IE\b/.test(n) ||
    /^INSCRICAO\b/.test(n) ||
    /^ENDERECO\b/.test(n) ||
    /^CEP\b/.test(n) ||
    /^MUNICIPIO\b/.test(n) ||
    /^UF\b/.test(n) ||
    /^FONE\b/.test(n) ||
    /^TELEFONE\b/.test(n) ||
    /^DATA\b/.test(n) ||
    /^EMISSAO\b/.test(n) ||
    /^VALOR\b/.test(n) ||
    /^NATUREZA\b/.test(n) ||
    /^FRETE\b/.test(n) ||
    /^TRANSPORTADOR\b/.test(n)
  );
}


/*
  Extrai nome quando o OCR encontrou:

  NOME / RAZÃO SOCIAL
  EMPRESA LTDA
  CNPJ
  XX.XXX.XXX/XXXX-XX
*/

function extractNameNearCnpj(lines, cnpjIndex){

  /*
    Primeiro procura até 8 linhas ANTES do CNPJ.
    Normalmente a razão social fica aqui.
  */

  for(
    let i = cnpjIndex - 1;
    i >= Math.max(0,cnpjIndex - 8);
    i--
  ){

    let candidate =
      cleanName(lines[i]);

    if(
      !isBadName(candidate) &&
      !isFieldLine(candidate)
    ){

      /*
        Não aceitar linhas muito longas que parecem
        texto explicativo.
      */

      if(candidate.length <= 120){

        return candidate;
      }
    }
  }


  /*
    Depois procura o campo NOME/RAZÃO SOCIAL
    e pega a próxima linha válida.
  */

  for(
    let i = Math.max(0,cnpjIndex - 12);
    i < Math.min(lines.length,cnpjIndex + 3);
    i++
  ){

    const n =
      normalize(lines[i]);


    if(
      /NOME\s*\/?\s*RAZAO\s*SOCIAL/.test(n) ||
      /RAZAO\s*SOCIAL/.test(n)
    ){

      for(
        let j=i+1;
        j<Math.min(lines.length,i+5);
        j++
      ){

        const candidate =
          cleanName(lines[j]);

        if(
          !isBadName(candidate) &&
          !isFieldLine(candidate)
        ){

          return candidate;
        }
      }
    }
  }


  return null;
}


/*
  Extrai nome de uma linha que tenha
  NOME/RAZÃO SOCIAL e o valor na mesma linha.
*/

function extractInlineName(line){

  let x = String(line || "");

  const patterns = [

    /NOME\s*\/?\s*RAZ[AÃ]O\s*SOCIAL\s*[:\-]?\s*(.+)$/i,

    /RAZ[AÃ]O\s*SOCIAL\s*[:\-]?\s*(.+)$/i,

    /NOME\s*[:\-]?\s*(.+)$/i

  ];


  for(const re of patterns){

    const m =
      x.match(re);

    if(m){

      let candidate =
        cleanName(m[1]);

      /*
        Se depois do nome apareceu CNPJ,
        remove essa parte.
      */

      candidate =
        candidate.split(
          /\s+CNPJ\b/i
        )[0];

      candidate =
        candidate.split(
          /\s+CPF\b/i
        )[0];

      candidate =
        candidate.split(
          /\s+IE\b/i
        )[0];


      if(
        !isBadName(candidate)
      ){

        return candidate;
      }
    }
  }


  return null;
}


/*
  Esta é a função principal.

  REGRA ABSOLUTA:

  O sistema somente considera CNPJ encontrado
  como destinatário quando estiver associado
  ao bloco DESTINATÁRIO ou NOME/RAZÃO SOCIAL.

  Nunca pega simplesmente o primeiro CNPJ do PDF.
*/

function recipient(raw){

  if(!raw){

    return {
      c:null,
      n:"Destinatário não identificado"
    };
  }


  /*
    Preserva quebras de linha do OCR.
  */

  let lines =
    String(raw)
      .replace(/\r/g,"\n")
      .split("\n")
      .map(x =>
        clean(x)
      )
      .filter(Boolean);


  /*
    Também cria uma versão compactada.
  */

  const fullText =
    lines.join("\n");


  /* =======================================================
     1. LOCALIZAR DESTINATÁRIO
  ======================================================= */

  const destinationRegex =
    /DESTINAT[ÁAÃÂÀ]RIO|DESTINATARIO|DESTINATÁRIO|DESTINATARIO\/REMETENTE|DESTINATÁRIO\/REMETENTE/i;


  let destinationStarts = [];


  lines.forEach((line,index)=>{

    if(
      destinationRegex.test(line)
    ){

      destinationStarts.push(index);
    }

  });


  /*
    Para cada bloco de destinatário,
    procura o CNPJ e o nome.
  */

  for(
    const start of destinationStarts
  ){

    const block =
      lines.slice(
        start,
        Math.min(
          lines.length,
          start + 30
        )
      );


    /*
      Tenta extrair nome de uma linha
      NOME/RAZÃO SOCIAL.
    */

    let inlineName = null;


    for(
      const line of block
    ){

      const candidate =
        extractInlineName(line);

      if(candidate){

        inlineName =
          candidate;

        break;
      }
    }


    /*
      CNPJs existentes dentro do bloco.
    */

    const cnpjs =
      findAllCnpj(
        block.join("\n")
      );


    if(cnpjs.length){

      const c =
        cnpjs[0];


      /*
        Descobrir a posição do CNPJ
        para procurar a razão social
        imediatamente relacionada.
      */

      let cnpjIndex = -1;


      for(
        let i=0;
        i<block.length;
        i++
      ){

        if(
          findCnpj(block[i]) === c
        ){

          cnpjIndex = i;

          break;
        }
      }


      let name =
        inlineName;


      if(!name && cnpjIndex >= 0){

        name =
          extractNameNearCnpj(
            block,
            cnpjIndex
          );
      }


      /*
        Fallback específico do bloco.
        NÃO procura fora do bloco.
      */

      if(!name){

        for(
          let i=1;
          i<block.length;
          i++
        ){

          const candidate =
            cleanName(block[i]);


          if(
            !isBadName(candidate) &&
            !isFieldLine(candidate) &&
            !findCnpj(candidate) &&
            !/DESTINATARIO|DESTINATÁRIO|REMETENTE|EMITENTE/i.test(candidate)
          ){

            name =
              candidate;

            break;
          }
        }
      }


      return {

        c,

        n:
          name ||
          "Destinatário não identificado"

      };
    }
  }


  /* =======================================================
     2. PROCURAR NOME/RAZÃO SOCIAL + CNPJ
  ======================================================= */

  for(
    let i=0;
    i<lines.length;
    i++
  ){

    const line =
      normalize(lines[i]);


    if(
      /NOME\s*\/?\s*RAZAO\s*SOCIAL/.test(line) ||
      /RAZAO\s*SOCIAL/.test(line)
    ){

      /*
        Procurar CNPJ somente nas próximas linhas.
      */

      const block =
        lines.slice(
          i,
          Math.min(
            lines.length,
            i + 12
          )
        );


      const c =
        findCnpj(
          block.join("\n")
        );


      if(c){

        const inline =
          extractInlineName(
            lines[i]
          );


        if(inline){

          return {
            c,
            n:inline
          };
        }


        const cnpjIndex =
          block.findIndex(
            x => findCnpj(x) === c
          );


        let name = null;


        if(cnpjIndex >= 0){

          name =
            extractNameNearCnpj(
              block,
              cnpjIndex
            );
        }


        if(name){

          return {
            c,
            n:name
          };
        }
      }
    }
  }


  /* =======================================================
     3. FALLBACK MAIS CONTROLADO
  ======================================================= */

  /*
    Procura explicitamente a palavra
    DESTINATÁRIO em um texto grande.
  */

  const upper =
    normalize(fullText);


  const pos =
    upper.search(
      /DESTINAT[ÁAÃÂÀ]RIO|DESTINATARIO/
    );


  if(pos >= 0){

    const destText =
      fullText.substring(
        pos,
        pos + 1800
      );


    const c =
      findCnpj(destText);


    if(c){

      const destLines =
        destText
          .split("\n")
          .map(x => clean(x))
          .filter(Boolean);


      let name = null;


      /*
        Procurar NOME/RAZÃO SOCIAL
        dentro do texto do destinatário.
      */

      for(
        let i=0;
        i<destLines.length;
        i++
      ){

        const candidate =
          extractInlineName(
            destLines[i]
          );


        if(candidate){

          name = candidate;

          break;
        }


        if(
          /NOME\s*\/?\s*RAZAO\s*SOCIAL|RAZAO\s*SOCIAL/i.test(
            destLines[i]
          )
        ){

          for(
            let j=i+1;
            j<Math.min(
              destLines.length,
              i+5
            );
            j++
          ){

            const n =
              cleanName(
                destLines[j]
              );


            if(
              !isBadName(n) &&
              !isFieldLine(n) &&
              !findCnpj(n)
            ){

              name=n;

              break;
            }
          }
        }


        if(name) break;
      }


      return {

        c,

        n:
          name ||
          "Destinatário não identificado"

      };
    }
  }


  /*
    IMPORTANTE:

    NÃO usar o primeiro CNPJ encontrado no documento.

    Isso poderia pegar o EMITENTE.

    Se não conseguimos provar que o CNPJ
    pertence ao destinatário, retornamos vazio.
  */

  return {

    c:null,

    n:"Destinatário não identificado"

  };
}


/* =========================================================
   OCR
========================================================= */

async function ocr(page){

  const viewport =
    page.getViewport({
      scale:2.8
    });


  const canvas =
    document.createElement("canvas");


  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently:true
      }
    );


  canvas.width =
    Math.ceil(viewport.width);

  canvas.height =
    Math.ceil(viewport.height);


  await page.render({

    canvasContext:ctx,

    viewport

  }).promise;


  $("progress").textContent =
    "Preparando OCR...";


  const result =
    await Tesseract.recognize(
      canvas,
      "por",
      {

        logger:m => {

          if(
            m.status ===
            "recognizing text"
          ){

            $("progress").textContent =
              `OCR: ${Math.round(
                (m.progress || 0) * 100
              )}%`;
          }

        }

      }
    );


  return result.data.text || "";
}


/* =========================================================
   ANALISAR
========================================================= */

$("analyze").onclick =
  analyze;


async function analyze(){

  $("analyze").disabled =
    true;


  groups.clear();


  $("results").innerHTML =
    "";

  $("results").className =
    "results";


  const mode =
    getMode();


  status(

    mode === "original"

      ? "Analisando PDF ORIGINAL pelo DESTINATÁRIO..."

      : "Analisando PDF DIGITALIZADO pelo OCR e DESTINATÁRIO...",

    "warn"

  );


  let total = 0;

  let ocrPages = 0;

  let unknown = 0;


  try{

    for(
      const f of files
    ){

      const data =
        new Uint8Array(
          await f.arrayBuffer()
        );


      const pdf =
        await pdfjsLib
          .getDocument({
            data
          })
          .promise;


      total +=
        pdf.numPages;


      for(
        let p=1;
        p<=pdf.numPages;
        p++
      ){

        $("progress").textContent =
          `Analisando ${f.name}: página ${p} de ${pdf.numPages}`;


        const page =
          await pdf.getPage(p);


        /*
          Primeiro tenta leitura direta.
        */

        const textContent =
          await page.getTextContent();


        const directText =
          textContent.items
            .map(x => x.str || "")
            .join("\n");


        let r =
          recipient(
            directText
          );


        /*
          DIGITALIZADO:

          OCR é obrigatório.
        */

        if(
          mode === "scanned"
        ){

          const o =
            await ocr(page);


          ocrPages++;


          r =
            recipient(o);

        }


        /*
          ORIGINAL:

          Se não encontrou destinatário
          pela camada de texto, usa OCR
          como reforço.
        */

        else if(
          !r.c
        ){

          try{

            const o =
              await ocr(page);


            if(o.trim()){

              ocrPages++;


              r =
                recipient(o);

            }

          }catch(e){

            console.warn(
              "OCR de reforço indisponível:",
              e
            );

          }
        }


        /*
          Se não conseguiu CNPJ
          de destinatário, não cria grupo.
        */

        if(!r.c){

          unknown++;

          continue;
        }


        /*
          Criar grupo por CNPJ.
        */

        if(
          !groups.has(r.c)
        ){

          groups.set(
            r.c,
            {

              name:
                r.n ||
                "Destinatário não identificado",

              pages:[]

            }
          );
        }


        const g =
          groups.get(r.c);


        /*
          Se anteriormente não havia nome,
          atualizar com o nome encontrado.
        */

        if(

          (
            !g.name ||

            g.name ===
            "Destinatário não identificado"
          )

          &&

          r.n &&

          r.n !==
          "Destinatário não identificado"

        ){

          g.name =
            r.n;
        }


        /*
          Se apareceu um nome melhor,
          substituir nomes muito curtos.
        */

        if(
          g.name.length < 5 &&
          r.n &&
          r.n.length >= 5
        ){

          g.name =
            r.n;
        }


        g.pages.push({

          f,

          p

        });

      }

    }


    render();


    if(
      !groups.size
    ){

      status(

        "Não foi possível identificar o CNPJ do DESTINATÁRIO. Confira se o documento contém a área DESTINATÁRIO / NOME / RAZÃO SOCIAL.",

        "err"

      );

    }else{

      status(

        `${groups.size} destinatário(s)/CNPJ(s) encontrado(s). Cada destinatário terá seu próprio PDF.`,

        "ok"

      );

    }


    $("progress").textContent =
      `Análise concluída: ${total} página(s).` +

      (
        ocrPages
          ? ` OCR usado em ${ocrPages} página(s).`
          : ""
      ) +

      (
        unknown
          ? ` ${unknown} página(s) sem CNPJ de destinatário.`
          : ""
      );


  }catch(e){

    console.error(e);


    status(

      "Erro ao analisar o PDF. Verifique se o arquivo é um PDF fiscal válido.",

      "err"

    );

  }finally{

    $("analyze").disabled =
      !files.length;

  }
}


/* =========================================================
   RESULTADOS
========================================================= */

function render(){

  let h = `

    <div class="section">

      ${groups.size}
      destinatário(s)/CNPJ(s) encontrado(s)

    </div>

  `;


  if(!groups.size){

    h += `

      <div class="empty">

        Nenhum destinatário identificado.

      </div>

    `;

  }


  for(
    const [c,g] of groups
  ){

    h += `

      <div class="item">

        <div>

          <div class="name">

            ${escapeHtml(
              g.name
            )}

          </div>

          <div class="cnpj">

            CNPJ ${fmt(c)}

          </div>

          <div class="meta">

            ${g.pages.length}
            página(s) encontrada(s)

          </div>

        </div>


        <div class="item-actions">

          <button
            class="btn view"
            data-c="${escapeHtml(c)}"
          >
            👁 Visualizar PDF
          </button>


          <button
            class="btn download"
            data-c="${escapeHtml(c)}"
          >
            ⬇ Baixar PDF
          </button>

        </div>

      </div>

    `;
  }


  $("results").innerHTML =
    h;


  $("results").className =
    "results show";


  document
    .querySelectorAll(".view")
    .forEach(b => {

      b.onclick =
        () =>
          make(
            b.dataset.c,
            true
          );

    });


  document
    .querySelectorAll(".download")
    .forEach(b => {

      b.onclick =
        () =>
          make(
            b.dataset.c,
            false
          );

    });

}


/* =========================================================
   CRIAR PDF SEPARADO
========================================================= */

async function build(c){

  const g =
    groups.get(c);


  if(!g){

    throw new Error(
      "Destinatário não encontrado."
    );
  }


  const out =
    await PDFLib
      .PDFDocument
      .create();


  const cache =
    new Map();


  for(
    const x of g.pages
  ){

    let src =
      cache.get(x.f);


    if(!src){

      src =
        await PDFLib
          .PDFDocument
          .load(
            new Uint8Array(
              await x.f.arrayBuffer()
            )
          );


      cache.set(
        x.f,
        src
      );
    }


    const [page] =
      await out.copyPages(
        src,
        [x.p - 1]
      );


    out.addPage(page);

  }


  return out.save();
}


/* =========================================================
   VISUALIZAR / BAIXAR
========================================================= */

async function make(c,view){

  const g =
    groups.get(c);


  if(!g){

    status(
      "Destinatário não encontrado.",
      "err"
    );

    return;
  }


  try{

    status(
      "Gerando PDF...",
      "warn"
    );


    const bytes =
      await build(c);


    const blob =
      new Blob(
        [bytes],
        {
          type:"application/pdf"
        }
      );


    const url =
      URL.createObjectURL(
        blob
      );


    if(view){

      /*
        Abre o PDF em nova aba.
      */

      const win =
        window.open(
          url,
          "_blank"
        );


      if(!win){

        status(
          "O navegador bloqueou a visualização. Permita pop-ups para este site.",
          "err"
        );

      }


    }else{

      const a =
        document.createElement("a");


      a.href =
        url;


      /*
        Nome final:

        NOME DA EMPRESA - CNPJ.pdf

        Exemplo:

        TADEU E TINA VIANA TRANSPORTES DE CARGAS LTDA
        - 61.226.048-0001-07.pdf
      */

      const company =
        clean(
          g.name ||
          "DESTINATARIO"
        );


      const cnpjFile =
        fmtFileCnpj(c);


      a.download =
        `${company} - ${cnpjFile}.pdf`;


      document.body.appendChild(a);

      a.click();

      a.remove();


      status(
        "PDF baixado com sucesso.",
        "ok"
      );

    }


    setTimeout(
      () =>
        URL.revokeObjectURL(url),
      60000
    );


  }catch(e){

    console.error(e);


    status(
      "Não foi possível gerar este PDF.",
      "err"
    );

  }

}
