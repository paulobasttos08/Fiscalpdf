<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FiscalPDF — NF-e / NFC-e</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7fb;color:#102a43;font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:1080px;margin:auto;padding:0 18px}
.app{margin:24px 0;background:#fff;border:1px solid #dfe6ee;border-radius:20px;box-shadow:0 12px 35px #102a4314;overflow:hidden}
.head{padding:28px 30px;border-bottom:1px solid #e8edf3}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:54px;height:54px;border-radius:14px;background:#1261a8;color:white;display:grid;place-items:center;font-weight:900}
.head h1{margin:0;font-size:30px}
.head p{margin:6px 0 0;color:#667085}
.body{padding:30px}
.mode-title{font-size:18px;font-weight:900;margin-bottom:12px}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.mode-option{display:block;border:2px solid #d9e3ee;border-radius:14px;padding:18px;cursor:pointer;background:#fff}
.mode-option.selected{border-color:#0877d1;background:#f4faff}
.mode-option input{display:none}
.mode-top{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:900}
.mode-icon{font-size:22px}
.mode-option p{font-size:13px;color:#667085;line-height:1.45;margin:10px 0}
.mode-tag{display:inline-block;background:#e7eef6;color:#1261a8;padding:5px 9px;border-radius:6px;font-size:11px;font-weight:900}
.drop{border:2px dashed #63a9e9;background:#f7fbff;border-radius:15px;padding:48px 20px;text-align:center;cursor:pointer}
.drop b{display:block;font-size:20px;margin:9px}
.drop span{color:#667085}
input[type=file]{display:none}
.actions{display:flex;gap:10px;margin-top:16px}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer}
.main{background:#0877d1;color:#fff;box-shadow:0 5px 12px #0877d133}
.clear{background:#e9eef4;color:#102a43}
.view{background:#edf5fc;color:#1261a8;border:1px solid #bdd5e9}
.download{background:#07824f;color:#fff}
.btn:disabled{opacity:.55;cursor:not-allowed}
.status{display:none;margin-top:18px;padding:13px 15px;border-radius:10px;font-size:14px;font-weight:700}
.show{display:block}
.ok{background:#ecfdf3;color:#067647;border:1px solid #abefc6}
.warn{background:#fffaeb;color:#b54708;border:1px solid #fedf89}
.err{background:#fef3f2;color:#b42318;border:1px solid #fecdca}
.progress{margin-top:10px;color:#667085;font-size:13px;min-height:18px}
.file{padding:10px 0;border-bottom:1px solid #edf1f4;font-size:14px}
.results{display:none;margin-top:26px}
.results.show{display:block}
.section{font-weight:900;font-size:20px;margin-bottom:12px}
.item{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:18px;border:1px solid #dfe6ee;border-radius:14px;margin-bottom:10px}
.name{font-size:17px;font-weight:900}
.cnpj{color:#1769aa;font-weight:800;margin-top:5px}
.meta{font-size:13px;color:#667085;margin-top:5px}
.item button{white-space:nowrap}
@media(max-width:650px){
 .body,.head{padding:20px}
 .mode-grid{grid-template-columns:1fr}
 .item{flex-direction:column;align-items:stretch}
 .item button{width:100%;margin-top:7px}
}
</style>
</head>

<body>
<div class="wrap">
<div class="app">

<header class="head">
  <div class="brand">
    <div class="logo">NF-e</div>
    <div>
      <h1>FiscalPDF</h1>
      <p>Organize NF-e e NFC-e pelo <b>destinatário</b></p>
    </div>
  </div>
</header>

<main class="body">

<div class="mode-title">Como deseja analisar o PDF?</div>

<div class="mode-grid">
  <label class="mode-option selected" id="modeOriginal">
    <input type="radio" name="mode" value="original" checked>
    <div class="mode-top"><span class="mode-icon">📄</span><span>PDF ORIGINAL</span></div>
    <p>Use quando o PDF possuir texto selecionável. É mais rápido e não precisa de OCR.</p>
    <span class="mode-tag">LEITURA DIRETA</span>
  </label>

  <label class="mode-option" id="modeScanned">
    <input type="radio" name="mode" value="scanned">
    <div class="mode-top"><span class="mode-icon">🖨️</span><span>PDF DIGITALIZADO</span></div>
    <p>Use quando o documento foi escaneado ou composto por imagens. O sistema utilizará OCR.</p>
    <span class="mode-tag">OCR</span>
  </label>
</div>

<label class="drop" for="files">
  📄
  <b>Selecionar arquivos PDF</b>
  <span>ou arraste e solte seus PDFs fiscais aqui</span>
</label>

<input id="files" type="file" accept=".pdf,application/pdf" multiple>

<div class="actions">
  <button id="clear" class="btn clear" disabled>Limpar</button>
  <button id="analyze" class="btn main" disabled>🔎 Analisar PDFs</button>
</div>

<div id="status" class="status"></div>
<div id="progress" class="progress"></div>
<div id="fileList"></div>
<div id="results" class="results"></div>

</main>
</div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const $ = x => document.getElementById(x);
let files = [];
let groups = new Map();

function clean(s){
  return String(s || "")
    .replace(/[\\/:*?"<>|]/g," ")
    .replace(/\s+/g," ")
    .trim();
}

function normalize(s){
  return String(s || "")
    .normalize("NFD")
    .replace(/[\\u0300-\\u036f]/g,"")
    .toUpperCase()
    .replace(/\\s+/g," ")
    .trim();
}

function dig(s){ return String(s || "").replace(/\D/g,""); }

function valid(c){
  c = dig(c);
  if(c.length !== 14 || /^(\d)\1+$/.test(c)) return false;

  let sum=0,w=5;
  for(let i=0;i<12;i++){
    sum += +c[i]*w;
    w = w==2 ? 9 : w-1;
  }
  let d = sum%11<2 ? 0 : 11-sum%11;
  if(d != +c[12]) return false;

  sum=0; w=6;
  for(let i=0;i<13;i++){
    sum += +c[i]*w;
    w = w==2 ? 9 : w-1;
  }
  d = sum%11<2 ? 0 : 11-sum%11;
  return d == +c[13];
}

function fmt(c){
  return c.replace(
    /(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,
    "$1.$2.$3/$4-$5"
  );
}

function status(t,c){
  $("status").textContent=t;
  $("status").className="status show "+c;
}

function renderFiles(){
  $("fileList").innerHTML = files.map((f,i)=>
    `<div class="file">📄 ${i+1}. ${clean(f.name)}</div>`
  ).join("");

  $("analyze").disabled = !files.length;
  $("clear").disabled = !files.length;
}

function add(a){
  let p = a.filter(f =>
    f.type=="application/pdf" || /\.pdf$/i.test(f.name)
  );

  if(!p.length){
    status("Selecione um PDF válido.","err");
    return;
  }

  files.push(...p);
  renderFiles();
  status(
    `${files.length} PDF(s) selecionado(s). Clique em Analisar PDFs.`,
    "ok"
  );
}

$("files").onchange = () => add([...$("files").files]);

let drop = document.querySelector(".drop");

drop.ondragover = e => {
  e.preventDefault();
  drop.style.borderColor="#0877d1";
};

drop.ondragleave = () => {
  drop.style.borderColor="#63a9e9";
};

drop.ondrop = e => {
  e.preventDefault();
  drop.style.borderColor="#63a9e9";
  add([...e.dataTransfer.files]);
};

$("clear").onclick = () => {
  files=[];
  groups.clear();
  $("files").value="";
  $("fileList").innerHTML="";
  $("results").innerHTML="";
  $("results").className="results";
  $("status").className="status";
  $("progress").textContent="";
};

/* =========================================================
   MODO ORIGINAL / DIGITALIZADO
========================================================= */

document.querySelectorAll('input[name="mode"]').forEach(input=>{
  input.addEventListener("change",()=>{
    $("modeOriginal").classList.toggle(
      "selected",
      input.value==="original" && input.checked
    );
    $("modeScanned").classList.toggle(
      "selected",
      input.value==="scanned" && input.checked
    );
  });
});

function getMode(){
  return document.querySelector('input[name="mode"]:checked').value;
}

/* =========================================================
   CNPJ
========================================================= */

function findCnpj(s){
  let a = s.match(
    /\d{2}[.\s]?\d{3}[.\s]?\d{3}[\/\s]?\d{4}[-\s]?\d{2}/g
  ) || [];

  for(let x of a){
    if(valid(x)) return dig(x);
  }

  return null;
}

/* =========================================================
   DESTINATÁRIO
   REGRA PRINCIPAL:
   NUNCA escolher o emitente como destinatário.
   Para PDF DIGITALIZADO, o OCR pode alterar palavras.
   Por isso usamos várias formas de localizar:
   - DESTINATÁRIO
   - DESTINATARIO
   - NOME / RAZÃO SOCIAL
   - RAZÃO SOCIAL
   - NOME
   e sempre associamos o CNPJ ao bloco do destinatário.
========================================================= */

function isBadName(s){
  let n = normalize(s);

  if(!n) return true;
  if(n.length < 3) return true;
  if(/^(CNPJ|CPF|IE|INSCRICAO|INSCRICAO ESTADUAL|ENDERECO|ENDEREÇO|CEP|MUNICIPIO|MUNICÍPIO|UF|FONE|TELEFONE|DATA|EMISSAO|EMISSÃO)$/.test(n))
    return true;
  if(/^\d[\d\s./-]*$/.test(n)) return true;
  if(/^(DESTINATARIO|DESTINATARIO\/REMETENTE|REMETENTE)$/.test(n)) return true;
  if(/EMITENTE|DANFE|DOCUMENTO AUXILIAR|NOTA FISCAL ELETRONICA/.test(n))
    return true;

  return !/[A-ZÀ-Ÿ]{3}/.test(n);
}

function cleanName(s){
  return clean(s)
    .replace(/^[:;,.\\-–—]+/,"")
    .replace(/[;,.\\-–—]+$/,"")
    .trim();
}

function nameFromBlock(block){
  const joined = block.join(" ");

  const patterns = [
    /NOME\s*\/?\s*RAZAO\s*SOCIAL\s*[:\-]?\s*(.+?)(?=\s+CNPJ\s*\/?\s*CPF|\s+CPF|\s+IE\b|$)/i,
    /NOME\s*\/?\s*RAZAO\s*SOCIAL\s*[:\-]?\s*(.+)/i,
    /RAZAO\s*SOCIAL\s*[:\-]?\s*(.+?)(?=\s+CNPJ|\s+CPF|\s+IE\b|$)/i,
    /NOME\s*[:\-]?\s*(.+?)(?=\s+CNPJ|\s+CPF|\s+IE\b|$)/i
  ];

  for(const re of patterns){
    const m = joined.match(re);
    if(m){
      const candidate = cleanName(m[1]);
      if(!isBadName(candidate)) return candidate;
    }
  }

  for(let i=0;i<block.length;i++){
    const line = block[i];

    if(/NOME\s*\/?\s*RAZAO\s*SOCIAL/i.test(line) ||
       /RAZAO\s*SOCIAL/i.test(line) ||
       /^NOME\b/i.test(line)){

      let value = line
        .replace(/.*?NOME\s*\/?\s*RAZAO\s*SOCIAL\s*[:\-]?/i,"")
        .replace(/.*?RAZAO\s*SOCIAL\s*[:\-]?/i,"")
        .replace(/^NOME\s*[:\-]?/i,"")
        .trim();

      if(!isBadName(value)) return cleanName(value);

      for(let j=i+1;j<Math.min(i+4,block.length);j++){
        if(!isBadName(block[j])) return cleanName(block[j]);
      }
    }
  }

  return null;
}

function recipient(raw){
  if(!raw) return {c:null,n:"Destinatário não identificado"};

  const normalizedRaw = raw
    .replace(/\r/g,"\n")
    .replace(/[ \t]+/g," ");

  let lines = normalizedRaw
    .split(/\n/)
    .map(x=>clean(x))
    .filter(Boolean);

  /* ---------- 1. LOCALIZA O CABEÇALHO DO DESTINATÁRIO ---------- */

  const headerRegex =
    /DESTINAT[ÁAÃÃ]RIO|DESTINATARIO|DESTINATÁRIO|NOME\s*\/?\s*RAZ[ÃA]O\s*SOCIAL/i;

  let starts=[];

  lines.forEach((line,i)=>{
    if(headerRegex.test(line)) starts.push(i);
  });

  for(const start of starts){
    const block = lines.slice(start, start+22);

    let c = findCnpj(block.join("\n"));
    let n = nameFromBlock(block);

    /* Se achou CNPJ no bloco do destinatário, tenta nome mesmo
       quando o OCR separou o nome em uma linha diferente. */
    if(c){
      if(!n){
        for(let i=1;i<block.length;i++){
          if(valid(findCnpj(block[i])||"")) break;
          if(!isBadName(block[i]) &&
             !/ENDERECO|MUNICIPIO|CEP|FONE|IE|INSCRICAO|EMITENTE/i.test(normalize(block[i]))){
            n=cleanName(block[i]);
            break;
          }
        }
      }

      return {
        c,
        n:n || "Destinatário não identificado"
      };
    }
  }

  /* ---------- 2. BLOCO POR NOME/RAZÃO SOCIAL ---------- */

  for(let i=0;i<lines.length;i++){
    if(/NOME\s*\/?\s*RAZAO\s*SOCIAL|RAZAO\s*SOCIAL/i.test(lines[i])){
      const block=lines.slice(Math.max(0,i-2),i+10);
      const c=findCnpj(block.join("\n"));
      const n=nameFromBlock(block);

      if(c){
        return {
          c,
          n:n || "Destinatário não identificado"
        };
      }
    }
  }

  /* ---------- 3. FALLBACK EXCLUSIVO DO DESTINATÁRIO ---------- */

  const text=lines.join(" ");

  const destBlock =
    text.match(
      /DESTINAT[ÁAÃÃ]RIO[\s\S]{0,1200}/i
    ) ||
    text.match(
      /DESTINATARIO[\s\S]{0,1200}/i
    );

  if(destBlock){
    const c=findCnpj(destBlock[0]);
    const n=nameFromBlock(
      destBlock[0]
        .split(/(?=NOME|RAZAO|CNPJ|CPF|IE|ENDERECO)/i)
        .map(x=>clean(x))
        .filter(Boolean)
    );

    if(c){
      return {
        c,
        n:n || "Destinatário não identificado"
      };
    }
  }

  /* IMPORTANTE:
     Não pegamos simplesmente o primeiro CNPJ do documento.
     Isso evita transformar o EMITENTE em destinatário. */

  return {
    c:null,
    n:"Destinatário não identificado"
  };
}

/* =========================================================
   OCR
========================================================= */

async function ocr(page){
  let v=page.getViewport({scale:2.8});
  let cv=document.createElement("canvas");
  let ctx=cv.getContext("2d",{willReadFrequently:true});

  cv.width=Math.ceil(v.width);
  cv.height=Math.ceil(v.height);

  await page.render({
    canvasContext:ctx,
    viewport:v
  }).promise;

  let r=await Tesseract.recognize(cv,"por",{
    logger:m=>{
      if(m.status==="recognizing text"){
        $("progress").textContent =
          `OCR: ${Math.round((m.progress||0)*100)}%`;
      }
    }
  });

  return r.data.text || "";
}

/* =========================================================
   ANALISAR
========================================================= */

$("analyze").onclick=analyze;

async function analyze(){
  $("analyze").disabled=true;
  groups.clear();
  $("results").innerHTML="";
  $("results").className="results";

  const mode=getMode();

  status(
    mode==="original"
      ? "Analisando PDF ORIGINAL pelo DESTINATÁRIO..."
      : "Analisando PDF DIGITALIZADO pelo OCR e DESTINATÁRIO...",
    "warn"
  );

  let total=0;
  let ocrPages=0;
  let unknown=0;

  try{
    for(const f of files){

      const pdf=await pdfjsLib.getDocument({
        data:new Uint8Array(await f.arrayBuffer())
      }).promise;

      total += pdf.numPages;

      for(let p=1;p<=pdf.numPages;p++){

        $("progress").textContent =
          `Analisando ${f.name}: página ${p} de ${pdf.numPages}`;

        const page=await pdf.getPage(p);
        const tc=await page.getTextContent();

        let text=tc.items
          .map(x=>x.str || "")
          .join(" ");

        let r=recipient(text);

        /* PDF digitalizado:
           sempre executa OCR, pois normalmente o PDF não possui
           camada de texto confiável. */
        if(mode==="scanned"){
          const o=await ocr(page);
          ocrPages++;
          r=recipient(o);
        }
        /* Original:
           se a leitura direta não encontrou o destinatário,
           fazemos OCR somente como reforço. */
        else if(!r.c){
          try{
            const o=await ocr(page);
            if(o.trim()){
              ocrPages++;
              r=recipient(o);
            }
          }catch(e){
            console.warn("OCR de reforço indisponível:",e);
          }
        }

        if(!r.c){
          unknown++;
          continue;
        }

        if(!groups.has(r.c)){
          groups.set(r.c,{
            name:r.n,
            pages:[]
          });
        }

        const g=groups.get(r.c);

        if(
          (!g.name ||
           g.name==="Destinatário não identificado") &&
          r.n &&
          r.n!=="Destinatário não identificado"
        ){
          g.name=r.n;
        }

        g.pages.push({
          f,
          p
        });
      }
    }

    render();

    if(!groups.size){
      status(
        "Não foi possível identificar o CNPJ do DESTINATÁRIO. Confira se o documento contém a área DESTINATÁRIO / NOME / RAZÃO SOCIAL.",
        "err"
      );
    }else{
      status(
        `${groups.size} destinatário(s)/CNPJ(s) encontrado(s). Cada destinatário terá seu próprio PDF.`,
        "ok"
      );
    }

    $("progress").textContent =
      `Análise concluída: ${total} página(s).` +
      (ocrPages ? ` OCR usado em ${ocrPages} página(s).` : "") +
      (unknown ? ` ${unknown} página(s) sem CNPJ de destinatário.` : "");

  }catch(e){
    console.error(e);
    status(
      "Erro ao analisar o PDF. Verifique se o arquivo é um PDF fiscal válido.",
      "err"
    );
  }finally{
    $("analyze").disabled=!files.length;
  }
}

/* =========================================================
   RESULTADOS
========================================================= */

function escapeHtml(s){
  return String(s||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function render(){

  let h =
    `<div class="section">Destinatários encontrados</div>`;

  for(const [c,g] of groups){

    h += `
      <div class="item">

        <div>
          <div class="name">${escapeHtml(g.name)}</div>
          <div class="cnpj">CNPJ ${fmt(c)}</div>
          <div class="meta">
            ${g.pages.length} página(s) encontrada(s)
          </div>
        </div>

        <div>
          <button
            class="btn view"
            data-c="${c}">
            👁 Visualizar PDF
          </button>

          <button
            class="btn download"
            data-c="${c}">
            ⬇ Baixar PDF
          </button>
        </div>

      </div>
    `;
  }

  $("results").innerHTML =
    h +
    (groups.size
      ? ""
      : `<div class="meta">Nenhum destinatário identificado.</div>`);

  $("results").className="results show";

  document.querySelectorAll(".view").forEach(b=>{
    b.onclick=()=>make(b.dataset.c,true);
  });

  document.querySelectorAll(".download").forEach(b=>{
    b.onclick=()=>make(b.dataset.c,false);
  });
}

/* =========================================================
   CRIAR PDF SEPARADO
========================================================= */

async function build(c){

  const g=groups.get(c);

  const out=await PDFLib.PDFDocument.create();
  const cache=new Map();

  for(const x of g.pages){

    let src=cache.get(x.f);

    if(!src){
      src=await PDFLib.PDFDocument.load(
        new Uint8Array(await x.f.arrayBuffer())
      );
      cache.set(x.f,src);
    }

    const [page]=await out.copyPages(
      src,
      [x.p-1]
    );

    out.addPage(page);
  }

  return out.save();
}

async function make(c,view){

  const g=groups.get(c);

  try{

    const bytes=await build(c);

    const url=URL.createObjectURL(
      new Blob([bytes],{type:"application/pdf"})
    );

    if(view){

      window.open(url,"_blank");

    }else{

      const a=document.createElement("a");

      a.href=url;

      /* Nome:
         NOME DA EMPRESA - CNPJ.pdf */
      a.download =
        `${clean(g.name || "DESTINATARIO")} - ${fmt(c)}.pdf`;

      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    setTimeout(
      ()=>URL.revokeObjectURL(url),
      60000
    );

  }catch(e){

    console.error(e);

    status(
      "Não foi possível gerar este PDF.",
      "err"
    );
  }
}
</script>

</body>
</html>
