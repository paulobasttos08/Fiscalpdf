<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Juntar PDFs por CNPJ</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;color:#17202a}
    .wrap{max-width:1050px;margin:0 auto;padding:32px 18px}.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 8px 28px #00000012}
    h1{margin:0 0 8px;font-size:28px}.sub{color:#667085;margin:0 0 24px}.drop{border:2px dashed #98a2b3;border-radius:14px;padding:36px;text-align:center;background:#fafbfc;cursor:pointer}
    .drop:hover{background:#f5f7fa}.drop strong{display:block;font-size:18px;margin-bottom:8px}.drop span{color:#667085}
    input[type=file]{display:none}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;background:#111827;color:#fff}
    .btn.secondary{background:#e9eef3;color:#17202a}.btn:disabled{opacity:.45;cursor:not-allowed}
    .status{padding:13px 15px;border-radius:10px;margin:15px 0;display:none}.status.show{display:block}.ok{background:#ecfdf3;color:#067647}.warn{background:#fffaeb;color:#b54708}.err{background:#fef3f2;color:#b42318}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.group{border:1px solid #e4e7ec;border-radius:12px;padding:15px;margin-top:14px}
    .group h3{margin:0 0 8px;font-size:16px}.meta{font-size:13px;color:#667085}.file{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #f0f2f5}
    .file:last-child{border-bottom:0}.badge{font-size:12px;font-weight:700;padding:4px 8px;border-radius:999px;background:#eef2f6}.empty{text-align:center;color:#667085;padding:25px}
    @media(max-width:700px){.grid{grid-template-columns:1fr}.drop{padding:28px 15px}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Juntar PDFs por CNPJ</h1>
    <p class="sub">O sistema lê os PDFs, identifica os CNPJs e cria um PDF separado para cada CNPJ encontrado.</p>

    <label class="drop" for="files">
      <strong>Selecione ou arraste os PDFs aqui</strong>
      <span>Você pode adicionar vários arquivos de uma vez.</span>
    </label>
    <input id="files" type="file" accept="application/pdf,.pdf" multiple>

    <div class="actions">
      <button class="btn secondary" id="clear" disabled>Limpar</button>
      <button class="btn" id="merge" disabled>Processar e criar PDFs</button>
    </div>

    <div id="status" class="status"></div>
    <div id="summary" class="meta"></div>
    <div id="groups" class="grid"></div>
  </div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const input = document.getElementById("files");
const clearBtn = document.getElementById("clear");
const mergeBtn = document.getElementById("merge");
const status = document.getElementById("status");
const groupsEl = document.getElementById("groups");
const summary = document.getElementById("summary");
let selected = [];

document.querySelector(".drop").addEventListener("dragover", e => {e.preventDefault()});
document.querySelector(".drop").addEventListener("drop", e => {
  e.preventDefault();
  addFiles([...e.dataTransfer.files]);
});
input.addEventListener("change", () => addFiles([...input.files]));
clearBtn.addEventListener("click", () => { selected=[]; input.value=""; render(); });
mergeBtn.addEventListener("click", processAll);

function addFiles(files){
  const pdfs = files.filter(f => f.type === "application/pdf" || f.name.toLowerCase().endsWith(".pdf"));
  selected.push(...pdfs);
  render();
}

function normalizeCnpj(v){
  return (v || "").replace(/\D/g,"");
}
function formatCnpj(v){
  v=normalizeCnpj(v);
  return v.length===14 ? v.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,"$1.$2.$3/$4-$5") : v;
}
function validCnpj(cnpj){
  cnpj=normalizeCnpj(cnpj);
  if(cnpj.length!==14 || /^(\d)\1{13}$/.test(cnpj)) return false;
  let calc = (base, weights) => {
    let sum=0;
    for(let i=0;i<weights.length;i++) sum += Number(base[i])*weights[i];
    const r=sum%11;
    return r<2?0:11-r;
  };
  const d1=calc(cnpj.slice(0,12),[5,4,3,2,9,8,7,6,5,4,3,2]);
  const d2=calc(cnpj.slice(0,12)+d1,[6,5,4,3,2,9,8,7,6,5,4,3,2]);
  return d1===Number(cnpj[12]) && d2===Number(cnpj[13]);
}

function findCnpjs(text){
  const compact = text.replace(/\s+/g," ");
  const matches = compact.match(/\b\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}\b/g) || [];
  const valid = [...new Set(matches.map(normalizeCnpj))].filter(validCnpj);
  return valid;
}

async function extractText(file){
  const buffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buffer}).promise;
  let text="";
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const content=await page.getTextContent();
    text += content.items.map(x=>x.str).join(" ") + "\n";
  }
  return {buffer, pages: pdf.numPages, text};
}

function render(){
  clearBtn.disabled=selected.length===0;
  mergeBtn.disabled=selected.length<1;
  summary.textContent=selected.length ? `${selected.length} PDF(s) selecionado(s).` : "";
  groupsEl.innerHTML="";
  if(!selected.length){ groupsEl.innerHTML='<div class="empty">Nenhum PDF selecionado.</div>'; return; }
  selected.forEach((f,i)=>{
    const d=document.createElement("div"); d.className="group";
    d.innerHTML=`<h3>${i+1}. ${escapeHtml(f.name)}</h3><div class="meta">${(f.size/1024/1024).toFixed(2)} MB</div>`;
    groupsEl.appendChild(d);
  });
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function setStatus(msg, cls){status.className="status show "+cls; status.textContent=msg;}

async function processAll(){
  if(!selected.length) return;
  mergeBtn.disabled=true; clearBtn.disabled=true; groupsEl.innerHTML="";
  setStatus("Analisando os PDFs e identificando os CNPJs...", "warn");
  const analyzed=[];
  try{
    for(let i=0;i<selected.length;i++){
      const f=selected[i];
      const r=await extractText(f);
      const cnpjs=findCnpjs(r.text);
      analyzed.push({file:f, ...r, cnpjs});
    }

    const groups = new Map();
    for(const item of analyzed){
      // Se houver vários CNPJs válidos dentro do mesmo arquivo, não mistura:
      // o arquivo é colocado em "CNPJ_MAIS_DE_UM" para revisão.
      const key = item.cnpjs.length===1 ? item.cnpjs[0] : (item.cnpjs.length===0 ? "SEM_CNPJ" : "MULTIPLOS_CNPJ");
      if(!groups.has(key)) groups.set(key,[]);
      groups.get(key).push(item);
    }

    groupsEl.innerHTML="";
    for(const [cnpj, items] of groups){
      const box=document.createElement("div"); box.className="group";
      const title = cnpj==="SEM_CNPJ" ? "⚠️ Sem CNPJ identificado" :
                    cnpj==="MULTIPLOS_CNPJ" ? "⚠️ Mais de um CNPJ no arquivo" :
                    "CNPJ: "+formatCnpj(cnpj);
      box.innerHTML=`<h3>${escapeHtml(title)}</h3><div class="meta">${items.length} arquivo(s)</div>`;
      items.forEach(x=>{
        const row=document.createElement("div"); row.className="file";
        row.innerHTML=`<span>${escapeHtml(x.file.name)}</span><span class="badge">${x.pages} pág.</span>`;
        box.appendChild(row);
      });
      groupsEl.appendChild(box);
    }

    if(groups.size===1 && groups.has("SEM_CNPJ")){
      setStatus("Nenhum CNPJ válido foi identificado. Os PDFs não foram unidos.", "err");
      return;
    }
    if(groups.has("MULTIPLOS_CNPJ")){
      setStatus("Há arquivo(s) com mais de um CNPJ identificado. Esses arquivos foram separados para revisão e não foram misturados com os demais.", "warn");
    } else if(groups.has("SEM_CNPJ")){
      setStatus("PDFs com CNPJ foram agrupados. Arquivos sem CNPJ ficaram separados e não foram misturados.", "warn");
    } else if(groups.size===1){
      setStatus("Todos os PDFs possuem o mesmo CNPJ. Gerando um único PDF...", "ok");
    } else {
      setStatus(`Foram encontrados ${groups.size} grupos. Um PDF será criado para cada CNPJ diferente.`, "ok");
    }

    // Gera um PDF por grupo de CNPJ. Não mistura CNPJs diferentes.
    let created=0;
    for(const [cnpj,items] of groups){
      if(cnpj==="SEM_CNPJ" || cnpj==="MULTIPLOS_CNPJ") continue;
      const out=await PDFLib.PDFDocument.create();
      for(const item of items){
        const src=await PDFLib.PDFDocument.load(item.buffer);
        const pages=await out.copyPages(src, src.getPageIndices());
        pages.forEach(p=>out.addPage(p));
      }
      const bytes=await out.save();
      downloadBlob(bytes, `PDF_${cnpj}.pdf`, "application/pdf");
      created++;
      await new Promise(r=>setTimeout(r,120));
    }
    if(groups.has("SEM_CNPJ")){
      const items=groups.get("SEM_CNPJ");
      const out=await PDFLib.PDFDocument.create();
      for(const item of items){
        const src=await PDFLib.PDFDocument.load(item.buffer);
        const pages=await out.copyPages(src, src.getPageIndices());
        pages.forEach(p=>out.addPage(p));
      }
      const bytes=await out.save();
      downloadBlob(bytes, "PDF_SEM_CNPJ.pdf", "application/pdf");
      created++;
    }
    if(groups.has("MULTIPLOS_CNPJ")){
      // Não gera automaticamente para evitar misturar documentos com múltiplos emissores.
    }
    setStatus(`${created} PDF(s) criado(s). Cada CNPJ ficou em seu próprio arquivo.`, "ok");
  }catch(err){
    console.error(err);
    setStatus("Não foi possível processar um ou mais PDFs. Verifique se os arquivos são PDFs válidos e se o texto/CNPJ pode ser lido.", "err");
  }finally{
    mergeBtn.disabled=false; clearBtn.disabled=false;
  }
}

function downloadBlob(bytes,name,type){
  const blob=new Blob([bytes],{type});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
render();
</script>
</body>
</html>
