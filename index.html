<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FiscalPDF — NF-e / NFC-e</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f4f7fb;
  color:#102a43;
  font-family:Arial,Helvetica,sans-serif
}

.wrap{
  max-width:1080px;
  margin:auto;
  padding:0 18px
}

.app{
  margin:24px 0;
  background:#fff;
  border:1px solid #dfe6ee;
  border-radius:20px;
  box-shadow:0 12px 35px #102a4314;
  overflow:hidden
}

.head{
  padding:28px 30px;
  border-bottom:1px solid #e8edf3
}

.brand{
  display:flex;
  align-items:center;
  gap:14px
}

.logo{
  width:54px;
  height:54px;
  border-radius:14px;
  background:#1261a8;
  color:white;
  display:grid;
  place-items:center;
  font-weight:900
}

.head h1{
  margin:0;
  font-size:30px
}

.head p{
  margin:6px 0 0;
  color:#667085
}

.body{
  padding:30px
}

.mode-title{
  font-size:18px;
  font-weight:900;
  margin-bottom:12px
}

.mode-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-bottom:18px
}

.mode-option{
  display:block;
  border:2px solid #d9e3ee;
  border-radius:14px;
  padding:18px;
  cursor:pointer;
  background:#fff;
  transition:.2s
}

.mode-option:hover{
  border-color:#0877d1
}

.mode-option.selected{
  border-color:#0877d1;
  background:#f4faff;
  box-shadow:0 4px 12px #0877d11a
}

.mode-option input{
  display:none
}

.mode-top{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:17px;
  font-weight:900
}

.mode-icon{
  font-size:22px
}

.mode-option p{
  font-size:13px;
  color:#667085;
  line-height:1.45;
  margin:10px 0
}

.mode-tag{
  display:inline-block;
  background:#e7eef6;
  color:#1261a8;
  padding:5px 9px;
  border-radius:6px;
  font-size:11px;
  font-weight:900
}

.drop{
  border:2px dashed #63a9e9;
  background:#f7fbff;
  border-radius:15px;
  padding:48px 20px;
  text-align:center;
  cursor:pointer;
  transition:.2s
}

.drop:hover{
  background:#f0f8ff
}

.drop-icon{
  display:block;
  font-size:48px;
  line-height:1;
  margin-bottom:10px
}

.drop b{
  display:block;
  font-size:20px;
  margin:9px
}

.drop span{
  color:#667085
}

input[type=file]{
  display:none
}

.actions{
  display:flex;
  gap:10px;
  margin-top:16px
}

.btn{
  border:0;
  border-radius:10px;
  padding:12px 18px;
  font-weight:800;
  cursor:pointer;
  font-size:14px
}

.main{
  background:#0877d1;
  color:#fff;
  box-shadow:0 5px 12px #0877d133
}

.clear{
  background:#e9eef4;
  color:#102a43
}

.view{
  background:#edf5fc;
  color:#1261a8;
  border:1px solid #bdd5e9
}

.download{
  background:#07824f;
  color:#fff
}

.remove{
  background:#e9eef4;
  color:#102a43
}

.btn:hover{
  filter:brightness(.97)
}

.btn:disabled{
  opacity:.55;
  cursor:not-allowed
}

  display:none;
  margin-top:18px;
  padding:13px 15px;
  border-radius:10px;
  font-size:14px;
  font-weight:700
}

.show{
  display:block
}

.ok{
  background:#ecfdf3;
  color:#067647;
  border:1px solid #abefc6
}

.warn{
  background:#fffaeb;
  color:#b54708;
  border:1px solid #fedf89
}

.err{
  background:#fef3f2;
  color:#b42318;
  border:1px solid #fecdca
}

.progress{
  margin-top:10px;
  color:#667085;
  font-size:13px;
  min-height:18px
}

  padding:10px 0;
  border-bottom:1px solid #edf1f4;

}

  min-width:0
}

.file-name{
  font-weight:700;

}

.file-size{
  color:#667085;
  font-size:12px;

}

  display:none;
  margin-top:26px
}

.results.show{
  display:block
}

.section{
  font-weight:900;
  font-size:20px;
  margin-bottom:12px
}

.item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  padding:18px;
  border:1px solid #dfe6ee;
  border-radius:14px;
  margin-bottom:10px;
  background:#fff
}

.name{
  font-size:17px;
  font-weight:900;
  word-break:break-word
}

.cnpj{
  color:#1769aa;
  font-weight:800;
  margin-top:5px
}

.meta{
  font-size:13px;
  color:#667085;
  margin-top:5px
}

.item-actions{
  display:flex;
  gap:8px;
  flex-shrink:0
}

  .body,
  .head{

  .mode-grid{
    grid-template-columns:1fr

    flex-direction:column;
    align-items:stretch
  }

  .item-actions{
    flex-direction:column
  }

  .item button{
    width:100%;
    margin-top:0
  }

  .actions{
    flex-wrap:wrap
  }

</head>

<body>

<div class="wrap">
<div class="app">

<header class="head">

  <div class="brand">

    <div class="logo">
      NF-e
    </div>

    <div>
      <h1>FiscalPDF</h1>
      <p>
        Organize NF-e e NFC-e pelo <b>destinatário</b>
      </p>
    </div>

  </div>

</header>

<main class="body">

<div class="mode-title">
  Como deseja analisar o PDF?
</div>

<div class="mode-grid">

  <label class="mode-option selected" id="modeOriginal">

    <input
      type="radio"
      name="mode"
      value="original"
      checked
    >

    <div class="mode-top">
      <span class="mode-icon">📄</span>
      <span>PDF ORIGINAL</span>
    </div>

    <p>
      Use esta opção quando o PDF possuir texto selecionável.
      É mais rápido e não precisa de OCR.
    </p>

    <span class="mode-tag">
      LEITURA DIRETA
    </span>

  </label>


  <label class="mode-option" id="modeScanned">

    <input
      type="radio"
      name="mode"
      value="scanned"
    >

    <div class="mode-top">
      <span class="mode-icon">🖨️</span>
      <span>PDF DIGITALIZADO</span>
    </div>

    <p>
      Use esta opção quando o documento foi escaneado
      ou composto por imagens. O sistema utilizará OCR.
    </p>

    <span class="mode-tag">
      OCR
    </span>

  </label>

</div>


<label class="drop" for="files">

  <span class="drop-icon">📄</span>

  <b>Selecionar arquivos PDF</b>

  <span>
    ou arraste e solte seus PDFs fiscais aqui
  </span>

</label>

<input
  id="files"
  type="file"
  accept=".pdf,application/pdf"
  multiple
>


<div class="actions">

  <button
    id="clear"
    class="btn clear"
    disabled
  >
    Limpar
  </button>

  <button
    id="analyze"
    class="btn main"
    disabled
  >
    🔎 Analisar PDFs
  </button>

</div>


<div id="status" class="status"></div>

<div id="progress" class="progress"></div>

<div id="fileList"></div>

<div id="results" class="results"></div>

</main>
</div>
</div>


<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================================
   VARIÁVEIS
========================================================= */

const $ = x => document.getElementById(x);

let files = [];

let groups = new Map();


/* =========================================================
   FUNÇÕES BÁSICAS
========================================================= */

function clean(s){

  return String(s || "")
    .replace(/[\\/:*?"<>|]/g," ")
    .replace(/\s+/g," ")
    .trim();

}


function normalize(s){

  return String(s || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toUpperCase()
    .replace(/\s+/g," ")
    .trim();

}


function dig(s){

  return String(s || "")
    .replace(/\D/g,"");

}


function valid(c){

  c = dig(c);

  if(
    c.length !== 14 ||
    /^(\d)\1+$/.test(c)
  ){
    return false;
  }


  let sum = 0;
  let w = 5;

  for(let i=0;i<12;i++){

    sum += Number(c[i]) * w;

    w = w === 2 ? 9 : w - 1;

  }

  let d =
    sum % 11 < 2
      ? 0
      : 11 - (sum % 11);


  if(d !== Number(c[12])){
    return false;
  }


  sum = 0;
  w = 6;

  for(let i=0;i<13;i++){

    sum += Number(c[i]) * w;

    w = w === 2 ? 9 : w - 1;

  }


  d =
    sum % 11 < 2
      ? 0
      : 11 - (sum % 11);


  return d === Number(c[13]);

}


function fmt(c){

  c = dig(c);

  return c.replace(
    /(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,
    "$1.$2.$3/$4-$5"
  );

}


function status(t,c){

  $("status").textContent = t;

  $("status").className =
    "status show " + c;

}


/* =========================================================
   ARQUIVOS
========================================================= */

function formatBytes(bytes){

  if(bytes < 1024){
    return bytes + " B";
  }

  if(bytes < 1024 * 1024){
    return (bytes / 1024).toFixed(1) + " KB";
  }

  return (bytes / (1024 * 1024)).toFixed(1) + " MB";

}


function renderFiles(){

  $("fileList").innerHTML =
    files.map((f,i)=>`

      <div class="file">

        <div class="file-info">

          <div class="file-name">
            📄 ${i+1}. ${escapeHtml(clean(f.name))}
          </div>

          <div class="file-size">
            ${formatBytes(f.size)}
          </div>

        </div>

      </div>

    `).join("");


  $("analyze").disabled =
    !files.length;

  $("clear").disabled =
    !files.length;

}


function add(a){

  let p = a.filter(f =>
    f.type === "application/pdf" ||
    /\.pdf$/i.test(f.name)
  );


  if(!p.length){

    status(
      "Selecione um PDF válido.",
      "err"
    );

    return;
  }


  files.push(...p);

  renderFiles();


  status(
    `${files.length} PDF(s) selecionado(s). Clique em Analisar PDFs.`,
    "ok"
  );

}


$("files").onchange = () => {

  add([...$("files").files]);

};


let drop =
  document.querySelector(".drop");


drop.ondragover = e => {

  e.preventDefault();

  drop.style.borderColor =
    "#0877d1";

};


drop.ondragleave = () => {

  drop.style.borderColor =
    "#63a9e9";

};


drop.ondrop = e => {

  e.preventDefault();

  drop.style.borderColor =
    "#63a9e9";

  add([...e.dataTransfer.files]);

};


$("clear").onclick = () => {

  files = [];

  groups.clear();

  $("files").value = "";

  $("fileList").innerHTML = "";

  $("results").innerHTML = "";

  $("results").className = "results";

  $("status").className = "status";

  $("progress").textContent = "";

};


/* =========================================================
   MODO ORIGINAL / DIGITALIZADO
========================================================= */

document
  .querySelectorAll('input[name="mode"]')
  .forEach(input => {

    input.addEventListener("change", () => {

      $("modeOriginal").classList.toggle(
        "selected",
        input.value === "original" &&
        input.checked
      );


      $("modeScanned").classList.toggle(
        "selected",
        input.value === "scanned" &&
        input.checked
      );

    });

  });


function getMode(){

  return document
    .querySelector('input[name="mode"]:checked')
    .value;

}


/* =========================================================
   CNPJ
========================================================= */

function findAllCnpjs(s){

  let text = String(s || "");

  let matches =
    text.match(
      /\d{2}[.\s]?\d{3}[.\s]?\d{3}[\/\s]?\d{4}[-\s]?\d{2}/g
    ) || [];


  let result = [];

  for(let x of matches){

    let c = dig(x);

    if(
      valid(c) &&
      !result.includes(c)
    ){
      result.push(c);
    }

  }


  return result;

}


function findCnpj(s){

  let a = findAllCnpjs(s);

  return a.length ? a[0] : null;

}


/* =========================================================
   FILTROS DE TEXTO
========================================================= */

function isBadName(s){

  let n = normalize(s);


  if(!n){
    return true;
  }


  if(n.length < 3){
    return true;
  }


  /* somente números */

  if(/^\d[\d\s./-]*$/.test(n)){
    return true;
  }


  /* campos que não são nomes */

  if(
    /^(CNPJ|CPF|IE|INSCRICAO|INSCRICAO ESTADUAL|ENDERECO|CEP|MUNICIPIO|UF|FONE|TELEFONE|DATA|EMISSAO)$/
      .test(n)
  ){
    return true;
  }


  if(
    /^(DESTINATARIO|DESTINATARIO\/REMETENTE|REMETENTE|EMITENTE)$/
      .test(n)
  ){
    return true;
  }


  /* textos genéricos do DANFE */

  if(
    /DOCUMENTO AUXILIAR|NOTA FISCAL ELETRONICA|DANFE|CHAVE DE ACESSO|NATUREZA DA OPERACAO/
      .test(n)
  ){
    return true;
  }


  /* Não aceitar uma sequência enorme de campos */

  if(
    /(CNPJ|CPF|IE|DATA DA EMISSAO|DATA EMISSAO|ENDERECO|CEP)/
      .test(n)
  ){
    return true;
  }


  /* precisa possuir letras */

  if(!/[A-ZÀ-Ÿ]{3}/.test(n)){
    return true;
  }


  return false;

}


/* =========================================================
   LIMPEZA DE NOME OCR
========================================================= */

function cleanName(s){

  let x = clean(s);


  x = x
    .replace(/^[:;,.\-–—|]+/,"")
    .replace(/[;,.\-–—|]+$/,"")
    .trim();


  /* Remove rótulos que o OCR grudou no começo */

  x = x.replace(
    /^(?:I|l|1)?\s*NOME\s*\/?\s*RAZ[AÃ]O\s*SOCIAL\s*/i,
    ""
  );


  x = x.replace(
    /^(?:I|l|1)?\s*RAZ[AÃ]O\s*SOCIAL\s*/i,
    ""
  );


  x = x.replace(
    /^(?:I|l|1)?\s*NOME\s*/i,
    ""
  );


  /* Remove CNPJ/CPF/IE que veio grudado no nome */

  x = x.replace(
    /\s+(?:I|l|1)?\s*CNPJ\s*\/?\s*CPF.*$/i,
    ""
  );


  x = x.replace(
    /\s+(?:CNPJ|CPF|IE)\s*[:\-]?\s*.*$/i,
    ""
  );


  /* Remove campos que ficaram depois do nome */

  x = x.replace(
    /\s+(?:DATA\s+DA?\s+EMISSAO|DATA\s+EMISSAO|ENDERECO|ENDEREÇO|CEP|MUNICIPIO|MUNICÍPIO|UF|FONE|TELEFONE)\b.*$/i,
    ""
  );


  return clean(x);

}


/* =========================================================
   EXTRAIR NOME DE LINHA
========================================================= */

function extractNameFromLine(line){

  if(!line){
    return null;
  }


  let original = clean(line);

  let n = normalize(original);


  /*
     Caso OCR tenha produzido:

     INOME RAZÃO SOCIAL ICNPJ CPF IDATA DA EMISSÃO
  */

  let marker =
    n.search(
      /(?:I|L|1)?\s*NOME\s*\/?\s*RAZAO\s*SOCIAL/
    );


  if(marker >= 0){

    let candidate =
      original.substring(marker);


    candidate =
      cleanName(candidate);


    if(!isBadName(candidate)){
      return candidate;
    }

  }


  /*
     RAZÃO SOCIAL
  */

  let m =
    original.match(
      /RAZ[AÃ]O\s*SOCIAL\s*[:\-]?\s*(.+)/i
    );


  if(m){

    let candidate =
      cleanName(m[1]);


    if(!isBadName(candidate)){
      return candidate;
    }

  }


  /*
     NOME
  */

  m =
    original.match(
      /\bNOME\s*[:\-]?\s*(.+)/i
    );


  if(m){

    let candidate =
      cleanName(m[1]);


    if(!isBadName(candidate)){
      return candidate;
    }

  }


  return null;

}


/* =========================================================
   EXTRAIR NOME DO BLOCO
========================================================= */

function nameFromBlock(block){

  if(!block || !block.length){
    return null;
  }


  /* 1 — procurar diretamente em cada linha */

  for(let i=0;i<block.length;i++){

    let line =
      block[i];


    let candidate =
      extractNameFromLine(line);


    if(candidate){
      return candidate;
    }

  }


  /*
     2 — casos em que o OCR separou:

     NOME / RAZÃO SOCIAL
     EMPRESA XXXXX
     CNPJ XXXXX
  */

  for(let i=0;i<block.length;i++){

    let n =
      normalize(block[i]);


    if(
      /NOME\s*\/?\s*RAZAO\s*SOCIAL|RAZAO\s*SOCIAL|\bNOME\b/
        .test(n)
    ){

      for(
        let j=i+1;
        j<Math.min(i+6,block.length);
        j++
      ){

        let candidate =
          cleanName(block[j]);


        if(
          !isBadName(candidate) &&
          !findCnpj(candidate) &&
          !/ENDERECO|CEP|MUNICIPIO|UF|FONE|IE|INSCRICAO|DATA|EMISSAO|CPF/i.test(
            normalize(candidate)
          )
        ){
          return candidate;
        }

      }

    }

  }


  /*
     3 — tentar analisar o bloco inteiro
  */

  let joined =
    block.join(" ");


  let patterns = [

    /NOME\s*\/?\s*RAZAO\s*SOCIAL\s*[:\-]?\s*(.*?)(?=\s+(?:CNPJ|CPF|IE|ENDERECO|CEP|MUNICIPIO|DATA|EMISSAO)\b|$)/i,

    /RAZAO\s*SOCIAL\s*[:\-]?\s*(.*?)(?=\s+(?:CNPJ|CPF|IE|ENDERECO|CEP|MUNICIPIO|DATA|EMISSAO)\b|$)/i,

    /\bNOME\s*[:\-]?\s*(.*?)(?=\s+(?:CNPJ|CPF|IE|ENDERECO|CEP|MUNICIPIO|DATA|EMISSAO)\b|$)/i

  ];


  for(let re of patterns){

    let m =
      joined.match(re);


    if(m){

      let candidate =
        cleanName(m[1]);


      if(!isBadName(candidate)){
        return candidate;
      }

    }

  }


  return null;

}


/* =========================================================
   DESTINATÁRIO
========================================================= */

function recipient(raw){

  if(!raw){

    return {
      c:null,
      n:"Destinatário não identificado"
    };

  }


  let normalizedRaw =
    String(raw)
      .replace(/\r/g,"\n")
      .replace(/[ \t]+/g," ");


  let lines =
    normalizedRaw
      .split(/\n/)
      .map(x=>clean(x))
      .filter(Boolean);


  /*
     IMPORTANTE:

     O OCR muitas vezes não respeita as linhas
     originais do DANFE.

     Por isso também criamos uma versão
     onde cada CNPJ vira um ponto de análise.
  */


  /* =======================================================
     1 — LOCALIZAR BLOCO DESTINATÁRIO
  ======================================================= */

  const headerRegex =
    /DESTINAT[ÁAÃÂ][A-Z]*RIO|DESTINATARIO|DESTINATÁRIO/i;


  let starts=[];


  lines.forEach((line,i)=>{

    if(headerRegex.test(line)){
      starts.push(i);
    }

  });


  for(const start of starts){

    const block =
      lines.slice(start,start+25);


    const cnpjs =
      findAllCnpjs(block.join("\n"));


    /*
       Se existir CNPJ dentro do bloco,
       ele é forte candidato ao destinatário.
    */

    if(cnpjs.length){

      let c =
        cnpjs[0];


      let n =
        nameFromBlock(block);


      /*
         Se não achou o nome pelo rótulo,
         procura linhas próximas ao CNPJ.
      */

      if(!n){

        const cnpjIndex =
          block.findIndex(x =>
            valid(findCnpj(x) || "")
          );


        for(
          let i=Math.max(0,cnpjIndex-8);
          i<Math.min(block.length,cnpjIndex+5);
          i++
        ){

          let candidate =
            cleanName(block[i]);


          if(
            !isBadName(candidate) &&
            !findCnpj(candidate) &&
            !/CNPJ|CPF|IE|ENDERECO|CEP|MUNICIPIO|UF|FONE|TELEFONE|DATA|EMISSAO/i.test(
              normalize(candidate)
            )
          ){

            /*
               Evita capturar o próprio título
               DESTINATÁRIO.
            */

            if(
              !/DESTINATARIO|DESTINATÁRIO|REMETENTE|EMITENTE/i.test(
                normalize(candidate)
              )
            ){

              n = candidate;
              break;

            }

          }

        }

      }


      return {
        c,
        n:n || "Destinatário não identificado"
      };

    }

  }


  /* =======================================================
     2 — NOME / RAZÃO SOCIAL
  ======================================================= */

  for(let i=0;i<lines.length;i++){

    if(
      /NOME\s*\/?\s*RAZAO\s*SOCIAL|RAZAO\s*SOCIAL/i.test(
        lines[i]
      )
    ){

      const block =
        lines.slice(
          Math.max(0,i-3),
          i+12
        );


      const c =
        findCnpj(
          block.join("\n")
        );


      if(c){

        const n =
          nameFromBlock(block);


        return {
          c,
          n:n || "Destinatário não identificado"
        };

      }

    }

  }


  /* =======================================================
     3 — FALLBACK DESTINATÁRIO
  ======================================================= */

  const text =
    lines.join("\n");


  const matches =
    text.match(
      /DESTINAT[ÁAÃÂ][A-Z]*RIO[\s\S]{0,1500}/i
    );


  if(matches){

    const destText =
      matches[0];


    const c =
      findCnpj(destText);


    if(c){

      const destLines =
        destText
          .split(/\n/)
          .map(x=>clean(x))
          .filter(Boolean);


      const n =
        nameFromBlock(destLines);


      return {
        c,
        n:n || "Destinatário não identificado"
      };

    }

  }


  /*
     4 — FALLBACK ESPECIAL PARA OCR

     Quando o OCR transforma:

     DESTINATÁRIO
     NOME / RAZÃO SOCIAL
     EMPRESA
     CNPJ

     em uma única linha:

     DESTINATÁRIO INOME RAZÃO SOCIAL ICNPJ CPF ...
  */

  for(let i=0;i<lines.length;i++){

    let line =
      lines[i];


    let norm =
      normalize(line);


    if(
      /DESTINATARIO/.test(norm) &&
      /CNPJ/.test(norm)
    ){

      const c =
        findCnpj(line);


      if(c){

        let n =
          extractNameFromLine(
            line
          );


        if(!n){

          /*
             Remove o trecho até DESTINATÁRIO
             e tenta encontrar o nome antes do CNPJ.
          */

          let temp =
            line
              .replace(
                /^.*?DESTINAT[ÁAÃÂ][A-Z]*RIO\s*/i,
                ""
              );


          temp =
            temp.replace(
              /\s+(?:CNPJ|CPF|IE).*$/i,
              ""
            );


          n =
            cleanName(temp);


          if(isBadName(n)){
            n = null;
          }

        }


        return {
          c,
          n:n || "Destinatário não identificado"
        };

      }

    }

  }


  /*
     IMPORTANTE:

     Não pegamos simplesmente o primeiro CNPJ
     do documento.

     Isso poderia transformar o EMITENTE
     em destinatário.
  */

  return {
    c:null,
    n:"Destinatário não identificado"
  };

}


/* =========================================================
   OCR
========================================================= */

async function ocr(page){

  let viewport =
    page.getViewport({
      scale:3
    });


  let canvas =
    document.createElement("canvas");


  let ctx =
    canvas.getContext(
      "2d",
      {willReadFrequently:true}
    );


  canvas.width =
    Math.ceil(viewport.width);


  canvas.height =
    Math.ceil(viewport.height);


  /*
     Fundo branco.
  */

  ctx.fillStyle =
    "#ffffff";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  await page.render({
    canvasContext:ctx,
    viewport:viewport
  }).promise;


  /*
     OCR em português.
  */

  let result =
    await Tesseract.recognize(
      canvas,
      "por",
      {

        logger:m=>{

          if(
            m.status === "recognizing text"
          ){

            $("progress").textContent =
              `OCR: ${Math.round(
                (m.progress || 0) * 100
              )}%`;

          }

        }

      }
    );


  return result.data.text || "";

}


/* =========================================================
   ANALISAR
========================================================= */

$("analyze").onclick =
  analyze;


async function analyze(){

  $("analyze").disabled =
    true;


  groups.clear();


  $("results").innerHTML =
    "";


  $("results").className =
    "results";


  const mode =
    getMode();


  status(
    mode === "original"
      ? "Analisando PDF ORIGINAL pelo DESTINATÁRIO..."
      : "Analisando PDF DIGITALIZADO pelo OCR e DESTINATÁRIO...",
    "warn"
  );


  let total = 0;

  let ocrPages = 0;

  let unknown = 0;


  try{

    for(const f of files){

      const pdf =
        await pdfjsLib.getDocument({
          data:new Uint8Array(
            await f.arrayBuffer()
          )
        }).promise;


      total +=
        pdf.numPages;


      for(
        let p=1;
        p<=pdf.numPages;
        p++
      ){

        $("progress").textContent =
          `Analisando ${f.name}: página ${p} de ${pdf.numPages}`;


        const page =
          await pdf.getPage(p);


        /*
           ==================================================
           PDF ORIGINAL
           ==================================================
        */

        const tc =
          await page.getTextContent();


        let text =
          tc.items
            .map(x=>x.str || "")
            .join(" ");


        /*
           Para melhorar a leitura do PDF original,
           também preservamos uma versão por item.
        */

        let directLines =
          tc.items
            .map(x=>x.str || "")
            .filter(Boolean);


        let r =
          recipient(
            directLines.join("\n")
          );


        /*
           PDF DIGITALIZADO:
           OCR é obrigatório.
        */

        if(mode === "scanned"){

          const o =
            await ocr(page);


          ocrPages++;


          r =
            recipient(o);

        }


        /*
           PDF ORIGINAL:
           se não encontrou o destinatário,
           OCR é usado somente como reforço.
        */

        else if(!r.c){

          try{

            const o =
              await ocr(page);


            if(o.trim()){

              ocrPages++;


              const ocrResult =
                recipient(o);


              if(ocrResult.c){
                r = ocrResult;
              }

            }

          }catch(e){

            console.warn(
              "OCR de reforço indisponível:",
              e
            );

          }

        }


        /*
           Sem CNPJ:
           não adiciona como destinatário.
        */

        if(!r.c){

          unknown++;

          continue;

        }


        /*
           Cria grupo pelo CNPJ.
        */

        if(!groups.has(r.c)){

          groups.set(
            r.c,
            {
              name:r.n,
              pages:[]
            }
          );

        }


        const g =
          groups.get(r.c);


        /*
           Se posteriormente encontrarmos
           um nome melhor, atualizamos.
        */

        if(
          (
            !g.name ||
            g.name === "Destinatário não identificado"
          ) &&
          r.n &&
          r.n !== "Destinatário não identificado"
        ){

          g.name =
            r.n;

        }


        /*
           Guarda página original.
        */

        g.pages.push({
          f:f,
          p:p
        });

      }

    }


    render();


    if(!groups.size){

      status(
        "Não foi possível identificar o CNPJ do DESTINATÁRIO. Confira se o documento contém a área DESTINATÁRIO / NOME / RAZÃO SOCIAL.",
        "err"
      );

    }else{

      status(
        `${groups.size} destinatário(s)/CNPJ(s) encontrado(s). Cada destinatário terá seu próprio PDF.`,
        "ok"
      );

    }


    $("progress").textContent =
      `Análise concluída: ${total} página(s).` +
      (
        ocrPages
          ? ` OCR usado em ${ocrPages} página(s).`
          : ""
      ) +
      (
        unknown
          ? ` ${unknown} página(s) sem CNPJ de destinatário.`
          : ""
      );


  }catch(e){

    console.error(e);


    status(
      "Erro ao analisar o PDF. Verifique se o arquivo é um PDF fiscal válido.",
      "err"
    );


  }finally{

    $("analyze").disabled =
      !files.length;

  }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(s){

  return String(s || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   RESULTADOS
========================================================= */

function render(){

  let h = "";


  h += `
    <div class="section">
      ${groups.size}
      destinatário(s)/CNPJ(s) encontrado(s)
    </div>
  `;


  for(const [c,g] of groups){

    h += `

      <div class="item">

        <div>

          <div class="name">
            ${escapeHtml(
              g.name ||
              "Destinatário não identificado"
            )}
          </div>

          <div class="cnpj">
            CNPJ ${fmt(c)}
          </div>

          <div class="meta">
            ${g.pages.length}
            página(s) encontrada(s)
          </div>

        </div>


        <div class="item-actions">

          <button
            class="btn view"
            data-c="${c}"
          >
            👁 Visualizar PDF
          </button>


          <button
            class="btn download"
            data-c="${c}"
          >
            ⬇ Baixar PDF
          </button>

        </div>

      </div>

    `;

  }


  $("results").innerHTML =
    h +
    (
      groups.size
        ? ""
        : `
          <div class="empty">
            Nenhum destinatário identificado.
          </div>
        `
    );


  $("results").className =
    "results show";


  document
    .querySelectorAll(".view")
    .forEach(b=>{

      b.onclick =
        () => make(
          b.dataset.c,
          true
        );

    });


  document
    .querySelectorAll(".download")
    .forEach(b=>{

      b.onclick =
        () => make(
          b.dataset.c,
          false
        );

    });

}


/* =========================================================
   CRIAR PDF SEPARADO
========================================================= */

async function build(c){

  const g =
    groups.get(c);


  const out =
    await PDFLib.PDFDocument.create();


  const cache =
    new Map();


  for(const x of g.pages){

    let src =
      cache.get(x.f);


    if(!src){

      src =
        await PDFLib.PDFDocument.load(
          new Uint8Array(
            await x.f.arrayBuffer()
          )
        );


      cache.set(
        x.f,
        src
      );

    }


    const [page] =
      await out.copyPages(
        src,
        [x.p - 1]
      );


    out.addPage(page);

  }


  return out.save();

}


/* =========================================================
   VISUALIZAR / BAIXAR
========================================================= */

async function make(c,view){

  const g =
    groups.get(c);


  if(!g){
    return;
  }


  try{

    status(
      "Preparando PDF...",
      "warn"
    );


    const bytes =
      await build(c);


    const url =
      URL.createObjectURL(
        new Blob(
          [bytes],
          {type:"application/pdf"}
        )
      );


    if(view){

      window.open(
        url,
        "_blank"
      );

    }else{

      const a =
        document.createElement("a");


      a.href =
        url;


      /*
         Nome do arquivo:

         RAZÃO SOCIAL - CNPJ.pdf
      */

      a.download =
        `${clean(
          g.name ||
          "DESTINATARIO"
        )} - ${fmt(c)}.pdf`;


      document.body.appendChild(a);


      a.click();


      a.remove();

    }


    setTimeout(
      () => URL.revokeObjectURL(url),
      60000
    );


    status(
      "PDF preparado com sucesso.",
      "ok"
    );


  }catch(e){

    console.error(e);


    status(
      "Não foi possível gerar este PDF.",
      "err"
    );

  }

}
