<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>FiscalPDF — Organizador de NF-e e NFC-e</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f6fa;
    color: #10233f;
}

.header {
    background: #ffffff;
    border-bottom: 1px solid #dce5ef;
}

.header-content {
    max-width: 1100px;
    margin: auto;
    padding: 22px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
}

.logo {
    width: 58px;
    height: 58px;
    background: #0877d1;
    color: white;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 800;
    box-shadow: 0 6px 18px rgba(8,119,209,.20);
}

.brand h1 {
    margin: 0;
    font-size: 28px;
}

.brand p {
    margin: 5px 0 0;
    color: #60748b;
}

.container {
    max-width: 1100px;
    margin: 35px auto;
    padding: 0 20px;
}

.card {
    background: white;
    border: 1px solid #dce5ef;
    border-radius: 18px;

}

}

.title {

    font-weight: 800;
    margin-bottom: 7px;

.subtitle {

    margin-bottom: 25px;
}

.drop-area {

    border: 2px dashed #6caee5;

.drop-area:hover,

.drop-text {

input[type="file"] {
    display: none;

}

.btn-view {

<body>

<header class="header">
    <div class="header-content">

        <div class="logo">
            NF-e
        </div>

        <div class="brand">
            <h1>FiscalPDF</h1>
            <p>Organize NF-e e NFC-e pelo destinatário</p>
        </div>

    </div>
</header>

<main class="container">

<div class="card">

<div class="top">

    <div class="title">
        Organizar documentos fiscais
    </div>

    <div class="subtitle">
        Envie seus PDFs de notas fiscais e separe automaticamente por
        <strong>destinatário</strong>.
    </div>

    <div id="dropArea" class="drop-area">

        <div class="pdf-icon">📄</div>

        <div class="drop-title">
            Selecionar arquivos PDF
        </div>

        <div class="drop-text">
            ou arraste e solte seus PDFs fiscais aqui
        </div>

        <input
            id="fileInput"
            type="file"
            accept="application/pdf,.pdf"
            multiple
        >

    </div>

    <div class="actions">

        <button

        </button>

    </div>

    <div id="files" class="files"></div>

    <div id="results" class="results"></div>

</div>

</div>

</main>

<footer class="footer">
    FiscalPDF — Organizador de documentos fiscais
</footer>


<!-- MODAL VISUALIZAÇÃO -->

<div id="previewModal" class="preview-modal">

    <div class="preview-box">

        <div class="preview-header">

            <strong id="previewTitle">
                Visualização do PDF
            </strong>

            <button
                id="closePreview"
                class="close">
                Fechar ✕
            </button>

        </div>

        <iframe
            id="previewFrame"
            class="preview-frame">
        </iframe>

    </div>

</div>


<!-- PDF.JS -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs"
        type="module"></script>

<script type="module">

import * as pdfjsLib
from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";


/* =========================================================
   VARIÁVEIS
========================================================= */

const fileInput = document.getElementById("fileInput");
const dropArea = document.getElementById("dropArea");
const analyzeBtn = document.getElementById("analyzeBtn");
const clearBtn = document.getElementById("clearBtn");
const filesDiv = document.getElementById("files");
const resultsDiv = document.getElementById("results");
const statusDiv = document.getElementById("status");

const previewModal = document.getElementById("previewModal");
const previewFrame = document.getElementById("previewFrame");
const previewTitle = document.getElementById("previewTitle");
const closePreview = document.getElementById("closePreview");

let selectedFiles = [];
let generatedPDFs = [];


/* =========================================================
   UPLOAD
========================================================= */

dropArea.addEventListener("click", () => {
    fileInput.click();
});

fileInput.addEventListener("change", () => {

    const files = Array.from(fileInput.files);

    selectedFiles = files.filter(file =>
        file.type === "application/pdf" ||
        file.name.toLowerCase().endsWith(".pdf")
    );

    renderFiles();

});


dropArea.addEventListener("dragover", e => {

    e.preventDefault();

    dropArea.classList.add("dragover");

});


dropArea.addEventListener("dragleave", () => {

    dropArea.classList.remove("dragover");

});


dropArea.addEventListener("drop", e => {

    e.preventDefault();

    dropArea.classList.remove("dragover");

    selectedFiles = Array.from(e.dataTransfer.files)
        .filter(file =>
            file.type === "application/pdf" ||
            file.name.toLowerCase().endsWith(".pdf")
        );

    renderFiles();

});


/* =========================================================
   MOSTRAR ARQUIVOS
========================================================= */

function renderFiles() {

    filesDiv.innerHTML = "";

    if (!selectedFiles.length) {
        return;
    }

    selectedFiles.forEach((file, index) => {

        const div = document.createElement("div");

        div.className = "file-item";

        div.innerHTML = `
            <div>
                <div class="file-name">
                    📄 ${escapeHTML(file.name)}
                </div>

                <div class="file-size">
                    ${formatBytes(file.size)}
                </div>
            </div>

            <div>
                ${index + 1}
            </div>
        `;

        filesDiv.appendChild(div);

    });

}


/* =========================================================
   ANALISAR
========================================================= */

analyzeBtn.addEventListener("click", async () => {

    if (!selectedFiles.length) {

        showStatus(
            "Selecione pelo menos um PDF.",
            "error"
        );

        return;
    }

    generatedPDFs = [];

    resultsDiv.innerHTML = "";

    analyzeBtn.disabled = true;

    analyzeBtn.innerHTML =
        '<span class="spinner"></span> Analisando...';

    try {

        const groups = new Map();

        let totalPages = 0;

        let ocrPages = 0;

        for (const file of selectedFiles) {

            const result = await analyzePDF(file);

            totalPages += result.pages;

            ocrPages += result.ocrPages;

            for (const item of result.pagesData) {

                if (!item.cnpj) {
                    continue;
                }

                const key = normalizeCNPJ(item.cnpj);

                if (!groups.has(key)) {

                    groups.set(key, {

                        cnpj: formatCNPJ(item.cnpj),

                        name: item.name ||
                            "Destinatário não identificado",

                        pages: []

                    });

                }

                groups.get(key).pages.push({
                    pdf: result.pdf,
                    pageIndex: item.pageIndex
                });

                /*
                 * Se ainda não temos o nome e esta página
                 * conseguiu identificar o destinatário,
                 * atualiza o nome.
                 */

                if (
                    groups.get(key).name ===
                    "Destinatário não identificado"
                    &&
                    item.name
                ) {

                    groups.get(key).name = item.name;

                }

            }

        }


        if (!groups.size) {

            showStatus(
                "Não foi possível identificar o CNPJ do destinatário nos PDFs.",
                "error"
            );

            return;
        }


        showStatus(
            `${groups.size} destinatário(s)/CNPJ(s) encontrado(s). Cada destinatário terá seu próprio PDF.`,
            "success"
        );


        const info = document.createElement("div");

        info.style.marginTop = "14px";
        info.style.color = "#66798d";

        info.innerHTML =
            `Análise concluída: ${totalPages} página(s).` +
            (ocrPages
                ? ` OCR usado em ${ocrPages} página(s).`
                : "");

        resultsDiv.appendChild(info);


        const title = document.createElement("div");

        title.className = "results-title";

        title.style.marginTop = "28px";

        title.textContent =
            "Destinatários encontrados";

        resultsDiv.appendChild(title);


        for (const group of groups.values()) {

            await createGroupedPDF(group);

        }

    } catch (error) {

        console.error(error);

        showStatus(
            "Erro ao analisar o PDF. Verifique se o arquivo é um PDF válido.",
            "error"
        );

    } finally {

        analyzeBtn.disabled = false;

        analyzeBtn.innerHTML =
            "🔎 Analisar PDFs";

    }

});


/* =========================================================
   ANALISAR PDF
========================================================= */

async function analyzePDF(file) {

    const buffer =
        await file.arrayBuffer();

    const pdf =
        await pdfjsLib.getDocument({
            data: buffer
        }).promise;

    const pagesData = [];

    let ocrPages = 0;


    for (let pageIndex = 0;
         pageIndex < pdf.numPages;
         pageIndex++) {

        const page =
            await pdf.getPage(pageIndex + 1);

        const textContent =
            await page.getTextContent();

        let text =
            textContent.items
                .map(item => item.str)
                .join(" ");

        let data =
            identifyDestinatario(text);


        /*
         * Se o texto não conseguiu identificar,
         * tentamos OCR.
         */

        if (!data.cnpj) {

            try {

                const ocrText =
                    await runOCR(page);

                data =
                    identifyDestinatario(ocrText);

                if (ocrText.trim()) {
                    ocrPages++;
                }

            } catch (ocrError) {

                console.warn(
                    "OCR não disponível:",
                    ocrError
                );

            }

        }


        pagesData.push({

            pageIndex,

            cnpj: data.cnpj,

            name: data.name

        });

    }


    return {

        pdf,

        pages: pdf.numPages,

        pagesData,

        ocrPages

    };

}


/* =========================================================
   IDENTIFICAR DESTINATÁRIO
========================================================= */

function identifyDestinatario(text) {

    if (!text) {

        return {
            cnpj: null,
            name: null
        };

    }

    /*
     * Normalização do texto.
     */

    const clean =
        text
            .replace(/\s+/g, " ")
            .trim();


    /*
     * PRIMEIRA PRIORIDADE:
     *
     * DESTINATÁRIO
     *
     * O sistema procura primeiro a área do
     * destinatário para não pegar o CNPJ do emitente.
     */

    const destPatterns = [

        /DESTINAT[ÁA]RIO[\s:;-]*(.{0,1000})/i,

        /DADOS DO DESTINAT[ÁA]RIO[\s:;-]*(.{0,1000})/i,

        /IDENTIFICA[ÇC][ÃA]O DO DESTINAT[ÁA]RIO[\s:;-]*(.{0,1000})/i,

        /DESTINATARIO[\s:;-]*(.{0,1000})/i

    ];


    for (const pattern of destPatterns) {

        const match =
            clean.match(pattern);

        if (!match) {
            continue;
        }

        const area = match[1];

        const cnpjMatch =
            area.match(
                /\b\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}\b/
            );

        if (cnpjMatch) {

            const cnpj =
                normalizeCNPJ(cnpjMatch[0]);

            const name =
                findCompanyName(area, cnpjMatch[0]);

            return {
                cnpj,
                name
            };

        }

    }


    /*
     * SEGUNDA TENTATIVA:
     *
     * Procurar pelo campo CNPJ dentro de uma
     * região que contenha DESTINATÁRIO.
     */

    const destinationIndex =
        clean.toUpperCase()
            .indexOf("DESTINAT");

    if (destinationIndex >= 0) {

        const area =
            clean.substring(
                destinationIndex,
                destinationIndex + 1800
            );

        const cnpjMatch =
            area.match(
                /\b\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}\b/
            );

        if (cnpjMatch) {

            return {

                cnpj:
                    normalizeCNPJ(cnpjMatch[0]),

                name:
                    findCompanyName(
                        area,
                        cnpjMatch[0]
                    )

            };

        }

    }


    /*
     * TERCEIRA TENTATIVA:
     *
     * Alguns PDFs têm "CNPJ:" perto do nome do
     * destinatário.
     *
     * Procuramos todos os CNPJs e escolhemos um
     * que esteja próximo de DESTINATÁRIO.
     */

    const allCnpjs = [
        ...clean.matchAll(
            /\b\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}\b/g
        )
    ];

    let best = null;

    for (const match of allCnpjs) {

        const pos = match.index;

        const before =
            clean.substring(
                Math.max(0, pos - 500),
                pos
            ).toUpperCase();

        if (before.includes("DESTINAT")) {

            best = match;

        }

    }


    if (best) {

        return {

            cnpj:
                normalizeCNPJ(best[0]),

            name:
                findCompanyName(
                    clean.substring(
                        Math.max(0, best.index - 500),
                        best.index + 100
                    ),
                    best[0]
                )

        };

    }


    return {

        cnpj: null,

        name: null

    };

}


/* =========================================================
   IDENTIFICAR RAZÃO SOCIAL
========================================================= */

function findCompanyName(text, cnpj) {

    if (!text) {
        return null;
    }


    /*
     * Primeiro procura campos explícitos.
     */

    const patterns = [

        /NOME\/?RAZ[ÃA]O SOCIAL\s*[:\-]?\s*([A-ZÀ-Ú0-9&.,' \-]{4,120})/i,

        /RAZ[ÃA]O SOCIAL\s*[:\-]?\s*([A-ZÀ-Ú0-9&.,' \-]{4,120})/i,

        /NOME\s*[:\-]?\s*([A-ZÀ-Ú0-9&.,' \-]{4,120})/i,

        /NOME\/?RAZ[AÃ]O\s+SOCIAL\s*[:\-]?\s*([A-ZÀ-Ú0-9&.,' \-]{4,120})/i

    ];


    for (const pattern of patterns) {

        const match =
            text.match(pattern);

        if (match) {

            const name =
                cleanCompanyName(match[1]);

            if (name.length >= 4) {
                return name;
            }

        }

    }


    /*
     * Procura linhas próximas ao CNPJ.
     */

    const lines =
        text
            .split(/\n/)
            .map(x => x.trim())
            .filter(Boolean);


    const normalizedCnpj =
        normalizeCNPJ(cnpj);


    for (let i = 0;
         i < lines.length;
         i++) {

        const line =
            normalizeCNPJ(lines[i]);

        if (line.includes(normalizedCnpj)) {

            for (let j = i - 1;
                 j >= Math.max(0, i - 4);
                 j--) {

                const candidate =
                    cleanCompanyName(lines[j]);

                if (isPossibleCompanyName(candidate)) {

                    return candidate;

                }

            }

        }

    }


    /*
     * Última tentativa:
     * procura textos antes do CNPJ.
     */

    const cnpjPosition =
        text.indexOf(cnpj);

    if (cnpjPosition >= 0) {

        const before =
            text.substring(
                Math.max(0, cnpjPosition - 250),
                cnpjPosition
            );

        const candidates =
            before
                .split(/\n/)
                .map(x => cleanCompanyName(x))
                .filter(isPossibleCompanyName);

        if (candidates.length) {

            return candidates[candidates.length - 1];

        }

    }


    return null;

}


/* =========================================================
   LIMPAR NOME
========================================================= */

function cleanCompanyName(name) {

    if (!name) {
        return "";
    }

    return name
        .replace(/\s+/g, " ")
        .replace(
            /^(nome|razão social|nome\/razão social)\s*:?\s*/i,
            ""
        )
        .replace(
            /\bCNPJ\b.*$/i,
            ""
        )
        .trim();

}


function isPossibleCompanyName(name) {

    if (!name || name.length < 4) {
        return false;
    }

    const upper =
        name.toUpperCase();

    const forbidden = [

        "DESTINATARIO",
        "DESTINATÁRIO",
        "EMITENTE",
        "CNPJ",
        "CPF",
        "ENDERECO",
        "ENDEREÇO",
        "CEP",
        "TELEFONE",
        "INSCRICAO",
        "INSCRIÇÃO",
        "CHAVE",
        "NOTA FISCAL"

    ];

    if (
        forbidden.some(word =>
            upper.includes(word)
        )
    ) {
        return false;
    }

    /*
     * Deve ter letras.
     */

    return /[A-ZÀ-Ú]/i.test(name);

}


/* =========================================================
   CRIAR PDF SEPARADO
========================================================= */

async function createGroupedPDF(group) {

    /*
     * PDF-LIB é carregado sob demanda.
     */

    if (!window.PDFLib) {

        await loadScript(
            "https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"
        );

    }

    const PDFDocument =
        window.PDFLib.PDFDocument;


    const newPdf =
        await PDFDocument.create();


    for (const item of group.pages) {

        const sourceBytes =
            await getPDFBytes(item.pdf);

        const sourcePdf =
            await PDFDocument.load(
                sourceBytes
            );

        const copied =
            await newPdf.copyPages(
                sourcePdf,
                [item.pageIndex]
            );

        copied.forEach(page => {
            newPdf.addPage(page);
        });

    }


    const bytes =
        await newPdf.save();


    const blob =
        new Blob(
            [bytes],
            { type: "application/pdf" }
        );


    const url =
        URL.createObjectURL(blob);


    const safeName =
        sanitizeFileName(
            group.name ||
            "Destinatario nao identificado"
        );


    const fileName =
        `${safeName} - ${group.cnpj}.pdf`;


    generatedPDFs.push({

        name: group.name,

        cnpj: group.cnpj,

        pages: group.pages.length,

        blob,

        url,

        fileName

    });


    renderCompany(
        generatedPDFs[generatedPDFs.length - 1]
    );

}

/* =========================================================
   DOWNLOAD
========================================================= */

function downloadFile(blob, fileName) {

    const a =
        document.createElement("a");

    const url =
        URL.createObjectURL(blob);

    a.href = url;

    a.download = fileName;

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(() => {

        URL.revokeObjectURL(url);

    }, 1000);

}


/* =========================================================
   OCR
========================================================= */

async function runOCR(page) {

    /*
     * Carrega Tesseract apenas quando necessário.
     */

    if (!window.Tesseract) {

        await loadScript(
            "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"
        );

    }


    const viewport =
        page.getViewport({
            scale: 1.8
        });


    const canvas =
        document.createElement("canvas");

    const context =
        canvas.getContext("2d");


    canvas.width =
        viewport.width;

    canvas.height =
        viewport.height;


    await page.render({

        canvasContext: context,

        viewport

    }).promise;


    const result =
        await window.Tesseract.recognize(
            canvas,
            "por",
            {
                logger: () => {}
            }
        );


    return result.data.text || "";

}


/* =========================================================
   CARREGAR SCRIPT
========================================================= */

function loadScript(src) {

    return new Promise(
        (resolve, reject) => {

            const script =
                document.createElement("script");

            script.src = src;

            script.onload =
                resolve;

            script.onerror =
                reject;

            document.head.appendChild(
                script
            );

        }
    );

}


/* =========================================================
   PDF BYTES
========================================================= */

async function getPDFBytes(pdf) {

    /*
     * PDF.js mantém o arquivo original em
     * seu objeto interno. Recarregamos através
     * do arquivo quando possível.
     */

    if (pdf.__originalBytes) {
        return pdf.__originalBytes;
    }

    /*
     * Para cada PDF analisado precisamos guardar
     * os bytes originais.
     */

    throw new Error(
        "Arquivo PDF original não encontrado."
    );

}


/* =========================================================
   CORREÇÃO: guardar bytes originais
========================================================= */

const originalAnalyzePDF =
    analyzePDF;


/*
 * Substitui a função por uma versão que mantém
 * o arquivo original para geração dos PDFs.
 */

async function analyzePDFWithBytes(file) {

    const buffer =
        await file.arrayBuffer();

    const pdf =
        await pdfjsLib.getDocument({
            data: buffer.slice(0)
        }).promise;

    pdf.__originalBytes =
        buffer.slice(0);


    const pagesData = [];

    let ocrPages = 0;


    for (
        let pageIndex = 0;
        pageIndex < pdf.numPages;
        pageIndex++
    ) {

        const page =
            await pdf.getPage(
                pageIndex + 1
            );

        const textContent =
            await page.getTextContent();

        let text =
            textContent.items
                .map(item => item.str)
                .join(" ");

        let data =
            identifyDestinatario(text);


        if (!data.cnpj) {

            try {

                const ocrText =
                    await runOCR(page);

                data =
                    identifyDestinatario(
                        ocrText
                    );

                if (ocrText.trim()) {
                    ocrPages++;
                }

            } catch (e) {

                console.warn(
                    "OCR indisponível",
                    e
                );

            }

        }


        pagesData.push({

            pageIndex,

            cnpj: data.cnpj,

            name: data.name

        });

    }


    return {

        pdf,

        pages: pdf.numPages,

        pagesData,

        ocrPages

    };

}


/*
 * O analisador usado pelo botão é atualizado
 * para guardar os bytes originais.
 */

window._analyzePDF =
    analyzePDFWithBytes;


/* =========================================================
   NOVA VERSÃO DO ANALISADOR
========================================================= */

analyzeBtn.replaceWith(
    analyzeBtn.cloneNode(true)
);

const newAnalyzeBtn =
    document.getElementById("analyzeBtn");


newAnalyzeBtn.addEventListener(
    "click",
    async () => {

        if (!selectedFiles.length) {

            showStatus(
                "Selecione pelo menos um PDF.",
                "error"
            );

            return;

        }


        generatedPDFs = [];

        resultsDiv.innerHTML = "";

        newAnalyzeBtn.disabled = true;

        newAnalyzeBtn.innerHTML =
            '<span class="spinner"></span> Analisando...';


        try {

            const groups =
                new Map();

            let totalPages = 0;

            let ocrPages = 0;


            for (const file of selectedFiles) {

                const result =
                    await analyzePDFWithBytes(
                        file
                    );


                totalPages +=
                    result.pages;

                ocrPages +=
                    result.ocrPages;


                for (
                    const item
                    of result.pagesData
                ) {

                    if (!item.cnpj) {
                        continue;
                    }


                    const key =
                        normalizeCNPJ(
                            item.cnpj
                        );


                    if (!groups.has(key)) {

                        groups.set(key, {

                            cnpj:
                                formatCNPJ(
                                    item.cnpj
                                ),

                            name:
                                item.name ||
                                "Destinatário não identificado",

                            pages: []

                        });

                    }


                    const group =
                        groups.get(key);


                    group.pages.push({

                        pdf:
                            result.pdf,

                        pageIndex:
                            item.pageIndex

                    });


                    if (
                        group.name ===
                        "Destinatário não identificado"
                        &&
                        item.name
                    ) {

                        group.name =
                            item.name;

                    }

                }

            }


            if (!groups.size) {

                showStatus(
                    "Não foi possível identificar o CNPJ do destinatário nos PDFs.",
                    "error"
                );

                return;

            }


            showStatus(
                `${groups.size} destinatário(s)/CNPJ(s) encontrado(s). Cada destinatário terá seu próprio PDF.`,
                "success"
            );


            const info =
                document.createElement("div");

            info.style.marginTop =
                "14px";

            info.style.color =
                "#66798d";

            info.textContent =
                `Análise concluída: ${totalPages} página(s).` +
                (
                    ocrPages
                    ? ` OCR usado em ${ocrPages} página(s).`
                    : ""
                );


            resultsDiv.appendChild(info);


            const title =
                document.createElement("div");

            title.className =
                "results-title";

            title.style.marginTop =
                "28px";

            title.textContent =
                "Destinatários encontrados";


            resultsDiv.appendChild(title);


            for (
                const group
                of groups.values()
            ) {

                await createGroupedPDF(
                    group
                );

            }

        } catch (error) {

            console.error(error);

            showStatus(
                "Erro ao analisar o PDF. Verifique se o arquivo é válido.",
                "error"
            );

        } finally {

            newAnalyzeBtn.disabled =
                false;

            newAnalyzeBtn.innerHTML =
                "🔎 Analisar PDFs";

        }

    }
);

/* =========================================================
   CNPJ
========================================================= */

function normalizeCNPJ(cnpj) {

    return String(cnpj || "")
        .replace(/\D/g, "");

}


function formatCNPJ(cnpj) {

    const n =
        normalizeCNPJ(cnpj);

    if (n.length !== 14) {
        return cnpj;
    }

    return n.replace(
        /^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,
        "$1.$2.$3/$4-$5"
    );

}


/* =========================================================
   NOME DO ARQUIVO
========================================================= */

function sanitizeFileName(name) {

    return String(name || "Destinatario")
        .replace(/[<>:"/\\|?*\x00-\x1F]/g, "")
        .replace(/\s+/g, " ")
        .trim()
        .substring(0, 150);

}


/* =========================================================
   TAMANHO
========================================================= */

function formatBytes(bytes) {

    if (!bytes) {
        return "0 KB";
    }

    const units =
        ["B", "KB", "MB", "GB"];

    const i =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );

    return (
        (bytes /
        Math.pow(1024, i))
        .toFixed(i === 0 ? 0 : 1)
        + " "
        + units[i]
    );

}


/* =========================================================
   SEGURANÇA HTML
========================================================= */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}
