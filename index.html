<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FiscalPDF — Organizador de NF-e e NFC-e</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f7fc;
      color: #0f172a;
    }

    .container {
      width: min(1050px, calc(100% - 30px));
      margin: 35px auto;
    }

    .app {
      background: #fff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 35px rgba(15, 23, 42, .10);
      border: 1px solid #dbe5f0;
    }

    /* HEADER */

    .header {
      padding: 25px 30px;
      border-bottom: 1px solid #e3eaf3;
      background: linear-gradient(135deg, #ffffff, #f7fbff);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .nf-icon {
      width: 58px;
      height: 58px;
      border-radius: 12px;
      background: #0875d1;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      font-weight: 800;
      box-shadow: 0 5px 15px rgba(8,117,209,.25);
    }

    .brand h1 {
      margin: 0;
      font-size: 30px;
      color: #0b1f3a;
    }

    .brand p {
      margin: 4px 0 0;
      color: #64748b;
      font-size: 15px;
    }

    /* CONTENT */

    .content {
      padding: 30px;
    }

    .section-title {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 15px;
      color: #15365c;
    }

    /* MODE */

    .mode-box {
      margin-bottom: 22px;
    }

    .mode-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .mode-option {
      position: relative;
      cursor: pointer;
    }

    .mode-option input {
      position: absolute;
      opacity: 0;
    }

    .mode-card {
      padding: 18px;
      border: 2px solid #d9e4f0;
      border-radius: 13px;
      background: #fff;
      transition: .2s;
    }

    .mode-card:hover {
      border-color: #1685e5;
      background: #f7fbff;
    }

    .mode-option input:checked + .mode-card {
      border-color: #0875d1;
      background: #eef7ff;
      box-shadow: 0 4px 15px rgba(8,117,209,.10);
    }

    .mode-title {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 16px;
      font-weight: 800;
      color: #12365d;
      margin-bottom: 7px;
    }

    .mode-description {
      color: #64748b;
      font-size: 13px;
      line-height: 1.45;
    }

    .mode-badge {
      display: inline-block;
      margin-top: 9px;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 5px;
      background: #e2e8f0;
      color: #334155;
    }

    /* UPLOAD */

    .upload {
      border: 2px dashed #69a9e5;
      border-radius: 15px;
      min-height: 210px;
      background: #f8fbff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      transition: .2s;
      padding: 25px;
    }

    .upload:hover,
    .upload.dragover {
      border-color: #0875d1;
      background: #eef7ff;
    }

    .upload-icon {
      font-size: 43px;
      margin-bottom: 10px;
    }

    .upload h2 {
      margin: 0 0 8px;
      font-size: 19px;
      color: #0f172a;
    }

    .upload p {
      margin: 0;
      color: #64748b;
    }

    .upload input {
      display: none;
    }

    /* BUTTONS */

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 18px;
    }

    button {
      border: 0;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      border-radius: 10px;
      padding: 13px 20px;
      transition: .2s;
    }

    .btn-primary {
      background: #0875d1;
      color: #fff;
      box-shadow: 0 5px 14px rgba(8,117,209,.22);
    }

    .btn-primary:hover {
      background: #075fa9;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #e9eff6;
      color: #183451;
    }

    .btn-secondary:hover {
      background: #dce5ef;
    }

    .btn-view {
      background: #edf7ff;
      color: #0875d1;
      border: 1px solid #acd3f5;
    }

    .btn-download {
      background: #07834f;
      color: #fff;
    }

    .btn-download:hover {
      background: #056c41;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none !important;
    }

    /* STATUS */

    .status {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 10px;
      display: none;
      font-size: 14px;
    }

    .status.success {
      display: block;
      background: #ecfdf3;
      border: 1px solid #a7e8c3;
      color: #08753f;
    }

    .status.error {
      display: block;
      background: #fff1f1;
      border: 1px solid #f2b5b5;
      color: #c62828;
    }

    .status.info {
      display: block;
      background: #eef7ff;
      border: 1px solid #b9dafa;
      color: #075b9f;
    }

    /* FILE LIST */

    .file-list {
      margin-top: 20px;
    }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #e6edf4;
      color: #294665;
    }

    .file-size {
      color: #64748b;
      font-size: 12px;
    }

    /* RESULTS */

    .results {
      margin-top: 25px;
    }

    .results-title {
      font-size: 19px;
      font-weight: 800;
      color: #15365c;
      margin-bottom: 14px;
    }

    .company {
      border: 1px solid #d9e4ee;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 13px;
      background: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      box-shadow: 0 3px 10px rgba(15,23,42,.03);
    }

    .company-name {
      font-size: 17px;
      font-weight: 800;
      color: #102f50;
      margin-bottom: 7px;
      text-transform: uppercase;
    }

    .company-cnpj {
      font-size: 15px;
      color: #0875d1;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .company-pages {
      font-size: 13px;
      color: #64748b;
    }

    .company-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    /* LOADING */

    .loading {
      display: none;
      margin-top: 20px;
      text-align: center;
      padding: 20px;
      background: #f8fbff;
      border-radius: 10px;
    }

    .spinner {
      width: 30px;
      height: 30px;
      border: 4px solid #dceaf7;
      border-top-color: #0875d1;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* FOOTER */

    .footer {
      padding: 18px 30px;
      border-top: 1px solid #e4ebf2;
      text-align: center;
      color: #7890a8;
      font-size: 12px;
      background: #f8fbff;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      .container {
        width: calc(100% - 15px);
        margin: 15px auto;
      }

      .content,
      .header {
        padding: 20px;
      }

      .mode-options {
        grid-template-columns: 1fr;
      }

      .company {
        flex-direction: column;
        align-items: stretch;
      }

      .company-actions {
        width: 100%;
      }

      .company-actions button {
        flex: 1;
      }

      .actions {
        flex-direction: column;
      }

      .actions button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="app">

    <header class="header">

      <div class="brand">

        <div class="nf-icon">
          NF-e
        </div>

        <div>
          <h1>FiscalPDF</h1>
          <p>Organize NF-e e NFC-e pelo destinatário</p>
        </div>

      </div>

    </header>


    <main class="content">

      <!-- TIPO DE PDF -->

      <div class="mode-box">

        <div class="section-title">
          Tipo de PDF
        </div>

        <div class="mode-options">

          <label class="mode-option">

            <input
              type="radio"
              name="pdfMode"
              value="original"
              checked
            >

            <div class="mode-card">

              <div class="mode-title">
                📄 PDF ORIGINAL
              </div>

              <div class="mode-description">
                Use esta opção quando o PDF possui texto selecionável.
                É mais rápido e não precisa de OCR.
              </div>

              <span class="mode-badge">
                LEITURA DIRETA
              </span>

            </div>

          </label>


          <label class="mode-option">

            <input
              type="radio"
              name="pdfMode"
              value="scanned"
            >

            <div class="mode-card">

              <div class="mode-title">
                🖨️ PDF DIGITALIZADO
              </div>

              <div class="mode-description">
                Use esta opção quando o documento foi escaneado
                ou é composto por imagens. O sistema utilizará OCR.
              </div>

              <span class="mode-badge">
                OCR
              </span>

            </div>

          </label>

        </div>

      </div>


      <!-- UPLOAD -->

      <div
        class="upload"
        id="dropZone"
      >

        <div>

          <div class="upload-icon">
            📄
          </div>

          <h2>
            Selecionar arquivos PDF
          </h2>

          <p>
            ou arraste e solte seus PDFs fiscais aqui
          </p>

          <input
            type="file"
            id="fileInput"
            accept="application/pdf,.pdf"
            multiple
          >

        </div>

      </div>


      <!-- AÇÕES -->

      <div class="actions">

        <button
          class="btn-secondary"
          id="clearBtn"
        >
          Limpar
        </button>

        <button
          class="btn-primary"
          id="analyzeBtn"
        >
          🔎 Analisar PDFs
        </button>

      </div>


      <!-- STATUS -->

      <div
        id="status"
        class="status"
      ></div>


      <!-- LOADING -->

      <div
        id="loading"
        class="loading"
      >

        <div class="spinner"></div>

        <strong id="loadingText">
          Analisando PDFs...
        </strong>

      </div>


      <!-- ARQUIVOS -->

      <div
        id="fileList"
        class="file-list"
      ></div>


      <!-- RESULTADOS -->

      <div
        id="results"
        class="results"
        style="display:none;"
      >

        <div class="results-title">
          Destinos encontrados
        </div>

        <div id="companyList"></div>

      </div>

    </main>


    <footer class="footer">
      FiscalPDF • Organizador de documentos fiscais
    </footer>

  </div>

</div>


<!-- PDF.JS -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
        type="module"></script>


<!-- PDF-LIB -->

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>


<!-- TESSERACT OCR -->

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>


<script type="module">

  import * as pdfjsLib from
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";


  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


  const {
    PDFDocument
  } = PDFLib;


  const fileInput =
    document.getElementById("fileInput");

  const dropZone =
    document.getElementById("dropZone");

  const analyzeBtn =
    document.getElementById("analyzeBtn");

  const clearBtn =
    document.getElementById("clearBtn");

  const fileList =
    document.getElementById("fileList");

  const results =
    document.getElementById("results");

  const companyList =
    document.getElementById("companyList");

  const status =
    document.getElementById("status");

  const loading =
    document.getElementById("loading");

  const loadingText =
    document.getElementById("loadingText");


  let selectedFiles = [];

  let generatedPDFs = [];


  /* ==========================
     UPLOAD
  ========================== */

  dropZone.addEventListener("click", () => {
    fileInput.click();
  });


  fileInput.addEventListener("change", () => {

    selectedFiles = Array.from(fileInput.files);

    showFiles();

  });


  dropZone.addEventListener("dragover", (event) => {

    event.preventDefault();

    dropZone.classList.add("dragover");

  });


  dropZone.addEventListener("dragleave", () => {

    dropZone.classList.remove("dragover");

  });


  dropZone.addEventListener("drop", (event) => {

    event.preventDefault();

    dropZone.classList.remove("dragover");

    selectedFiles =
      Array.from(event.dataTransfer.files)
        .filter(file =>
          file.type === "application/pdf" ||
          file.name.toLowerCase().endsWith(".pdf")
        );

    showFiles();

  });


  function showFiles() {

    fileList.innerHTML = "";

    if (!selectedFiles.length) {
      return;
    }

    selectedFiles.forEach((file, index) => {

      const div =
        document.createElement("div");

      div.className = "file-item";

      div.innerHTML = `
        <div>
          📄 <strong>${escapeHtml(file.name)}</strong>
        </div>

        <div class="file-size">
          ${formatBytes(file.size)}
        </div>
      `;

      fileList.appendChild(div);

    });

    setStatus(
      `${selectedFiles.length} arquivo(s) selecionado(s).`,
      "info"
    );

  }


  /* ==========================
     ANALISAR
  ========================== */

  analyzeBtn.addEventListener("click", analyzePDFs);


  async function analyzePDFs() {

    if (!selectedFiles.length) {

      setStatus(
        "Selecione pelo menos um PDF.",
        "error"
      );

      return;

    }


    generatedPDFs = [];

    companyList.innerHTML = "";

    results.style.display = "none";

    loading.style.display = "block";

    analyzeBtn.disabled = true;


    try {

      const mode =
        document.querySelector(
          'input[name="pdfMode"]:checked'
        ).value;


      const groups = new Map();

      let totalPages = 0;

      let ocrPages = 0;


      for (
        let fileIndex = 0;
        fileIndex < selectedFiles.length;
        fileIndex++
      ) {

        const file =
          selectedFiles[fileIndex];


        loadingText.textContent =
          `Lendo ${file.name}...`;


        const bytes =
          await file.arrayBuffer();


        const pdf =
          await pdfjsLib.getDocument({
            data: bytes
          }).promise;


        totalPages += pdf.numPages;


        for (
          let pageNumber = 1;
          pageNumber <= pdf.numPages;
          pageNumber++
        ) {

          loadingText.textContent =
            `Analisando página ${pageNumber} de ${pdf.numPages} — ${file.name}`;


          const page =
            await pdf.getPage(pageNumber);


          let text = "";


          if (mode === "original") {

            const textContent =
              await page.getTextContent();


            text =
              textContent.items
                .map(item => item.str)
                .join(" ");

          }


          /*
            PDF DIGITALIZADO
          */

          if (
            mode === "scanned" ||
            text.trim().length < 20
          ) {

            ocrPages++;

            loadingText.textContent =
              `OCR na página ${pageNumber} de ${file.name}...`;


            text =
              await runOCR(page);

          }


          const information =
            identifyRecipient(text);


          /*
            Quando não encontramos CNPJ,
            usamos uma chave especial.
          */

          const cnpj =
            information.cnpj ||
            "NAO_IDENTIFICADO";


          const name =
            information.name ||
            "Destinatário não identificado";


          if (!groups.has(cnpj)) {

            groups.set(cnpj, {
              cnpj,
              name,
              pages: []
            });

          }


          groups.get(cnpj).pages.push({

            fileBytes: bytes,

            pageIndex: pageNumber - 1,

            fileName: file.name,

            pageNumber

          });

        }

      }


      loadingText.textContent =
        "Criando PDFs separados...";


      /*
        GERAR PDF DE CADA DESTINATÁRIO
      */

      for (const [cnpj, group] of groups) {

        if (cnpj === "NAO_IDENTIFICADO") {
          continue;
        }


        const output =
          await PDFDocument.create();


        /*
          Agrupa páginas preservando
          o PDF original.
        */

        const cache = new Map();


        for (const item of group.pages) {

          let sourcePDF =
            cache.get(item.fileName);


          if (!sourcePDF) {

            sourcePDF =
              await PDFDocument.load(
                item.fileBytes
              );

            cache.set(
              item.fileName,
              sourcePDF
            );

          }


          const copied =
            await output.copyPages(
              sourcePDF,
              [item.pageIndex]
            );


          copied.forEach(page => {
            output.addPage(page);
          });

        }


        const pdfBytes =
          await output.save();


        const filename =
          `${sanitizeFilename(group.name)} - ${formatCNPJ(cnpj)}.pdf`;


        generatedPDFs.push({

          name: group.name,

          cnpj,

          pages: group.pages,

          filename,

          bytes: pdfBytes

        });

      }


      renderResults(
        generatedPDFs,
        groups,
        totalPages,
        ocrPages
      );


    } catch (error) {

      console.error(error);

      setStatus(
        "Erro ao analisar o PDF. Verifique se o arquivo é um PDF fiscal válido.",
        "error"
      );

    } finally {

      loading.style.display = "none";

      analyzeBtn.disabled = false;

    }

  }


  /* ==========================
     OCR
  ========================== */

  async function runOCR(page) {

    const viewport =
      page.getViewport({
        scale: 2
      });


    const canvas =
      document.createElement("canvas");


    canvas.width =
      viewport.width;

    canvas.height =
      viewport.height;


    const context =
      canvas.getContext("2d");


    await page.render({
      canvasContext: context,
      viewport
    }).promise;


    const result =
      await Tesseract.recognize(
        canvas,
        "por",
        {
          logger: message => {

            if (
              message.status === "recognizing text"
            ) {

              const percent =
                Math.round(
                  (message.progress || 0) * 100
                );

              loadingText.textContent =
                `OCR reconhecendo texto... ${percent}%`;

            }

          }
        }
      );


    return result.data.text || "";

  }


  /* ==========================
     IDENTIFICAR DESTINATÁRIO
  ========================== */

  function identifyRecipient(text) {

    const normalized =
      normalizeText(text);


    const cnpjs =
      extractCNPJs(text);


    /*
      Procuramos primeiro o CNPJ
      associado ao DESTINATÁRIO.
    */

    let recipientCnpj = null;


    const destinationSection =
      findDestinationSection(text);


    if (destinationSection) {

      const destinationCnpjs =
        extractCNPJs(destinationSection);


      if (destinationCnpjs.length) {

        recipientCnpj =
          destinationCnpjs[0];

      }

    }


    /*
      Se não achou na seção,
      tenta os CNPJs encontrados.
    */

    if (!recipientCnpj && cnpjs.length) {

      recipientCnpj = cnpjs[0];

    }


    const name =
      extractRecipientName(
        destinationSection || text
      );


    return {

      cnpj: recipientCnpj,

      name

    };

  }


  /* ==========================
     SEÇÃO DESTINATÁRIO
  ========================== */

  function findDestinationSection(text) {

    const upper =
      text.toUpperCase();


    const positions = [

      "DESTINATÁRIO",

      "DESTINATARIO",

      "IDENTIFICAÇÃO DO DESTINATÁRIO",

      "IDENTIFICACAO DO DESTINATARIO",

      "DADOS DO DESTINATÁRIO",

      "DADOS DO DESTINATARIO"

    ];


    let start = -1;


    for (const word of positions) {

      const index =
        upper.indexOf(word);

      if (index !== -1) {

        start = index;

        break;

      }

    }


    if (start === -1) {

      return "";

    }


    /*
      Limitamos a busca para evitar
      pegar dados do emitente ou outros
      participantes da NF.
    */

    const section =
      text.substring(
        start,
        start + 2500
      );


    return section;

  }


  /* ==========================
     NOME DO DESTINATÁRIO
  ========================== */

  function extractRecipientName(text) {

    const lines =
      text
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(Boolean);


    const patterns = [

      /NOME\s*\/?\s*RAZ[AÃ]O\s*SOCIAL\s*[:\-]?\s*(.+)/i,

      /NOME\s*\/?\s*RAZAO\s*SOCIAL\s*[:\-]?\s*(.+)/i,

      /RAZ[AÃ]O\s*SOCIAL\s*[:\-]?\s*(.+)/i,

      /RAZAO\s*SOCIAL\s*[:\-]?\s*(.+)/i,

      /DESTINAT[AÁ]RIO\s*[:\-]?\s*(.+)/i,

      /DESTINATARIO\s*[:\-]?\s*(.+)/i

    ];


    for (const line of lines) {

      for (const pattern of patterns) {

        const match =
          line.match(pattern);


        if (match) {

          const value =
            cleanCompanyName(match[1]);


          if (isValidCompanyName(value)) {

            return value;

          }

        }

      }

    }


    /*
      Segunda tentativa:
      procura linhas próximas do
      título do destinatário.
    */

    const destinationIndex =
      lines.findIndex(line =>
        /DESTINAT[AÁ]RIO|DESTINATARIO/i.test(line)
      );


    if (destinationIndex !== -1) {

      for (
        let i = destinationIndex + 1;
        i < Math.min(destinationIndex + 8, lines.length);
        i++
      ) {

        const value =
          cleanCompanyName(lines[i]);


        if (
          isValidCompanyName(value) &&
          !/CNPJ|CPF|ENDERE|CEP|MUNIC|UF|INSCRI/i.test(value)
        ) {

          return value;

        }

      }

    }


    return "Destinatário não identificado";

  }


  function isValidCompanyName(value) {

    if (!value) return false;

    if (value.length < 4) return false;

    if (/^\d+$/.test(value)) return false;

    if (/CNPJ|CPF|CEP|ENDERE|MUNICIP|ESTADO|BAIRRO|FONE|TELEFONE/i.test(value)) {
      return false;
    }

    return true;

  }


  function cleanCompanyName(value) {

    return value
      .replace(/\s+/g, " ")
      .replace(/[|]+/g, " ")
      .trim()
      .replace(/^[:\-–—]+/, "")
      .trim();

  }


  /* ==========================
     CNPJ
  ========================== */

  function extractCNPJs(text) {

    const matches =
      text.match(
        /\b\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}\b/g
      ) || [];


    const unique =
      [];


    for (const value of matches) {

      const digits =
        value.replace(/\D/g, "");


      if (
        digits.length === 14 &&
        !unique.includes(digits)
      ) {

        unique.push(digits);

      }

    }


    return unique;

  }


  function formatCNPJ(cnpj) {

    const digits =
      cnpj.replace(/\D/g, "");


    if (digits.length !== 14) {

      return cnpj;

    }


    return digits.replace(
      /^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,
      "$1.$2.$3/$4-$5"
    );

  }


  /* ==========================
     RESULTADOS
  ========================== */

  function renderResults(
    pdfs,
    groups,
    totalPages,
    ocrPages
  ) {

    companyList.innerHTML = "";


    if (!pdfs.length) {

      setStatus(
        `Análise concluída: ${totalPages} página(s). Não foi possível identificar o CNPJ do destinatário.`,
        "error"
      );

      results.style.display = "none";

      return;

    }


    setStatus(
      `${pdfs.length} destinatário(s)/CNPJ(s) encontrado(s). Cada destinatário terá seu próprio PDF.`,
      "success"
    );


    const analysisInfo =
      document.createElement("div");


    analysisInfo.style.cssText =
      "margin:12px 0 18px;color:#64748b;font-size:14px;";


    analysisInfo.textContent =
      `Análise concluída: ${totalPages} página(s).` +
      (
        ocrPages
          ? ` OCR usado em ${ocrPages} página(s).`
          : ""
      );


    companyList.appendChild(
      analysisInfo
    );


    pdfs.forEach((pdf, index) => {

      const card =
        document.createElement("div");


      card.className =
        "company";


      const info =
        document.createElement("div");


      const name =
        document.createElement("div");


      name.className =
        "company-name";


      name.textContent =
        pdf.name;


      const cnpj =
        document.createElement("div");


      cnpj.className =
        "company-cnpj";


      cnpj.textContent =
        `CNPJ ${formatCNPJ(pdf.cnpj)}`;


      const pages =
        document.createElement("div");


      pages.className =
        "company-pages";


      pages.textContent =
        `${pdf.pages.length} página(s) encontrada(s)`;


      info.appendChild(name);

      info.appendChild(cnpj);

      info.appendChild(pages);


      const actions =
        document.createElement("div");


      actions.className =
        "company-actions";


      const view =
        document.createElement("button");


      view.className =
        "btn-view";


      view.textContent =
        "👁 Visualizar PDF";


      view.onclick =
        () => viewPDF(pdf);


      const download =
        document.createElement("button");


      download.className =
        "btn-download";


      download.textContent =
        "⬇ Baixar PDF";


      download.onclick =
        () => downloadPDF(pdf);


      actions.appendChild(view);

      actions.appendChild(download);


      card.appendChild(info);

      card.appendChild(actions);


      companyList.appendChild(card);

    });


    results.style.display = "block";

  }


  /* ==========================
     VISUALIZAR PDF
  ========================== */

  function viewPDF(pdf) {

    const blob =
      new Blob(
        [pdf.bytes],
        {
          type: "application/pdf"
        }
      );


    const url =
      URL.createObjectURL(blob);


    window.open(
      url,
      "_blank"
    );

  }


  /* ==========================
     BAIXAR PDF
  ========================== */

  function downloadPDF(pdf) {

    const blob =
      new Blob(
        [pdf.bytes],
        {
          type: "application/pdf"
        }
      );


    const url =
      URL.createObjectURL(blob);


    const link =
      document.createElement("a");


    link.href = url;

    link.download =
      pdf.filename;


    document.body.appendChild(link);

    link.click();

    link.remove();


    setTimeout(() => {

      URL.revokeObjectURL(url);

    }, 1000);

  }


  /* ==========================
     LIMPAR
  ========================== */

  clearBtn.addEventListener(
    "click",
    () => {

      selectedFiles = [];

      generatedPDFs = [];

      fileInput.value = "";

      fileList.innerHTML = "";

      companyList.innerHTML = "";

      results.style.display = "none";

      status.className = "status";

      status.textContent = "";

      loading.style.display = "none";

    }
  );


  /* ==========================
     STATUS
  ========================== */

  function setStatus(
    message,
    type
  ) {

    status.textContent =
      message;

    status.className =
      `status ${type}`;

  }


  /* ==========================
     UTILITÁRIOS
  ========================== */

  function sanitizeFilename(name) {

    return name
      .replace(/[<>:"/\\|?*\x00-\x1F]/g, "")
      .replace(/\s+/g, " ")
      .trim()
      .substring(0, 150);

  }


  function normalizeText(text) {

    return text
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toUpperCase();

  }


  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function formatBytes(bytes) {

    if (bytes < 1024) {
      return `${bytes} B`;
    }

    if (bytes < 1024 * 1024) {
      return `${(bytes / 1024).toFixed(1)} KB`;
    }

    return `${(bytes / 1024 / 1024).toFixed(1)} MB`;

  }

</script>
