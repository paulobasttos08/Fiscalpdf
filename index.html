<style>

}

body{

<body>

<div class="wrap">

  <div class="app">

    <header class="head">

      <div class="brand">

        <div class="logo">
          NF-e
        </div>

        <div>

          <h1>FiscalPDF</h1>

          <p>
            Organize NF-e e NFC-e pelo <b>destinatário</b>
          </p>

        </div>

      </div>

    </header>


    <main class="body">


      <!-- ==========================================
           MODO DE ANÁLISE
      =========================================== -->

      <div class="mode-title">
        Como deseja analisar o PDF?
      </div>


      <div class="mode-grid">


        <label
          class="mode-option selected"
          id="modeOriginal"
        >

          <input
            type="radio"
            name="mode"
            value="original"
            checked
          >

          <div class="mode-top">

            <span class="mode-icon">
              📄
            </span>

            <span>
              PDF ORIGINAL
            </span>

          </div>

          <p>
            Use quando o PDF possuir texto selecionável.
            É mais rápido e não precisa de OCR.
          </p>

          <span class="mode-tag">
            LEITURA DIRETA
          </span>

        </label>



        <label
          class="mode-option"
          id="modeScanned"
        >

          <input
            type="radio"
            name="mode"
            value="scanned"
          >

          <div class="mode-top">

            <span class="mode-icon">
              🖨️
            </span>

            <span>
              PDF DIGITALIZADO
            </span>

          </div>

          <p>
            Use quando o documento foi escaneado ou
            composto por imagens. O sistema utilizará OCR.
          </p>

          <span class="mode-tag">
            OCR
          </span>

        </label>


      </div>


      <!-- ==========================================
           UPLOAD
      =========================================== -->

      <label
        class="drop"
        for="files"
        id="drop"
      >

        <span class="drop-icon">
          📄
        </span>

        <b>
          Selecionar arquivos PDF
        </b>

        <span>
          ou arraste e solte seus PDFs fiscais aqui
        </span>

      </label>


      <input
        id="files"
        type="file"
        accept=".pdf,application/pdf"
        multiple
      >


      <!-- ==========================================
           AÇÕES
      =========================================== -->

      <div class="actions">

        <button
          id="clear"
          class="btn clear"
          disabled
        >
          Limpar
        </button>

        <button
          id="analyze"
          class="btn main"
          disabled
        >
          🔎 Analisar PDFs
        </button>

      </div>


      <div
        id="status"
        class="status"
      ></div>


      <div
        id="progress"
        class="progress"
      ></div>


      <div
        id="fileList"
      ></div>


      <div
        id="results"
        class="results"
      ></div>


    </main>

  </div>

</div>



<script>

/* =========================================================
   PDF.JS
========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================================
   VARIÁVEIS
========================================================= */

const $ = id => document.getElementById(id);

let files = [];

let groups = new Map();


/* =========================================================
   LIMPEZA DE TEXTO
========================================================= */

function clean(s){

  return String(s || "")
    .replace(/[\\/:*?"<>|]/g," ")
    .replace(/\s+/g," ")
    .trim();

}


function normalize(s){

  return String(s || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toUpperCase()
    .replace(/\s+/g," ")
    .trim();

}


function dig(s){

  return String(s || "")
    .replace(/\D/g,"");

}


/* =========================================================
   VALIDAÇÃO CNPJ
========================================================= */

function valid(c){

  c = dig(c);

  if(
    c.length !== 14 ||
    /^(\d)\1+$/.test(c)
  ){
    return false;
  }


  let sum = 0;
  let w = 5;


  for(let i=0;i<12;i++){

    sum += Number(c[i]) * w;

    w = w === 2 ? 9 : w - 1;

  }


  let d =
    sum % 11 < 2
      ? 0
      : 11 - (sum % 11);


  if(
    d !== Number(c[12])
  ){
    return false;
  }


  sum = 0;
  w = 6;


  for(let i=0;i<13;i++){

    sum += Number(c[i]) * w;

    w = w === 2 ? 9 : w - 1;

  }


  d =
    sum % 11 < 2
      ? 0
      : 11 - (sum % 11);


  return d === Number(c[13]);

}


/* =========================================================
   FORMATAR CNPJ
========================================================= */

function fmt(c){

  return c.replace(
    /(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,
    "$1.$2.$3/$4-$5"
  );

}


/* =========================================================
   STATUS
========================================================= */

function status(text,className){

  $("status").textContent = text;

  $("status").className =
    "status show " + className;

}


/* =========================================================
   LISTA DE ARQUIVOS
========================================================= */

function renderFiles(){

  $("fileList").innerHTML =
    files.map((f,i)=>`

      <div class="file">

        <span>
          📄 ${i+1}. ${escapeHtml(clean(f.name))}
        </span>

        <span class="file-size">
          ${formatBytes(f.size)}
        </span>

      </div>

    `).join("");


  $("analyze").disabled =
    !files.length;

  $("clear").disabled =
    !files.length;

}


/* =========================================================
   TAMANHO
========================================================= */

function formatBytes(bytes){

  if(!bytes){
    return "";
  }

  if(bytes < 1024){
    return bytes + " B";
  }

  if(bytes < 1024 * 1024){
    return (bytes / 1024).toFixed(1) + " KB";
  }

  return (
    bytes / (1024 * 1024)
  ).toFixed(1) + " MB";

}


/* =========================================================
   ADICIONAR ARQUIVOS
========================================================= */

function add(list){

  const pdfs =
    list.filter(f =>
      f.type === "application/pdf" ||
      /\.pdf$/i.test(f.name)
    );


  if(!pdfs.length){

    status(
      "Selecione um PDF válido.",
      "err"
    );

    return;
  }


  files.push(...pdfs);

  renderFiles();


  status(
    `${files.length} PDF(s) selecionado(s). Clique em Analisar PDFs.`,
    "ok"
  );

}


/* =========================================================
   INPUT
========================================================= */

$("files").onchange = () => {

  add([...$("files").files]);

};


/* =========================================================
   DRAG AND DROP
========================================================= */

const drop =
  $("drop");


drop.ondragover = e => {

  e.preventDefault();

  drop.style.borderColor =
    "#0877d1";

};


drop.ondragleave = () => {

  drop.style.borderColor =
    "#63a9e9";

};


drop.ondrop = e => {

  e.preventDefault();

  drop.style.borderColor =
    "#63a9e9";

  add([...e.dataTransfer.files]);

};


/* =========================================================
   LIMPAR
========================================================= */

$("clear").onclick = () => {

  files = [];

  groups.clear();

  $("files").value = "";

  $("fileList").innerHTML = "";

  $("results").innerHTML = "";

  $("results").className =
    "results";

  $("status").className =
    "status";

  $("progress").textContent =
    "";

};


/* =========================================================
   MODO ORIGINAL / DIGITALIZADO
========================================================= */

document
  .querySelectorAll('input[name="mode"]')
  .forEach(input => {

    input.addEventListener(
      "change",
      () => {

        $("modeOriginal")
          .classList.toggle(
            "selected",
            input.value === "original" &&
            input.checked
          );


        $("modeScanned")
          .classList.toggle(
            "selected",
            input.value === "scanned" &&
            input.checked
          );

      }
    );

  });


function getMode(){

  return document
    .querySelector(
      'input[name="mode"]:checked'
    )
    .value;

}


/* =========================================================
   CNPJ
========================================================= */

function findCnpj(text){

  if(!text){
    return null;
  }


  const matches =
    String(text).match(
      /\d{2}[.\s]?\d{3}[.\s]?\d{3}[\/\s]?\d{4}[-\s]?\d{2}/g
    ) || [];


  for(const x of matches){

    if(valid(x)){
      return dig(x);
    }

  }


  return null;

}


/* =========================================================
   PALAVRAS QUE NÃO PODEM SER NOME
========================================================= */

const BAD_WORDS = [

  "CNPJ",
  "CPF",
  "CNPJ CPF",
  "CNPJ/CPF",

  "NOME",
  "NOME RAZAO SOCIAL",
  "NOME/RAZAO SOCIAL",
  "RAZAO SOCIAL",

  "DATA",
  "DATA DA EMISSAO",
  "EMISSAO",

  "IE",
  "INSCRICAO",
  "INSCRICAO ESTADUAL",

  "ENDERECO",
  "ENDEREÇO",

  "CEP",

  "MUNICIPIO",
  "MUNICIPIO DE",
  "UF",

  "FONE",
  "TELEFONE",

  "DESTINATARIO",
  "DESTINATARIO/REMETENTE",

  "EMITENTE",

  "DANFE",

  "DOCUMENTO AUXILIAR",

  "NOTA FISCAL ELETRONICA",

  "NATUREZA DA OPERACAO",

  "SERIE",

  "NUMERO",

  "NUM",

  "CHAVE DE ACESSO"

];


/* =========================================================
   VERIFICA SE LINHA É UM LABEL
========================================================= */

function isLabel(line){

  const n = normalize(line);

  if(!n){
    return true;
  }


  if(
    BAD_WORDS.includes(n)
  ){
    return true;
  }


  /* Linhas compostas apenas por números */
  if(
    /^\d[\d\s./:;,-]*$/.test(n)
  ){
    return true;
  }


  /* Labels típicos do DANFE */
  if(
    /^(NOME|RAZAO|CNPJ|CPF|IE|INSCRICAO|DATA|EMISSAO|ENDERECO|CEP|MUNICIPIO|UF|FONE|TELEFONE)\b/.test(n)
  ){
    return true;
  }


  if(
    /DESTINATARIO|REMETENTE/.test(n)
  ){
    return true;
  }


  if(
    /DOCUMENTO AUXILIAR|NOTA FISCAL|DANFE/.test(n)
  ){
    return true;
  }


  return false;

}


/* =========================================================
   VERIFICA SE É UM NOME VÁLIDO
========================================================= */

function isGoodName(line){

  let s = cleanName(line);

  const n = normalize(s);


  if(!n){
    return false;
  }


  if(n.length < 4){
    return false;
  }


  if(isLabel(n)){
    return false;
  }


  /* Não aceitar CNPJ */
  if(findCnpj(s)){
    return false;
  }


  /* Não aceitar linhas somente numéricas */
  if(
    /^\d[\d\s./:;,-]*$/.test(n)
  ){
    return false;
  }


  /* Remover lixo comum do OCR */
  if(
    /^(NPJ|CNPJ|CPF|CPR|DATA|EMISSAO|EMISSAO DA NOTA|RAZAO|SOCIAL)$/i.test(n)
  ){
    return false;
  }


  /* Não aceitar texto claramente de endereço */
  if(
    /\b(RUA|AVENIDA|AV\.|RODOVIA|ROD\.|BR-|CEP|BAIRRO|MUNICIPIO|CIDADE)\b/i.test(n)
  ){
    return false;
  }


  /* Não aceitar textos técnicos do DANFE */
  if(
    /CHAVE DE ACESSO|PROTOCOLO|NATUREZA DA OPERACAO|VALOR TOTAL|BASE DE CALCULO|TRIBUTOS|ICMS|IPI|FRETE|TRANSPORTADOR/i.test(n)
  ){
    return false;
  }


  /* Precisa possuir letras */
  if(
    !/[A-ZÀ-Ÿ]{3}/i.test(s)
  ){
    return false;
  }


  return true;

}


/* =========================================================
   LIMPAR NOME
========================================================= */

function cleanName(s){

  return clean(s)

    .replace(
      /^[\s:;,.|'"`´\-–—]+/,
      ""
    )

    .replace(
      /[\s:;,.|'"`´\-–—]+$/,
      ""
    )

    .replace(
      /^(NOME|NOME\/RAZAO SOCIAL|RAZAO SOCIAL)\s*[:\-]*/i,
      ""
    )

    .replace(
      /^(NPJ|CNPJ|CPF)\s*[:\-]*/i,
      ""
    )

    .trim();

}


/* =========================================================
   CORRIGIR ERROS COMUNS DO OCR
========================================================= */

function repairOCR(text){

  return String(text || "")

    /* OCR pode transformar CNPJ em NPJ */
    .replace(/\bNPJ\b/gi,"CNPJ")

    /* OCR pode quebrar RAZÃO */
    .replace(/\bRAZAO\b/gi,"RAZAO")

    /* barras duplicadas */
    .replace(/\/{2,}/g,"/")

    /* espaços excessivos */
    .replace(/[ \t]+/g," ");

}


/* =========================================================
   LOCALIZAR NOME PELO BLOCO DO DESTINATÁRIO
========================================================= */

function extractRecipientName(lines, startIndex, cnpj){

  const max =
    Math.min(
      lines.length,
      startIndex + 30
    );


  const block =
    lines.slice(
      startIndex,
      max
    );


  /*
    PRIMEIRO:
    procura uma linha que contenha explicitamente
    NOME/RAZÃO SOCIAL.
  */

  for(let i=0;i<block.length;i++){

    const line =
      block[i];

    const n =
      normalize(line);


    if(
      /NOME\s*\/?\s*RAZAO\s*SOCIAL/.test(n) ||
      /RAZAO\s*SOCIAL/.test(n)
    ){

      /*
        O valor normalmente está na própria linha
        OU nas próximas linhas.
      */

      let same =
        line
          .replace(
            /.*?NOME\s*\/?\s*RAZAO\s*SOCIAL\s*[:;=\-]*/i,
            ""
          )
          .replace(
            /.*?RAZAO\s*SOCIAL\s*[:;=\-]*/i,
            ""
          )
          .trim();


      same =
        cleanName(same);


      /*
        Se sobrou somente outro label,
        ignoramos e vamos para a próxima linha.
      */

      if(
        isGoodName(same) &&
        normalize(same) !== normalize(cnpj)
      ){

        return same;

      }


      /*
        Procura o VALOR abaixo do título.
      */

      for(
        let j=i+1;
        j<Math.min(i+7,block.length);
        j++
      ){

        let candidate =
          cleanName(block[j]);


        if(
          !isGoodName(candidate)
        ){
          continue;
        }


        /*
          Se a linha contém o CNPJ,
          não é nome.
        */

        if(
          findCnpj(candidate)
        ){
          continue;
        }


        return candidate;

      }

    }

  }


  /*
    SEGUNDO MÉTODO:
    OCR pode juntar todos os títulos na mesma linha:

    "NOME RAZÃO SOCIAL CNPJ CPF DATA DA EMISSÃO"

    Nesse caso procuramos a próxima linha.
  */

  for(let i=0;i<block.length;i++){

    const n =
      normalize(block[i]);


    if(
      /NOME.*RAZAO.*SOCIAL.*CNPJ/.test(n)
    ){

      for(
        let j=i+1;
        j<Math.min(i+8,block.length);
        j++
      ){

        const candidate =
          cleanName(block[j]);


        if(
          isGoodName(candidate)
        ){

          return candidate;

        }

      }

    }

  }


  /*
    TERCEIRO MÉTODO:
    Se o CNPJ aparecer em uma linha,
    procura uma linha anterior próxima que pareça nome.
  */

  let cnpjIndex = -1;


  for(let i=0;i<block.length;i++){

    if(
      findCnpj(block[i])
    ){

      cnpjIndex=i;
      break;

    }

  }


  if(cnpjIndex >= 0){

    /*
      Tenta as linhas próximas ao CNPJ.
    */

    const candidates = [];


    for(
      let distance=1;
      distance<=6;
      distance++
    ){

      const before =
        cnpjIndex-distance;


      const after =
        cnpjIndex+distance;


      if(before >= 0){

        candidates.push(
          block[before]
        );

      }


      if(after < block.length){

        candidates.push(
          block[after]
        );

      }

    }


    for(
      const candidate of candidates
    ){

      const name =
        cleanName(candidate);


      if(
        isGoodName(name)
      ){

        return name;

      }

    }

  }


  return null;

}


/* =========================================================
   DESTINATÁRIO
========================================================= */

function recipient(raw){

  if(!raw){

    return {
      c:null,
      n:"Destinatário não identificado"
    };

  }


  raw =
    repairOCR(raw);


  let lines =
    raw
      .replace(/\r/g,"\n")
      .split(/\n/)
      .map(x=>clean(x))
      .filter(Boolean);


  /*
    OCR pode retornar tudo em uma única linha.
    Tentamos criar separações artificiais.
  */

  let expanded = [];


  for(const line of lines){

    /*
      Divide labels importantes quando OCR
      juntou vários campos.
    */

    const parts =
      line.split(
        /(?=\b(?:DESTINATARIO|DESTINATÁRIO|NOME\s*\/?\s*RAZAO|RAZAO\s*SOCIAL|CNPJ|CPF|DATA\s+DA\s+EMISSAO|DATA\s+DA\s+EMISSÃO)\b)/i
      );


    for(const part of parts){

      const x =
        clean(part);


      if(x){
        expanded.push(x);
      }

    }

  }


  lines =
    expanded.length
      ? expanded
      : lines;


  /* =======================================================
     1. DESTINATÁRIO / REMETENTE
  ======================================================= */

  const headerRegex =
    /DESTINAT[ÁAÃÂÄÀ]RIO|DESTINATARIO|REMETENTE/i;


  let starts=[];


  lines.forEach(
    (line,i)=>{

      if(
        headerRegex.test(line)
      ){

        starts.push(i);

      }

    }
  );


  for(
    const start of starts
  ){

    /*
      O bloco do destinatário é limitado.
      Isso é importante para não avançar até
      os dados do emitente ou transportador.
    */

    const block =
      lines.slice(
        start,
        Math.min(
          start+30,
          lines.length
        )
      );


    const blockText =
      block.join("\n");


    const c =
      findCnpj(blockText);


    if(!c){
      continue;
    }


    let n =
      extractRecipientName(
        block,
        0,
        c
      );


    /*
      Se não encontrou, tenta novamente
      ignorando a primeira linha.
    */

    if(!n){

      n =
        extractRecipientName(
          block.slice(1),
          0,
          c
        );

    }


    return {

      c:c,

      n:
        n ||
        "Destinatário não identificado"

    };

  }


  /* =======================================================
     2. NOME / RAZÃO SOCIAL + CNPJ
  ======================================================= */

  for(
    let i=0;
    i<lines.length;
    i++
  ){

    const n =
      normalize(lines[i]);


    if(
      /NOME\s*\/?\s*RAZAO\s*SOCIAL/.test(n) ||
      /RAZAO\s*SOCIAL/.test(n)
    ){

      const block =
        lines.slice(
          Math.max(0,i-2),
          Math.min(
            i+12,
            lines.length
          )
        );


      const c =
        findCnpj(
          block.join("\n")
        );


      if(c){

        const name =
          extractRecipientName(
            block,
            0,
            c
          );


        return {

          c:c,

          n:
            name ||
            "Destinatário não identificado"

        };

      }

    }

  }


  /* =======================================================
     3. FALLBACK MAIS RESTRITO
  ======================================================= */

  /*
    NÃO pegamos simplesmente o primeiro CNPJ.
    Isso evita transformar o emitente em destinatário.
  */

  return {

    c:null,

    n:"Destinatário não identificado"

  };

}


/* =========================================================
   OCR
========================================================= */

async function ocr(page){

  const viewport =
    page.getViewport({
      scale:3
    });


  const canvas =
    document.createElement(
      "canvas"
    );


  const ctx =
    canvas.getContext(
      "2d",
      {
        willReadFrequently:true
      }
    );


  canvas.width =
    Math.ceil(viewport.width);


  canvas.height =
    Math.ceil(viewport.height);


  await page.render({

    canvasContext:ctx,

    viewport:viewport

  }).promise;


  $("progress").textContent =
    "Preparando OCR...";


  const result =
    await Tesseract.recognize(
      canvas,
      "por",
      {

        logger:m=>{

          if(
            m.status ===
            "recognizing text"
          ){

            $("progress").textContent =
              `OCR: ${Math.round(
                (m.progress || 0) * 100
              )}%`;

          }

        }

      }
    );


  return result.data.text || "";

}


/* =========================================================
   ANALISAR
========================================================= */

$("analyze").onclick =
  analyze;


async function analyze(){

  $("analyze").disabled =
    true;


  groups.clear();


  $("results").innerHTML =
    "";

  $("results").className =
    "results";


  const mode =
    getMode();


  status(

    mode === "original"

      ? "Analisando PDF ORIGINAL pelo DESTINATÁRIO..."

      : "Analisando PDF DIGITALIZADO pelo OCR e DESTINATÁRIO...",

    "warn"

  );


  let total=0;

  let ocrPages=0;

  let unknown=0;


  try{

    for(
      const f of files
    ){

      $("progress").textContent =
        `Abrindo ${f.name}...`;


      const data =
        new Uint8Array(
          await f.arrayBuffer()
        );


      const pdf =
        await pdfjsLib
          .getDocument({
            data:data
          })
          .promise;


      total +=
        pdf.numPages;


      for(
        let p=1;
        p<=pdf.numPages;
        p++
      ){

        $("progress").textContent =
          `Analisando ${f.name}: página ${p} de ${pdf.numPages}`;


        const page =
          await pdf.getPage(p);


        let text="";


        /*
          =====================================================
          PDF ORIGINAL
          =====================================================
        */

        if(
          mode === "original"
        ){

          const tc =
            await page.getTextContent();


          text =
            tc.items
              .map(
                x=>x.str || ""
              )
              .join(" ");


          let r =
            recipient(text);


          /*
            Se a leitura direta não conseguiu encontrar
            o destinatário, usa OCR como reforço.
          */

          if(!r.c){

            try{

              const o =
                await ocr(page);


              if(
                o.trim()
              ){

                ocrPages++;


                r =
                  recipient(o);

              }

            }catch(e){

              console.warn(
                "OCR de reforço indisponível:",
                e
              );

            }

          }


          if(!r.c){

            unknown++;

            continue;

          }


          addGroup(
            r,
            f,
            p
          );

        }


        /*
          =====================================================
          PDF DIGITALIZADO
          =====================================================
        */

        else{

          const o =
            await ocr(page);


          ocrPages++;


          const r =
            recipient(o);


          if(!r.c){

            unknown++;

            continue;

          }


          addGroup(
            r,
            f,
            p
          );

        }

      }

    }


    render();


    if(
      !groups.size
    ){

      status(

        "Não foi possível identificar o CNPJ do DESTINATÁRIO. Confira se o documento contém a área DESTINATÁRIO / NOME / RAZÃO SOCIAL.",

        "err"

      );

    }else{

      status(

        `${groups.size} destinatário(s)/CNPJ(s) encontrado(s). Cada destinatário terá seu próprio PDF.`,

        "ok"

      );

    }


    $("progress").textContent =

      `Análise concluída: ${total} página(s).` +

      (
        ocrPages
          ? ` OCR usado em ${ocrPages} página(s).`
          : ""
      ) +

      (
        unknown
          ? ` ${unknown} página(s) sem CNPJ de destinatário.`
          : ""
      );


  }catch(e){

    console.error(e);


    status(

      "Erro ao analisar o PDF. Verifique se o arquivo é um PDF fiscal válido.",

      "err"

    );


    $("progress").textContent =
      e.message || "";

  }finally{

    $("analyze").disabled =
      !files.length;

  }

}


/* =========================================================
   ADICIONAR AO GRUPO
========================================================= */

function addGroup(
  r,
  file,
  page
){

  if(!groups.has(r.c)){

    groups.set(
      r.c,
      {
        name:r.n,
        pages:[]
      }
    );

  }


  const g =
    groups.get(r.c);


  /*
    Se anteriormente não tinha nome
    e agora encontrou, atualiza.
  */

  if(

    (
      !g.name ||
      g.name ===
      "Destinatário não identificado"
    ) &&

    r.n &&

    r.n !==
    "Destinatário não identificado"

  ){

    g.name =
      r.n;

  }


  g.pages.push({

    f:file,

    p:page

  });

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(s){

  return String(s || "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   RENDER RESULTADOS
========================================================= */

function render(){

  let h =

    `<div class="section">
      ${groups.size} destinatário(s)/CNPJ(s) encontrado(s)
    </div>`;


  for(
    const [c,g]
    of groups
  ){

    h += `

      <div class="item">

        <div>

          <div class="name">
            ${escapeHtml(
              g.name ||
              "Destinatário não identificado"
            )}
          </div>

          <div class="cnpj">
            CNPJ ${fmt(c)}
          </div>

          <div class="meta">
            ${g.pages.length}
            página(s) encontrada(s)
          </div>

        </div>


        <div class="item-actions">

          <button
            class="btn view"
            data-c="${c}"
          >
            👁 Visualizar PDF
          </button>


          <button
            class="btn download"
            data-c="${c}"
          >
            ⬇ Baixar PDF
          </button>

        </div>

      </div>

    `;

  }


  $("results").innerHTML =
    h +
    (
      groups.size
        ? ""
        : `<div class="meta">
             Nenhum destinatário identificado.
           </div>`
    );


  $("results").className =
    "results show";


  document
    .querySelectorAll(".view")
    .forEach(button=>{

      button.onclick =
        () => make(
          button.dataset.c,
          true
        );

    });


  document
    .querySelectorAll(".download")
    .forEach(button=>{

      button.onclick =
        () => make(
          button.dataset.c,
          false
        );

    });

}


/* =========================================================
   CRIAR PDF SEPARADO
========================================================= */

async function build(c){

  const g =
    groups.get(c);


  if(!g){
    throw new Error(
      "Destinatário não encontrado."
    );
  }


  const output =
    await PDFLib
      .PDFDocument
      .create();


  const cache =
    new Map();


  for(
    const x of g.pages
  ){

    let src =
      cache.get(x.f);


    if(!src){

      const data =
        new Uint8Array(
          await x.f.arrayBuffer()
        );


      src =
        await PDFLib
          .PDFDocument
          .load(data);


      cache.set(
        x.f,
        src
      );

    }


    const copied =
      await output.copyPages(
        src,
        [x.p - 1]
      );


    output.addPage(
      copied[0]
    );

  }


  return output.save();

}


/* =========================================================
   VISUALIZAR / BAIXAR
========================================================= */

async function make(
  c,
  view
){

  const g =
    groups.get(c);


  if(!g){
    return;
  }


  try{

    status(
      "Gerando PDF do destinatário...",
      "warn"
    );


    const bytes =
      await build(c);


    const blob =
      new Blob(
        [bytes],
        {
          type:"application/pdf"
        }
      );


    const url =
      URL.createObjectURL(
        blob
      );


    if(view){

      window.open(
        url,
        "_blank"
      );

    }else{

      const a =
        document.createElement(
          "a"
        );


      a.href =
        url;


      a.download =
        `${clean(
          g.name ||
          "DESTINATARIO"
        )} - ${fmt(c)}.pdf`;


      document.body.appendChild(a);

      a.click();

      a.remove();

    }


    setTimeout(
      () => URL.revokeObjectURL(url),
      60000
    );


    status(
      "PDF gerado com sucesso.",
      "ok"
    );


  }catch(e){

    console.error(e);


    status(
      "Não foi possível gerar este PDF.",
      "err"
    );

  }

}
